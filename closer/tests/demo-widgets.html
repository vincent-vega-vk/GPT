  .bar h1 { font: 800 22px/1 var(--font-display); font-stretch: 75%; text-transform: uppercase; margin-right: auto; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: transparent; padding: 6px 11px; font: 500 12px/1.2 var(--font-mono); color: var(--ink-2); }
  .seg button + button { border-left: 1px solid var(--line); }

  .var { margin: 0; width: calc(var(--w) + 34px); max-width: 100%; }
  .var figcaption { font: 600 10.5px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
  .frame { padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }

      ['Vuoto', { cols: ['Richiesta', 'Nostra posizione', 'Stato'], rows: [] }, TS_A], ['Tipico', TS_A, TS_B], ['Estremo', TS_X, TS_XB] ] },
    { type: 'board', title: 'Avanzamento del processo', vars: [
      ['Vuoto', { cols: [] }, BD_A], ['Tipico · 3 corsie', BD_A, BD_B], ['Due corsie', BD_2, BD_2B], ['Estremo · 4 corsie', BD_X, BD_XB] ] },
    { type: 'kpis', title: 'Indicatori', vars: [
      ['Vuoto', [], KP_A], ['Tipico', KP_A, KP_B], ['Estremo', KP_X, KP_XB] ] },
    { type: 'scorecard', title: 'CRM vs realtà', vars: [
      ['Vuoto', [], SC_A], ['Tipico', SC_A, SC_B], ['Estremo', SC_X, SC_XB] ] },
    { type: 'timeline', title: 'Percorso verso la firma', vars: [
      ['Vuoto', { items: [] }, TL_A], ['Tipico', TL_A, TL_B], ['Estremo', TL_X, TL_XB] ] },
    { type: 'checklist', title: 'Requisiti di gara', vars: [
      ['Vuoto', [], CL_A], ['Tipico', CL_A, CL_B], ['Estremo', CL_X, CL_XB] ] },
    { type: 'scoreboard', title: 'Punteggio stimato', vars: [
      ['Vuoto', { rows: [] }, SB_A], ['Tipico', SB_A, SB_B], ['Estremo', SB_X, SB_XB] ] },
  ];

  /* ───────────── rendering ───────────── */
  const root = document.getElementById('root');
  const cells = [];
  let phase = 0;
  const only = q.get('only');
  const varsQ = q.get('vars') ? q.get('vars').toLowerCase().split(',') : null;

  TYPES.filter((t) => !only || only.split(',').includes(t.type)).forEach((t) => {
    const vars = h('div', { class: 'vars' });
    t.vars.filter(([name]) => !varsQ || varsQ.some((v) => name.toLowerCase().startsWith(v))).forEach(([name, a, b]) => {
      const frame = h('div', { class: 'frame' });
      const cell = { type: t.type, title: t.title, a, b, last: null, frame, name };
      cells.push(cell);
      vars.appendChild(h('figure', { class: 'var', 'data-variant': name }, h('figcaption', null, name), frame));
    });
    root.appendChild(h('section', { class: 'ty', 'data-type': t.type }, h('div', { class: 'ty-h' }, h('h2', null, t.type), h('span', null, t.title)), vars));
  });

  function paint() {
    cells.forEach((c) => {
      const data = phase ? c.b : c.a;
      const el = UI.widget(c.type, c.title, data, c.last);
      c.last = data;
      c.frame.replaceChildren(el);
    });
  }
  paint();

  /* ───────────── controlli ───────────── */
  const seg = (id, apply) => {
    const box = document.getElementById(id);
    box.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      box.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      apply(b.dataset.v);
    });
    return (v) => { box.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.v === v))); apply(v); };
  };
  const setTheme = seg('seg-theme', (v) => { if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v); });
  const setW = seg('seg-w', (v) => { document.documentElement.style.setProperty('--w', v === 'fit' ? 'calc(100vw - 66px)' : v + 'px'); });
  const upd = document.getElementById('upd');
  upd.addEventListener('click', () => { phase = phase ? 0 : 1; upd.setAttribute('aria-pressed', String(!!phase)); paint(); });

  if (q.get('theme')) setTheme(q.get('theme'));
  if (q.get('w')) setW(q.get('w'));
  if (q.get('upd') === '1') { phase = 1; upd.setAttribute('aria-pressed', 'true'); paint(); }

  /* per i test automatici */
  window.__demo = { paint, toggle: () => upd.click(), cells };
})();
</script>
</body>
</html>
