      this.plan = null;
      this.planDone = false;
      this.special = null;
      this.keeperSpecial = false;
      this.trail = [];
      this.lastTrailT = 0;
      this.timeScale = 1;
      this.armed = false;
      this.resultInfo = null;
      this.moodSet = false;
      this.humanDove = false;
      this.keeperCmd = null;
      this.replay = null;
      this.replayed = false;
      this.texts = [];
      this.wobAmp = 0.035 + 0.17 * this.sit.pressure * (1.12 - this.kickerP.comp);
      this.wobPhase = this.rng() * 6;
      this.power = 0;
      this.powerT = 0;
      this.pressureBeat = 0;
      this.disp = 1.25 * PK.AI.kickSigma(this.kickerP, 0.8, this.sit.pressure, { sweet: true, errMul: HUMAN_ERR[this.difficulty] });
    }

    beginKick() {
      const so = this.so;
      this._prepareKick();
      if (so.sudden && !this.suddenGiven) {
        this.suddenGiven = true;
        ['A', 'B'].forEach((k) => { this.charges[k].kick++; this.charges[k].save++; });
      }
      this.kickNo++;
      this.dollyTarget = 0;
      const H = HUD();
      this._refreshHud();
      const tn = this.teams[this.team].name;
      const num = so.nextIndex + 1;
      const info = so.sudden ? `Oltranza — ${tn}` : `Rigore ${num} — ${tn}`;
      H.setKicker(`${this.kickerP.initial}. ${this.kickerP.name}`, this.kickerP.number, this.teams[this.team], this.sit);
      H.comment(info + (this.sit.mustScore ? ' · DEVE SEGNARE!' : this.sit.matchPoint ? ' · può chiudere la partita' : ''));
      this._enterPhase();
    }

    _enterPhase() {
      // intro pannelli se il rigore è importante
      const important = this.kickNo === 1 || this.sit.decisive || this.sit.sudden || this.isFinal;
      if (important) {
        this.phase = 'intro';
        this.pt = 0;
        this.introDur = this.kickNo === 1 || this.sit.decisive || this.sit.sudden ? 2.0 : 1.15;
        A().whoosh();
      } else this._startControl();
    }

    _startControl() {
      const H = HUD();
      this.pt = 0;
      if (this.auto) {
        this.phase = 'ready';
        this.readyT = 0.6;
        H.setMode('none');
        return;
      }
      if (this.humanKicks) {
        this.phase = 'aim';
        H.setMode('kick');
        H.setPrompt('Mira con il mouse/dito, poi premi TIRA e blocca la potenza nella zona verde');
        H.setPower(null, ZONE, false);
        H.setSpin(this.curve);
        this._refreshHud();
      } else {
        this.phase = 'ready';
        this.readyT = 1.1 + this.rng() * 0.9;
        H.setMode('save');
        H.setPrompt('PORTIERE! Clicca/tocca dove tuffarti (Q W E / A S D / Z X C). Puoi anticipare il tiro!');
      }
    }

    // ------------------------------------------------------------------ input
    onCanvasPoint(x, y, pointerType, down) {
      this.lastPt = { x, y };
      if (this.phase === 'aim' || this.phase === 'power') {
        const p = this.cam.unprojectZ(x, y - (pointerType === 'touch' ? this.h * 0.09 : 0), GOAL.Z);
        if (p) { this.aim.x = clamp(p.x, -5.2, 5.2); this.aim.y = clamp(p.y, 0.05, 3.5); }
      }
      if (!down) return;
      if (this.phase === 'intro') { this.pt = this.introDur; return; }
      if (this.phase === 'result' && this.pt > 0.7) { this.pt = 99; return; }
      if (this.phase === 'replay') { this.endReplay(); return; }
      if (this.phase === 'end') { this.advanceFromEnd(); return; }
      if (this.humanKicks && pointerType !== 'touch') this.pressKick();
      else if (this.humanKeeps && ['ready', 'run', 'flight'].includes(this.phase)) {
        const p = this.cam.unprojectZ(x, y, GOAL.Z);
        if (p) this.humanDive({ x: p.x, y: clamp(p.y, 0.1, 3.0) });
      }
    }

    key(code, down) {
      this.keys[code] = down;
      if (!down) return;
      if (this.phase === 'intro') { this.pt = this.introDur; return; }
      if (this.phase === 'result' && this.pt > 0.7) { this.pt = 99; return; }
      if (this.phase === 'replay') { this.endReplay(); return; }
      if (this.phase === 'replay') { this.endReplay(); return; }
      if (this.phase === 'end') { this.advanceFromEnd(); return; }
      if (code === 'KeyF') this.toggleSuper();
      if (this.humanKicks) {
        if (code === 'Space' || code === 'Enter') this.pressKick();
        if (code === 'KeyQ') this.setCurve(this.curve === -1 ? 0 : -1);
        if (code === 'KeyE') this.setCurve(this.curve === 1 ? 0 : 1);
      } else if (this.humanKeeps && ZONES[code] && ['ready', 'run', 'flight'].includes(this.phase)) {
        const z = ZONES[code];
        this.humanDive({ x: z[0], y: z[1] });
      }
    }

    setCurve(c) { this.curve = c; HUD().setSpin(c); A().tick(); }

    toggleSuper() {
      const side = this.playerSide;
      if (!side || this.auto) return;
      const ch = this.charges[side];
      const need = this.humanKicks ? ch.kick : ch.save;
      if (need <= 0) { HUD().comment('Nessun SUPER disponibile!'); return; }
      if (this.sim && this.sim.launched && this.humanKicks) return;
      this.armed = !this.armed;
      HUD().setSuper(this.charges, this.playerSide, this.armed);
      this.armed ? A().select() : A().tick();
    }

    pressKick() {
      if (this.phase === 'aim') {
        this.phase = 'power';
        this.powerT = 0;
        this.power = 0;
        HUD().setPrompt('Ferma la barra nella zona verde per un tiro perfetto!');
        A().tick();
      } else if (this.phase === 'power') {
        this.lockPower();
      }
    }

    humanDive(target) {
      if (this.humanDove || !this.sim || this.sim.result) return;
      let special = false;
      if (this.armed && this.charges[this.playerSide].save > 0) {
        special = true;
        this.charges[this.playerSide].save--;
        this.armed = false;
        this.keeperSpecial = true;
        const ks = PK.KEEPER_SPECIALS[this.keeperP.keeperSpecial % PK.KEEPER_SPECIALS.length];
        this.hitStop = 0.75;
        this.hitInfo = { kind: 'keeper', name: ks, who: this.keeperP.name, spec: { col: ['#ffd23a', '#ff8f00', '#fff6c8'], name: ks } };
        A().special();
        this._refreshHud();
      }
      this.humanDove = true;
      this._cmd(target, special);
      this.diveMarker = { x: target.x, y: target.y, t0: this.t };
      HUD().setPrompt('');
      A().whoosh();
      if (this.phase === 'ready') this.startRun();
    }

    // ----------------------------------------------------------------- potenza
    lockPower() {
      const p = this.power;
      const sweet = p >= ZONE.lo && p <= ZONE.hi;
      const over = p > ZONE.hi ? 1.0 + (p - ZONE.hi) * 3.2 : 1;
      const ch = this.charges[this.team];
      let spec = null;
      if (this.armed && sweet && ch.kick > 0) {
        ch.kick--;
        spec = PK.SPECIALS[this.kickerP.special];
      }
      const sigma = PK.AI.kickSigma(this.kickerP, p, this.sit.pressure, { sweet, errMul: HUMAN_ERR[this.difficulty] }) * over;
      const aimPt = { x: this.reticle.x, y: this.reticle.y };
      const target = PK.AI.applyError(aimPt, sigma, this.rng);
      this.shot = { target, power: Math.max(p, 0.25), curve: this.curve, spec, sigma, aimPt, sweet };
      this.history[aimPt.x < -1.2 ? 'L' : aimPt.x > 1.2 ? 'R' : 'C']++;
      this.kicker.aimX = target.x;
      A().tick();
      HUD().setMode('none');
      HUD().setPower(null, ZONE, false);
      HUD().setPrompt('');
      if (this.armed && !spec) HUD().comment('Fuori dalla zona verde: tiro normale');
      this.armed = false;
      this.startRun();
    }

    startRun() {
      if (this.phase === 'run' || this.phase === 'flight') return;
      this.phase = 'run';
      this.pt = 0;
      this.tContact = this.sim.t + PK.Kicker.T_RUN;
      A().whistle();
      HUD().setPrompt(this.humanKeeps ? 'TUFFATI!' : '');
      if (!this.humanKicks && !this.humanKeeps) HUD().setMode('none');
      // piano del portiere AI (quando tira l'umano o in modalità auto)
      if (!this.humanKeeps) {
        this.plan = PK.AI.keeperPlan({
          rng: this.rng, difficulty: this.difficulty, gk: this.teams[this.opp].gk,
          history: this.team === this.playerSide ? this.history : null, specialLeft: this.charges[this.opp].save, sit: this.sit,
        });
        if (this.plan.special) this.charges[this.opp].save--, (this.keeperSpecial = true);
      }
    }

    // ------------------------------------------------------------------ contatto
    doContact() {
      this.launched = true;
      const team = this.team;
      if (!this.shot) {
        // rigorista AI
        const dive = this.keeper.dive ? this.keeper.dive.dir : 0;
        const ch = PK.AI.kickerChoice(this.kickerP, {
          rng: this.rng, difficulty: this.difficulty, sit: this.sit, specialLeft: this.charges[team].kick, keeperDir: dive,
        });
        let spec = null;
        if (ch.special && this.charges[team].kick > 0) { this.charges[team].kick--; spec = PK.SPECIALS[this.kickerP.special]; }
        const target = PK.AI.applyError(ch.target, ch.sigma, this.rng);
        this.shot = { target, power: ch.power, curve: ch.curve, spec, sigma: ch.sigma };
        this.kicker.aimX = target.x;
      }
      const s = this.shot;
      const solved = PK.Phys.solveShot(s.target, s.power, s.curve, s.spec, { curveSign: s.target.x < 0 ? -1 : 1, phase: 0.7 + this.kickNo });
      this.special = s.spec;
      // scontro tra super: decide se sfonda
      if (this.special && this.keeperSpecial) {
        const kp = this.kickerP.pow * 100;
        const gp = this.teams[this.opp].gk;
        this.sim.breakThrough = this.rng() < clamp(0.5 + (kp - gp) * 0.012, 0.25, 0.75);
      }
      this.sim.launch({ v: solved.v, w: solved.w, wob: solved.wob, special: !!this.special });
      this.solved = solved;
      this.phase = 'flight';
      this.pt = 0;
      this.dollyTarget = 1;
      this.shake = Math.max(this.shake, 5 + 8 * s.power);
      this.flashA = this.special ? 0.9 : 0.25;
      // zolle di terra
      this.fx.burst('dust', { x: 0, y: 0.05, z: -0.1 }, 16, { speed: 3.4, up: 3, life: 0.9, size: 0.05, col: ['#3a7a2e', '#2a6a28', '#5a8a3a', '#6b5a2a'] });
      A().kick(s.power);
      this.timeScale = this.humanKeeps ? this.diff.slow : 0.55;
      if (this.special) {
        this.hitStop = 0.95;
        this.hitInfo = { kind: 'kick', name: this.special.name, who: this.kickerP.name, spec: this.special };
        this.timeScale = 0.3;
        A().special();
      }
      HUD().setPrompt(this.humanKeeps ? 'Tuffati!' : '');
      const kmh = Math.round(solved.speed * 3.6);
      this.speedText = `${kmh} km/h`;
    }

    // ------------------------------------------------------------- eventi fisici
    onSimEvent(ev) {
      const wp = (x, y, z) => ({ x, y, z });
      switch (ev.type) {
        case 'post': case 'bar':
          this.shake = Math.max(this.shake, 14);
          ev.type === 'post' ? A().post() : A().bar();
          this.fx.burst('spark', wp(ev.x, ev.y, GOAL.Z - 0.1), 18, { speed: 4, up: 2, life: 0.6, size: 0.035, col: ['#fff6a8', '#ffd23a', '#ffffff'], add: true });
          this.addText('CLANG!', ev.x, ev.y, GOAL.Z, 0.075, ['#ffffff', '#cfe6ff', '#6fa8ff']);
          this.flashA = Math.max(this.flashA, 0.3);
          A().oooh(1);
          break;
        case 'keeper':
          this.shake = Math.max(this.shake, 12);
          A().save();
          this.fx.burst('spark', wp(ev.x, ev.y, ev.z || GOAL.Z - 0.2), 14, { speed: 3.4, up: 1.5, life: 0.5, size: 0.03, col: ['#ffffff', '#9fd6ff'], add: true });
          this.addText(this.keeperSpecial ? 'BAAAM!' : 'PAF!', ev.x, ev.y + 0.2, GOAL.Z - 0.3, 0.07, this.keeperSpecial ? ['#fff7a8', '#ffc400', '#ff5a1f'] : ['#ffffff', '#bfe3ff', '#4aa8ff']);
          break;
        case 'catch':
          this.shake = 10;
          A().catch();
          this.addText('PRESA!', ev.x, ev.y + 0.2, GOAL.Z - 0.3, 0.07, ['#ffffff', '#bfe3ff', '#4aa8ff']);
          break;
        case 'clash':
          this.shake = 26; this.flashA = 0.9; A().boom();
          this.addText('SCONTRO!!', 0, 1.5, GOAL.Z - 0.4, 0.13, ['#ffffff', '#ffd23a', '#ff3d2e']);
          this.fx.burst('spark', wp(ev.x, ev.y, GOAL.Z - 0.2), 40, { speed: 7, up: 3, life: 0.9, size: 0.05, col: ['#fff', '#ffd23a', '#ff8f00'], add: true });
          break;
        case 'break':
          this.shake = 30; this.flashA = 1; A().boom();
          this.addText('SFONDA!!', 0, 1.6, GOAL.Z - 0.4, 0.14, ['#fff7a8', '#ffc400', '#ff3d2e']);
          this.fx.burst('spark', wp(ev.x, ev.y, GOAL.Z - 0.2), 50, { speed: 8, up: 3, life: 1, size: 0.05, col: ['#fff', '#ffd23a', '#ff3d2e'], add: true });
          break;
        case 'net':
          this.shake = Math.max(this.shake, 8 + ev.speed * 0.3);
          A().net(ev.speed);
          this.addText('SHWAAK!', ev.x, ev.y + 0.3, GOAL.Z + 1.2, 0.065, ['#ffffff', '#ffe36a', '#ff8a1f']);
          break;
        case 'bounce':
          A().bounce(ev.vn);
          break;
        case 'result':
          this.onResult(ev.result);
          break;
        default:
      }
    }

    addText(text, x, y, z, size, colors) {
      this.texts.push({ text, p: { x, y, z }, t0: this.t, dur: 1.1, size, colors, rot: (Math.random() - 0.5) * 0.4 });
    }

    // ----------------------------------------------------------------- risultato
    onResult(res) {
      if (this.resultInfo) return;
      const type = res.type;
      const scored = type === 'goal';
      const sp = !!this.special;
      let banner, line, mood = 'sad', kmood = 'sad';
      if (scored) {
        banner = sp && res.broke ? { text: 'SUPER GOL!', c1: '#ff9a1f', c2: '#8a1a00', sub: this.special.name } : { text: 'GOOOL!', c1: '#ff3d6b', c2: '#7a0a2a', sub: `${this.kickerP.name} · ${this.speedText || ''}` };
        line = res.woodHit ? pick(LINES.postGoal) : sp ? pick(LINES.goalSpecial) : pick(LINES.goal);
        mood = 'cheer'; kmood = 'sad';
        A().cheer(1.0);
      } else if (type === 'saved') {
        const ks = this.keeperSpecial;
        banner = ks ? { text: 'SUPER PARATA!', c1: '#ffd23a', c2: '#a35a00', sub: PK.KEEPER_SPECIALS[this.keeperP.keeperSpecial % 5] } : { text: 'PARATA!', c1: '#2aa8ff', c2: '#0a2a6a', sub: this.keeperP.name };
        line = ks ? pick(LINES.savedSpecial) : pick(LINES.saved);
        mood = 'sad'; kmood = 'cheer';
        A().cheer(0.8); A().groan(0.6);
      } else if (type === 'post' || this.sim.woodHit) {
        const bar = this.sim.events.some((e) => e.type === 'bar');
        banner = { text: bar ? 'TRAVERSA!' : 'PALO!', c1: '#c9d3e8', c2: '#3a4560', sub: 'Il legno nega il gol' };
        line = bar ? pick(LINES.bar) : pick(LINES.post);
        A().groan(1.0);
      } else {
        const over = type === 'over';
        banner = { text: over ? 'ALTO!' : 'FUORI!', c1: '#b0b8c8', c2: '#3a3f4f', sub: this.kickerP.name };
        line = over ? pick(LINES.over) : pick(LINES.wide);
        A().boo(1);
      }
      this.resultInfo = { type, scored, banner, line, res };
      HUD().comment(line);
      this.bannerInfo = { t0: this.t, dur: 2.0, ...banner };
      this.energy = scored ? 1 : type === 'saved' ? 0.8 : 0.35;
      const tk = this.sim.t - this.tContact;
      this.kicker.setMood(mood === 'cheer' ? 'cheer' : 'sad', Math.max(0.25, tk), this.rng() < 0.5 ? 1 : -1);
      this.keeper.setMood(kmood === 'cheer' ? 'cheer' : 'sad', this.sim.t);
      this.moodSet = true;
      this.dollyTarget = scored ? 0.3 : type === 'saved' ? 0.7 : 0.5;
      if (scored) this.fx.burst('conf', { x: 0, y: 3.2, z: GOAL.Z - 2 }, 90, { speed: 5, up: 4, life: 2.8, size: 0.08, col: [this.kits[this.team].shirt, this.kits[this.team].trim, '#ffd23a', '#ffffff'], g: 3 });
      this.phase = 'result';
      this.pt = 0;
      HUD().setPrompt('');
      HUD().setMode('none');
    }

    commitKick() {
      const sc = !!(this.resultInfo && this.resultInfo.scored);
      this.so.record(this.team, sc);
      this.results[this.team].push(sc);
      this.kickLog.push({ team: this.team, scored: sc, kicker: this.kickerP.name, idx: this.so.taken[this.team] - 1 });
      this._refreshHud();
      if (this.so.over) this.finish();
      else this.beginKick();
    }

    finish() {
      this.phase = 'end';
      this.pt = 0;
      this.dollyTarget = 0;
      const so = this.so;
      this.result = {
        goals: { A: so.goals.A, B: so.goals.B }, winner: so.winner, kicks: this.kickLog.slice(), first: this.first,
        sudden: so.taken.A > so.K || so.taken.B > so.K, sim: false,
      };
      HUD().setMode('none');
      HUD().setPrompt('');
      const w = so.winner;
      HUD().comment(w ? `FINE! Vince ${this.teams[w].name} ${so.goals[w]}-${so.goals[other(w)]} ai rigori` : `FINE! Pareggio ${so.goals.A}-${so.goals.B}`);
      A().whistle();
      setTimeout(() => A().whistle(), 400);
      if (w) A().cheer(1.2);
    }

    // ------------------------------------------------------------------ ripetizione
    wantReplay() {
      const r = this.resultInfo;
      if (!r || this.replayed || this.auto) return false;
      const res = r.res;
      return !!(this.special || this.keeperSpecial || res.woodHit || (this.sit.decisive && res.type !== 'short'));
    }

    startReplay() {
      const sim0 = this.sim;
      const rk = new PK.Keeper({ seed: this.keeper.seed });
      const tStart = this.tContact - 0.55;
      const rs = new PK.Phys.Sim(rk, { t0: tStart, breakThrough: sim0.breakThrough });
      const sx = this.shot && this.shot.target.x >= 0 ? 1 : -1;
      const cam = new PK.Camera();
      cam.setSize(this.w, this.h);
      this.replay = {
        sim: rs, keeper: rk, cam, sx, t: 0, launched: false, cmdDone: false, trail: [], lastTrail: 0, speed: 0.5, over: 0,
        kicker: new PK.Kicker({ foot: this.kickerP.foot, aimX: this.shot ? this.shot.target.x : 0 }),
      };
      if (this.keeperCmd && this.keeperCmd.t < tStart) {
        rk.command(this.keeperCmd.t, this.keeperCmd.target, { special: this.keeperCmd.special });
        this.replay.cmdDone = true;
      }
      this.replayed = true;
      this.phase = 'replay';
      this.pt = 0;
      this.shake = 0;
      HUD().setReplay(true);
      A().whoosh();
    }

    updateReplay(dt) {
      const R = this.replay;
      if (!R) return this.endReplay();
      const rs = R.sim;
      if (this.pt > 0.45 && !R.running) R.running = true;
      if (R.running) {
        rs.advance(dt * R.speed);
        if (!R.cmdDone && this.keeperCmd && rs.t >= this.keeperCmd.t) {
          R.cmdDone = true;
          R.keeper.command(this.keeperCmd.t, this.keeperCmd.target, { special: this.keeperCmd.special });
        }
        if (!R.launched && rs.t >= this.tContact) {
          R.launched = true;
          rs.launch({ v: this.solved.v, w: this.solved.w, wob: this.solved.wob, special: !!this.special });
        }
        if (R.launched && rs.t - R.lastTrail > 1 / 120) {
          R.lastTrail = rs.t;
          R.trail.push({ p: { x: rs.ball.p.x, y: rs.ball.p.y, z: rs.ball.p.z } });
          if (R.trail.length > 16) R.trail.shift();
        }
        if (rs.result) R.over += dt;
      }
      // camera dietro la porta, dal lato del tiro
      const cam = R.cam;
      const k = Math.min(1, this.pt / 1.2);
      const bp = rs.ball.p;
      cam.pos = { x: R.sx * (4.6 - 0.8 * k), y: 1.55, z: 14.7 };
      cam.target = { x: lerp(0, clamp(bp.x, -4, 4), 0.35), y: 1.0 + (clamp(bp.y, 0, 2.6) - 1) * 0.15, z: lerp(8.5, 10.4, k) };
      cam.f = cam.baseF() * 0.72;
      cam.shakeX = cam.shakeY = 0;
      if (R.over > 1.3 || this.pt > 9) this.endReplay();
    }

    endReplay() {
      this.replay = null;
      HUD().setReplay(false);
      this.commitKick();
    }

    // ------------------------------------------------------------------ update
    resize(w, h) {
      this.w = w; this.h = h;
      this.cam.setSize(w, h);
    }

    update(dtReal) {
      const dt = Math.min(dtReal, 0.05);
      this.t += dt;
      this.pt += dt;
      this.shake *= Math.exp(-9 * dt);
      this.flashA = Math.max(0, this.flashA - dt * 2.2);
      this.fx.update(dt);
      this.energy = M.damp(this.energy, this.phase === 'result' ? this.energy : 0.18 + 0.4 * (this.sit ? this.sit.pressure : 0.2), 0.7, dt);
      this.texts = this.texts.filter((tx) => this.t - tx.t0 < tx.dur);
      this.crowdT = (this.crowdT || 0) - dt;
      if (this.crowdT <= 0) { this.crowdT = 0.6; A().crowd(this.energy); }
      const ph = this.phase;
      if (ph === 'coin') {
        if (this.pt > 2.4) this.beginKick();
      } else if (ph === 'intro') {
        if (this.pt >= this.introDur) this._startControl();
        this.stepSim(dt);
      } else if (ph === 'aim' || ph === 'power') {
        this.updateAim(dt);
        this.stepSim(dt);
      } else if (ph === 'ready') {
        this.stepSim(dt);
        if (this.pt > this.readyT) this.startRun();
      } else if (ph === 'run' || ph === 'flight') {
        if (this.hitStop > 0) {
          this.hitStop -= dt;
          if (this.hitStop <= 0) { this.hitStop = 0; this.hitInfo = null; A().whoosh(); }
        } else {
          this.stepSim(dt * this.timeScale);
          this.afterStep();
        }
      } else if (ph === 'result') {
        // torna alla velocità normale
        this.timeScale = M.damp(this.timeScale, 1, 5, dt);
        this.stepSim(dt * this.timeScale);
        if (this.pt > 2.7) {
          if (this.wantReplay()) this.startReplay(); else this.commitKick();
        }
      } else if (ph === 'replay') {
        this.updateReplay(dt);
      } else if (ph === 'end') {
        this.stepSim(dt);
        if (this.pt > 1.0 && this.auto && !this.finished) this._deliver();
      }
      this.updateCamera(dt);
      // tensione: battito cardiaco
      if ((ph === 'aim' || ph === 'power' || ph === 'ready') && this.sit && this.sit.pressure > 0.7) {
        this.pressureBeat -= dt;
        if (this.pressureBeat <= 0) { this.pressureBeat = 0.95; A().heartbeat(this.sit.pressure); this.beatPulse = 1; }
      }
      this.beatPulse = Math.max(0, (this.beatPulse || 0) - dt * 3);
    }

    stepSim(dt) {
      if (!this.sim) return;
      this.sim.advance(dt);
    }

    afterStep() {
      const sim = this.sim;
      // contatto
      if (!this.launched && sim.t >= this.tContact) this.doContact();
      // portiere AI
      if (this.plan && !this.planDone && !this.humanKeeps) {
        const p = this.plan;
        if (p.mode === 'early' && sim.t >= this.tContact + p.t) {
          this.planDone = true;
          this._cmd(p.target, p.special);
          if (p.special) this.aiKeeperSpecialFx();
        } else if (p.mode === 'react' && this.launched && sim.sinceLaunch >= p.t) {
          this.planDone = true;
          const tg = PK.AI.keeperReadTarget(sim, p, this.rng);
          this._cmd(tg, p.special);
          if (p.special) this.aiKeeperSpecialFx();
        }
      }
      // scia del pallone
      if (this.launched && sim.t - this.lastTrailT > 1 / 120) {
        this.lastTrailT = sim.t;
        this.trail.push({ p: { x: sim.ball.p.x, y: sim.ball.p.y, z: sim.ball.p.z } });
        if (this.trail.length > (this.special ? 22 : 11)) this.trail.shift();
      }
      // fiamme / scintille speciali
      if (this.special && this.launched && !sim.result) {
        const b = sim.ball.p;
        this.fx.burst('flame', b, 1, { speed: 0.6, up: 0.4, life: 0.5, size: 0.07, col: [this.special.col[0], this.special.col[1]], g: 0, add: true });
      }
      // zoom del tempo: rallenta sul finale del volo vicino alla porta
      if (this.launched && !sim.result) {
        const z = sim.ball.p.z;
        if (z > 8 && !this.humanKeeps) this.timeScale = M.damp(this.timeScale, this.special ? 0.22 : 0.4, 4, 0.016);
      }
    }

    _cmd(target, special) {
      this.keeperCmd = { t: this.sim.t, target: { x: target.x, y: target.y }, special: !!special };
      this.keeper.command(this.sim.t, target, { special: !!special });
    }

    aiKeeperSpecialFx() {
      if (this.humanKeeps) return;
      const ks = PK.KEEPER_SPECIALS[this.keeperP.keeperSpecial % 5];
      this.hitStop = 0.7;
      this.hitInfo = { kind: 'keeper', name: ks, who: this.keeperP.name, spec: { col: ['#ffd23a', '#ff8f00', '#fff6c8'], name: ks } };
      A().special();
    }

    _deliver() {
      if (this.finished) return;
      this.finished = true;
      this.o.onFinish && this.o.onFinish(this.result);
    }

    /** chiamato dal pulsante "Continua" al termine */
    deliver() { this._deliver(); }

    updateAim(dt) {
      const k = this.keys;
      const sp = 3.4 * dt;
      if (k.ArrowLeft || k.KeyA) this.aim.x -= sp;
      if (k.ArrowRight || k.KeyD) this.aim.x += sp;
      if (k.ArrowUp || k.KeyW) this.aim.y += sp * 0.8;
      if (k.ArrowDown || k.KeyS) this.aim.y -= sp * 0.8;
      this.aim.x = clamp(this.aim.x, -5.2, 5.2);
      this.aim.y = clamp(this.aim.y, 0.05, 3.5);
      const tt = this.t + this.wobPhase;
      const A0 = this.wobAmp;
      this.reticle.x = this.aim.x + A0 * (Math.sin(1.7 * tt + 0.3) + 0.6 * Math.sin(3.1 * tt));
      this.reticle.y = this.aim.y + A0 * (Math.cos(1.3 * tt) + 0.5 * Math.sin(2.7 * tt + 1));
      if (this.phase === 'power') {
        this.powerT += dt;
        let p = (this.powerT % 2.1) / 1.05;
        if (p > 1) p = 2 - p;
        this.power = p;
        HUD().setPower(p, ZONE, this.armed);
      }
    }

    updateCamera(dt) {
      this.dolly = M.damp(this.dolly, this.dollyTarget, this.dollyTarget > this.dolly ? 9 : 2.2, dt);
      const b = CAM.broadcast, g = CAM.goal, k = this.dolly;
      const cam = this.cam;
      const sway = Math.sin(this.t * 0.4) * 0.08 * (1 - k);
      const bp = this.sim ? this.sim.ball.p : { x: 0, y: 0.1, z: 0 };
      const follow = this.launched ? 1 : 0;
      cam.pos = { x: lerp(b.pos.x, g.pos.x, k) + sway, y: lerp(b.pos.y, g.pos.y, k), z: lerp(b.pos.z, g.pos.z, k) };
      cam.target = {
        x: lerp(b.tgt.x, g.tgt.x, k) + clamp(bp.x, -4, 4) * 0.4 * k * follow,
        y: lerp(b.tgt.y, g.tgt.y, k) + (clamp(bp.y, 0, 3) - 1.0) * 0.18 * k * follow,
        z: lerp(b.tgt.z, g.tgt.z, k),
      };
      cam.f = cam.baseF() * lerp(b.zoom, g.zoom, k) * (1 + 0.06 * Math.min(1, this.shake / 20));
      cam.shakeX = (Math.random() - 0.5) * this.shake;
      cam.shakeY = (Math.random() - 0.5) * this.shake;
    }

    // ------------------------------------------------------------------- disegno
    draw(ctx, w, h) {
      if (w !== this.w || h !== this.h) this.resize(w, h);
      const cam = this.cam;
      const sim = this.sim;
      if (!sim) { ctx.fillStyle = '#05060f'; ctx.fillRect(0, 0, w, h); return; }
      if (this.phase === 'replay' && this.replay) { this.drawReplay(ctx, w, h); return; }
      // tempo del rigorista (relativo al contatto)
      const tk = Number.isFinite(this.tContact) ? sim.t - this.tContact : -PK.Kicker.T_RUN - 0.02;
      const ksk = this.kicker.skeleton(this.hitStop > 0 && this.hitInfo && this.hitInfo.kind === 'kick' ? 0 : tk);
      const gsk = this.keeper.skeleton(sim.t);
      const kExpr = this.phase === 'result' ? (this.resultInfo && this.resultInfo.scored ? 'shout' : 'sad') : (this.sit && this.sit.pressure > 0.7 ? 'focus' : 'focus');
      const gExpr = this.phase === 'result' ? (this.resultInfo && this.resultInfo.type === 'saved' ? 'shout' : 'sad') : 'focus';
      const kit = this.kits[this.team || 'A'], gkit = this.gkKits[this.opp || 'B'];
      const ballOpts = { trail: this.trailAlpha(), trailColor: this.special ? this.special.col[2] : 'rgba(255,255,255,0.9)' };
      PK.Scene.draw(ctx, cam, {
        t: this.t, energy: this.energy, pano: this.pano, net: sim.net,
        keeper: { sk: gsk, look: this.kitLook(this.keeperP || this.squads.B.gk, gkit, true, gExpr) },
        kicker: this.kickerP ? { sk: ksk, look: this.kitLook(this.kickerP, kit, false, kExpr) } : null,
        ball: sim.ball, ballOpts, extra: this.extras(cam),
      });
      if (this.special && this.launched && sim.ball && !sim.result) PK.FX.ballFx(ctx, cam, this.special.fx, sim.ball, this.trailAlpha(), this.special.col, this.t);
      if (this.keeperSpecial && this.keeper.dive && this.keeper.dive.special) this.drawKeeperAura(ctx, gsk);
      this.fx.draw(ctx, cam);
      // proiezioni 3D -> 2D dei testi onomatopeici
      this.texts.forEach((tx) => {
        const q = cam.project(tx.p);
        if (!q) return;
        const tt = this.t - tx.t0;
        ctx.save();
        ctx.globalAlpha = clamp(1 - (tt - 0.7) / 0.4, 0, 1);
        PK.FX.bigText(ctx, tx.text, q.x, q.y - tt * 14, tx.size * q.s * 1.3, { tt, rot: tx.rot, colors: tx.colors, glow: tx.colors[1] });
        ctx.restore();
      });
      // linee cinetiche e crowd flashes
      const flying = this.phase === 'flight' && this.launched && !sim.result && this.hitStop <= 0;
      if (flying) {
        const bq = cam.project(sim.ball.p);
        if (bq) PK.FX.speedLines(ctx, w, h, bq.x, bq.y, this.t, { inner: 0.42, count: 46, alpha: this.special ? 0.7 : 0.3, colors: this.special ? [this.special.col[0], '#fff'] : ['#fff'] });
      }
      PK.FX.crowdFlashes(ctx, w, h, this.t, this.isFinal ? 26 : 8 + 14 * this.energy, h * 0.02, h * 0.36);
      if (this.sit && this.sit.pressure > 0.75 && (this.phase === 'aim' || this.phase === 'power' || this.phase === 'ready')) {
        PK.FX.vignette(ctx, w, h, 0.35 + 0.35 * (this.beatPulse || 0));
      } else PK.FX.vignette(ctx, w, h, 0.28);
      if (this.phase === 'aim' || this.phase === 'power') this.drawReticle(ctx);
      if (this.diveMarker && this.t - this.diveMarker.t0 < 0.5) this.drawDiveMarker(ctx);
      // pannelli e cinematiche
      if (this.phase === 'intro') this.drawIntro(ctx, w, h);
      if (this.hitStop > 0 && this.hitInfo) {
        const dur = this.hitInfo.kind === 'kick' ? 0.95 : 0.75;
        const tt = dur - this.hitStop;
        const pl = this.hitInfo.kind === 'kick' ? this.teams[this.team] : this.teams[this.opp];
        PK.FX.specialIntro(ctx, w, h, tt, dur, this.hitInfo.spec, this.hitInfo.who.toUpperCase() + ` (${pl.code})`, this.hitInfo.kind === 'kick' ? 'SUPER TIRO' : 'SUPER PARATA');
      }
      if (this.bannerInfo && this.phase === 'result') {
        const tt = this.t - this.bannerInfo.t0;
        PK.FX.banner(ctx, w, h, tt, this.bannerInfo.dur, this.bannerInfo);
      }
      if (this.phase === 'coin') this.drawCoin(ctx, w, h);
      if (this.flashA > 0) PK.FX.flash(ctx, w, h, this.flashA * (this.special ? 0.9 : 0.5));
      if (this.phase === 'end') this.drawEnd(ctx, w, h);
    }

    /** oggetti di scena extra (coppa del mondo sul campo nella finale) */
    extras(cam) {
      if (!this.isFinal) return [];
      if (!this._trophy) {
        const cv = root.document.createElement('canvas');
        cv.width = 260; cv.height = 320;
        PK.drawTrophy(cv, '#1b2a6b');
        this._trophy = cv;
      }
      const base = { x: -7.4, y: 0, z: 11.4 };
      return [{
        key: cam.depth(base),
        draw: (ctx) => {
          const p0 = cam.project(base), p1 = cam.project({ x: base.x, y: 0.55, z: base.z }), p2 = cam.project({ x: base.x, y: 1.75, z: base.z });
          if (!p0 || !p1 || !p2) return;
          const ph = p1.y - p2.y, pw = ph * 260 / 320;
          // piedistallo
          const bw = 0.5 * p0.s;
          ctx.fillStyle = '#0f1530'; ctx.strokeStyle = '#ffd23a'; ctx.lineWidth = 2;
          ctx.fillRect(p0.x - bw / 2, p1.y, bw, p0.y - p1.y); ctx.strokeRect(p0.x - bw / 2, p1.y, bw, p0.y - p1.y);
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          const g = ctx.createRadialGradient(p1.x, p2.y + ph * 0.4, 0, p1.x, p2.y + ph * 0.4, ph * 1.3);
          g.addColorStop(0, 'rgba(255,220,110,0.55)'); g.addColorStop(1, 'rgba(255,200,60,0)');
          ctx.fillStyle = g; ctx.fillRect(p1.x - ph * 1.4, p2.y - ph * 0.6, ph * 2.8, ph * 2.6);
          ctx.restore();
          ctx.drawImage(this._trophy, p1.x - pw / 2, p2.y, pw, ph);
        },
      }];
    }

    drawReplay(ctx, w, h) {
      const R = this.replay, cam = R.cam, rs = R.sim;
      const tk = rs.t - this.tContact;
      const ksk = R.kicker.skeleton(tk);
      const gsk = R.keeper.skeleton(rs.t);
      const kit = this.kits[this.team], gkit = this.gkKits[this.opp];
      const trail = R.trail.map((p, i) => ({ p: p.p, a: 0.05 + 0.3 * (i / Math.max(1, R.trail.length)) }));
      PK.Scene.draw(ctx, cam, {
        t: this.t, energy: 0.6, pano: this.pano, net: rs.net,
        keeper: { sk: gsk, look: this.kitLook(this.keeperP, gkit, true, 'focus') },
        kicker: { sk: ksk, look: this.kitLook(this.kickerP, kit, false, 'focus') },
        ball: rs.ball, ballOpts: { trail, trailColor: this.special ? this.special.col[2] : 'rgba(255,255,255,0.9)' }, extra: this.extras(cam),
      });
      if (this.special && R.launched && !rs.result) PK.FX.ballFx(ctx, cam, this.special.fx, rs.ball, trail, this.special.col, this.t);
      if (R.keeper.dive && R.keeper.dive.special) this.drawKeeperAuraCam(ctx, cam, gsk);
      PK.FX.crowdFlashes(ctx, w, h, this.t, 14, h * 0.02, h * 0.4);
      PK.FX.vignette(ctx, w, h, 0.5);
      PK.FX.letterbox(ctx, w, h, Math.min(1, this.pt / 0.3));
      // tendina di transizione all'ingresso
      if (this.pt < 0.45) {
        const k = this.pt / 0.45;
        const x = lerp(-w * 0.4, w * 1.4, k);
        ctx.save();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.moveTo(x - w * 0.12, 0); ctx.lineTo(x + w * 0.12, 0); ctx.lineTo(x + w * 0.02, h); ctx.lineTo(x - w * 0.22, h); ctx.closePath(); ctx.fill();
        ctx.fillStyle = this.kits[this.team].shirt;
        ctx.beginPath(); ctx.moveTo(x - w * 0.5, 0); ctx.lineTo(x - w * 0.12, 0); ctx.lineTo(x - w * 0.22, h); ctx.lineTo(x - w * 0.6, h); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }

    drawKeeperAuraCam(ctx, cam, gsk) {
      [gsk.handTipR, gsk.handTipL].forEach((p) => {
        const q = cam.project(p);
        if (!q) return;
        const r = 0.45 * q.s;
        const g = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, r);
        g.addColorStop(0, 'rgba(255,246,200,0.95)'); g.addColorStop(0.4, 'rgba(255,200,60,0.5)'); g.addColorStop(1, 'rgba(255,140,0,0)');
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, 7); ctx.fill(); ctx.restore();
      });
    }

    trailAlpha() {
      const n = this.trail ? this.trail.length : 0;
      return (this.trail || []).map((p, i) => ({ p: p.p, a: 0.05 + 0.3 * (i / Math.max(1, n)) }));
    }

    drawKeeperAura(ctx, gsk) {
      const cam = this.cam;
      [gsk.handTipR, gsk.handTipL].forEach((p) => {
        const q = cam.project(p);
        if (!q) return;
        const r = 0.45 * q.s;
        const g = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, r);
        g.addColorStop(0, 'rgba(255,246,200,0.95)'); g.addColorStop(0.4, 'rgba(255,200,60,0.5)'); g.addColorStop(1, 'rgba(255,140,0,0)');
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, 7); ctx.fill(); ctx.restore();
      });
    }

    drawReticle(ctx) {
      const cam = this.cam;
      const q = cam.project({ x: this.reticle.x, y: this.reticle.y, z: GOAL.Z });
      if (!q) return;
      const t = this.t;
      const pr = this.sit ? this.sit.pressure : 0.3;
      const col = pr > 0.85 ? '#ff4d4d' : pr > 0.6 ? '#ffb13d' : '#ffffff';
      const u = this.h / 720;
      const r = Math.max(14 * u, this.disp * q.s);
      ctx.save();
      ctx.translate(q.x, q.y);
      ctx.scale(u, u);
      ctx.translate(0, 0);
      // anello di dispersione (r è già in px: va diviso per la scala)
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.globalAlpha = 0.55;
      ctx.setLineDash([6, 6]); ctx.lineDashOffset = -t * 20;
      ctx.beginPath(); ctx.arc(0, 0, r / u, 0, 7); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
      // mirino
      const pulse = 1 + 0.07 * Math.sin(t * 8) + 0.12 * (this.beatPulse || 0);
      const s = 17 * pulse;
      ctx.lineWidth = 3.2; ctx.strokeStyle = '#0a0a14';
      for (const pass of [0, 1]) {
        ctx.strokeStyle = pass ? col : '#0a0a14'; ctx.lineWidth = pass ? 2.2 : 5;
        ctx.beginPath();
        ctx.arc(0, 0, s, 0, 7);
        ctx.moveTo(-s * 1.7, 0); ctx.lineTo(-s * 0.55, 0); ctx.moveTo(s * 1.7, 0); ctx.lineTo(s * 0.55, 0);
        ctx.moveTo(0, -s * 1.7); ctx.lineTo(0, -s * 0.55); ctx.moveTo(0, s * 1.7); ctx.lineTo(0, s * 0.55);
        ctx.stroke();
      }
      ctx.restore();
    }

    drawDiveMarker(ctx) {
      const q = this.cam.project({ x: this.diveMarker.x, y: this.diveMarker.y, z: GOAL.Z });
      if (!q) return;
      const k = (this.t - this.diveMarker.t0) / 0.5;
      ctx.save();
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = '#7fd4ff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(q.x, q.y, 10 + k * 40, 0, 7); ctx.stroke();
      ctx.restore();
    }

    drawIntro(ctx, w, h) {
      const kp = this.kickerP, gp = this.keeperP;
      const full = this.introDur > 1.5;
      let sub = '';
      if (this.sit.sudden) sub = 'OLTRANZA — ogni errore può essere fatale';
      else if (this.sit.mustScore) sub = 'SE SBAGLIA, È FINITA!';
      else if (this.sit.matchPoint) sub = 'Un gol per chiudere la partita';
      else if (this.kickNo === 1) sub = this.o.label || '';
      else if (this.isFinal) sub = 'FINALE DEL MONDIALE';
      PK.FX.versus(ctx, w, h, {
        tt: this.pt, dur: this.introDur, pressure: this.sit.pressure, sub,
        kicker: { name: kp.name, number: kp.number, skin: kp.skin, hair: kp.hair, iris: this.irisFor(kp), sub: this.teams[this.team].name.toUpperCase() },
        keeper: { name: gp.name, number: gp.number, skin: gp.skin, hair: gp.hair, iris: this.irisFor(gp, 1), sub: this.teams[this.opp].name.toUpperCase() },
        mode: full ? 'full' : 'quick',
      });
    }

    irisFor(p, off) {
      const cols = ['#2a7fff', '#3aa05a', '#8a5a2b', '#2a2a3a', '#7a4ad8', '#2a9fb0'];
      return cols[(p.number + (off || 0)) % cols.length];
    }

    drawCoin(ctx, w, h) {
      const tt = this.pt;
      const a = Math.min(1, tt / 0.3) * Math.min(1, (2.4 - tt) / 0.3);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(2,4,14,0.55)';
      ctx.fillRect(0, 0, w, h);
      const spin = tt < 1.4 ? tt * 16 : Math.PI * 16 * 0.0 + 22.4;
      const y = h * 0.45 - Math.sin(Math.min(1, tt / 1.4) * Math.PI) * h * 0.18;
      ctx.translate(w / 2, y);
      const sc = Math.abs(Math.cos(spin));
      ctx.scale(1, Math.max(0.08, sc));
      const g = ctx.createRadialGradient(-10, -10, 4, 0, 0, 56);
      g.addColorStop(0, '#fff6b0'); g.addColorStop(0.6, '#ffc400'); g.addColorStop(1, '#a86a00');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 56, 0, 7); ctx.fill();
      ctx.lineWidth = 5; ctx.strokeStyle = '#7a4a00'; ctx.stroke();
      ctx.restore();
      if (tt > 1.4) {
        const f = this.teams[this.first];
        ctx.save();
        ctx.globalAlpha = a;
        PK.FX.bigText(ctx, this.isFinal ? 'LA FINALE!' : 'SORTEGGIO', w / 2, h * 0.64, Math.min(h * 0.11, w * 0.07), { tt: tt - 1.4 });
        ctx.font = `italic 800 ${Math.round(h * 0.05)}px Impact, sans-serif`;
        ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.shadowColor = '#000'; ctx.shadowBlur = 8;
        ctx.fillText(`Batte per prima ${f.name}`, w / 2, h * 0.74);
        ctx.restore();
      }
    }

    drawEnd(ctx, w, h) {
      const tt = this.pt;
      const k = M.smooth(tt / 0.5);
      ctx.save();
      ctx.globalAlpha = k * 0.7;
      ctx.fillStyle = '#02030a';
      ctx.fillRect(0, 0, w, h);
      ctx.restore();
      const r = this.result;
      if (!r) return;
      const wn = r.winner;
      PK.FX.bigText(ctx, 'FINE!', w / 2, h * 0.3, Math.min(h * 0.2, w * 0.13), { tt, rot: -0.06 });
      const score = `${this.teams.A.code} ${r.goals.A} - ${r.goals.B} ${this.teams.B.code}`;
      PK.FX.bigText(ctx, score, w / 2, h * 0.5, Math.min(h * 0.15, w * 0.1), { tt: tt - 0.2, colors: ['#ffffff', '#cfe6ff', '#6fa8ff'] });
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = `italic 800 ${Math.round(h * 0.05)}px Impact, sans-serif`;
      ctx.fillStyle = '#ffd23a'; ctx.shadowColor = '#000'; ctx.shadowBlur = 10;
      const txt = wn ? `Vince ${this.teams[wn].name} ai rigori` : 'Pareggio ai rigori';
      ctx.fillText(txt, w / 2, h * 0.63);
      if (tt > 1.0) { ctx.fillStyle = '#fff'; ctx.font = `700 ${Math.round(h * 0.032)}px sans-serif`; ctx.fillText('Tocca o premi un tasto per continuare', w / 2, h * 0.74); }

/* Super Rigori World Cup — schermate del torneo (HTML): titolo, scelta squadra, gironi, tabellone, risultati, finale */
(function (root) {

  function set(html, name) {

    s.scrollTop = 0;

  }
  const bind = (id, fn) => { const e = $(id); if (e) e.addEventListener('click', () => { PK.Audio.resume(); fn(e); }); };
  const sfx = () => PK.Audio.click();

  function diffSeg(G) {
    return `<div class="seg" id="diffseg">${DIFFS.map(([k, n]) => `<button data-d="${k}" class="${G.settings.difficulty === k ? 'on' : ''}">${n}</button>`).join('')}</div>`;

    doc.querySelectorAll('#diffseg button').forEach((b) =>
      b.addEventListener('click', () => {

  }

  // --------------------------------------------------------------------- tabelle
  function tableHTML(t, gid, mine) {
    const st = t.standings(gid);
    const done = t.groupDone(gid);
    return `<table class="tbl"><thead><tr><th class="t">Squadra</th><th>G</th><th>V</th><th>N</th><th>P</th><th>DR</th><th>Pt</th></tr></thead><tbody>${st

        const cls = [i < 2 && done ? 'q' : '', r.code === mine ? 'me' : ''].join(' ');

      })
      .join('')}</tbody></table>`;
  }
  function groupsHTML(t, mine, anim) {
    return `<div class="groups">${t.groups
      .map((g, i) => {
        const my = g.teams.includes(mine);
        return `<div class="gcard ${my ? 'mine' : ''}" style="${anim ? `animation-delay:${i * 0.12}s` : ''}"><h3><span>GIRONE ${g.id}</span>${my ? '<span class="stars">★ il tuo</span>' : ''}</h3>${tableHTML(t, g.id, mine)}</div>`;
      })
      .join('')}</div>`;
  }
  function fixtureHTML(m, mine) {
    const r = m.result;
    const me = m.a === mine || m.b === mine;
    const sc = r ? `${r.goals.A} - ${r.goals.B}` : 'vs';
    const wa = r && r.winner === 'A', wb = r && r.winner === 'B';
    return `<div class="fx ${me ? 'me' : ''}"><div class="tm ${wa ? 'w' : ''}">${flag(m.a)}${esc(PK.TEAM[m.a].name)}</div><div class="sc">${sc}</div><div class="tm r ${wb ? 'w' : ''}">${esc(PK.TEAM[m.b].name)}${flag(m.b)}</div></div>`;
  }
  function bracketHTML(t, mine) {
    const cols = [['R16', 'Ottavi', 8], ['QF', 'Quarti', 4], ['SF', 'Semifinali', 2], ['F', 'Finale', 1]];
    const box = (m) => {
      if (!m) return `<div class="bm"><div class="dim">— da definire —</div><div class="dim">— da definire —</div></div>`;
      const r = m.result;
      const row = (code, side) => `<div class="${r && r.winner === side ? 'win' : ''}">${flag(code)}<span>${PK.TEAM[code].code}</span><span class="s">${r ? r.goals[side] : ''}</span></div>`;
      return `<div class="bm ${m.a === mine || m.b === mine ? 'mine' : ''}">${row(m.a, 'A')}${row(m.b, 'B')}</div>`;

      bind('b-rest', () => { sfx(); G.simulateRest(); });

    const g = cv.getContext('2d');
    const w = cv.width, h = cv.height;
    g.clearRect(0, 0, w, h);
    const gold = g.createLinearGradient(0, 0, w, 0);
    gold.addColorStop(0, '#a86a00'); gold.addColorStop(0.3, '#ffe27a'); gold.addColorStop(0.5, '#fff6c8'); gold.addColorStop(0.7, '#ffc400'); gold.addColorStop(1, '#8a5200');
    const cx = w / 2;
    g.lineJoin = 'round';
    g.strokeStyle = '#4a2c00'; g.lineWidth = 5;
    // base
    g.fillStyle = '#1b1b24';
    g.beginPath(); g.roundRect ? g.roundRect(cx - 80, h - 44, 160, 34, 6) : g.rect(cx - 80, h - 44, 160, 34); g.fill(); g.stroke();
    g.fillStyle = accent || '#2a47b8';
    g.fillRect(cx - 70, h - 36, 140, 18);
    g.fillStyle = gold;
    g.beginPath(); g.moveTo(cx - 60, h - 44); g.lineTo(cx - 40, h - 80); g.lineTo(cx + 40, h - 80); g.lineTo(cx + 60, h - 44); g.closePath(); g.fill(); g.stroke();
    // stelo
    g.beginPath(); g.moveTo(cx - 16, h - 80); g.quadraticCurveTo(cx - 6, h - 130, cx - 30, h - 150); g.lineTo(cx + 30, h - 150); g.quadraticCurveTo(cx + 6, h - 130, cx + 16, h - 80); g.closePath(); g.fill(); g.stroke();
    // coppa
    g.beginPath(); g.moveTo(cx - 82, 36); g.lineTo(cx + 82, 36); g.quadraticCurveTo(cx + 88, 160, cx, h - 150); g.quadraticCurveTo(cx - 88, 160, cx - 82, 36); g.closePath(); g.fill(); g.stroke();
    // manici
    g.lineWidth = 12; g.strokeStyle = '#4a2c00';
    [-1, 1].forEach((s) => { g.beginPath(); g.moveTo(cx + s * 80, 52); g.bezierCurveTo(cx + s * 135, 40, cx + s * 130, 130, cx + s * 70, 126); g.stroke(); });
    g.lineWidth = 6; g.strokeStyle = gold;
    [-1, 1].forEach((s) => { g.beginPath(); g.moveTo(cx + s * 80, 52); g.bezierCurveTo(cx + s * 135, 40, cx + s * 130, 130, cx + s * 70, 126); g.stroke(); });
    // globo e riflessi
    g.fillStyle = 'rgba(255,255,255,0.55)';
    g.beginPath(); g.ellipse(cx - 40, 90, 12, 50, 0.15, 0, 7); g.fill();
    g.fillStyle = 'rgba(70,30,0,0.25)';
    g.beginPath(); g.arc(cx, 84, 36, 0, 7); g.fill();
    g.fillStyle = '#fff6c8';
    g.beginPath(); g.arc(cx, 84, 28, 0, 7); g.fill();
    g.strokeStyle = 'rgba(120,70,0,0.6)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(cx - 28, 84); g.lineTo(cx + 28, 84); g.moveTo(cx, 56); g.lineTo(cx, 112); g.stroke();
  }

/* ---- src/main.js ---- */
/* Super Rigori World Cup — avvio, ciclo di gioco, input e flusso del torneo */
(function (root) {
  'use strict';
  const PK = (root.PK = root.PK || {});
  const M = PK.M;
  const doc = root.document;
  const SAVE_KEY = 'superrigori.v1';

  // ------------------------------------------------------------ persistenza (con try/catch)
  const store = {
    get() { try { return JSON.parse(root.localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { return null; } },
    set(v) { try { root.localStorage.setItem(SAVE_KEY, JSON.stringify(v)); } catch (e) { /* ignorato */ } },
    clear() { try { root.localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignorato */ } },
  };

  const G = (PK.Game = {
    canvas: null, ctx: null, w: 1280, h: 720, dpr: 1,
    tour: null, match: null, screen: 'title', paused: false,
    settings: { difficulty: 'normal', muted: false },
    hubTab: 'match', lastRound: null, lastResult: null, lastMatch: null,
    attract: null, now: 0, auto: false,

    init() {
      this.canvas = doc.getElementById('stage');
      this.ctx = this.canvas.getContext('2d');
      PK.HUD.init();
      const saved = store.get();
      if (saved && saved.settings) Object.assign(this.settings, saved.settings);
      PK.Audio.setMuted(!!this.settings.muted);
      this.syncMuteButton();
      this.attract = new Attract();
      this.resize();
      root.addEventListener('resize', () => this.resize());
      root.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 150));
      this.bindInput();
      PK.HUD.bind({
        kick: () => this.match && this.match.pressKick(),
        spin: (c) => this.match && this.match.setCurve(this.match.curve === c && c !== 0 ? 0 : c),
        super: () => this.match && this.match.toggleSuper(),
      });
      doc.getElementById('btn-mute').addEventListener('pointerdown', (e) => { e.stopPropagation(); PK.Audio.resume(); this.settings.muted = PK.Audio.toggleMute(); this.syncMuteButton(); this.persist(); });
      doc.getElementById('btn-pause').addEventListener('pointerdown', (e) => { e.stopPropagation(); this.pause(); });
      PK.Screens.title(this);
      let last = performance.now();
      const loop = (t) => {
        const dt = Math.min(0.1, (t - last) / 1000);
        last = t;
        this.now = t / 1000;
        this.frame(dt);
        root.requestAnimationFrame(loop);
      };
      root.requestAnimationFrame(loop);
    },

    syncMuteButton() {
      const b = doc.getElementById('btn-mute');
      if (b) b.textContent = this.settings.muted ? '🔇' : '🔊';
    },

    persist() {
      store.set({ settings: this.settings, tour: this.tour ? this.tour.toJSON() : null });
    },
    hasSave() {
      const s = store.get();
      return !!(s && s.tour && !s.tour.over);
    },

    // ------------------------------------------------------------------- canvas
    resize() {
      const dpr = Math.min(root.devicePixelRatio || 1, 2);
      let w = root.innerWidth, h = root.innerHeight;
      let scale = dpr;
      const maxPx = 2.4e6;
      if (w * h * scale * scale > maxPx) scale = Math.sqrt(maxPx / (w * h));
      this.dpr = scale;
      this.w = Math.round(w * scale); this.h = Math.round(h * scale);
      this.canvas.width = this.w; this.canvas.height = this.h;
      if (this.match) this.match.resize(this.w, this.h);
      const hint = doc.getElementById('rotate-hint');
      if (hint) hint.classList.toggle('on', h > w);
    },

    toCanvas(e) {
      const r = this.canvas.getBoundingClientRect();
      return { x: ((e.clientX - r.left) / r.width) * this.w, y: ((e.clientY - r.top) / r.height) * this.h };
    },

    bindInput() {
      const cv = this.canvas;
      cv.addEventListener('pointermove', (e) => {
        if (!this.match || this.paused) return;
        if (e.pointerType === 'touch' && !(e.buttons & 1) && e.pressure === 0) return;
        const p = this.toCanvas(e);
        this.match.onCanvasPoint(p.x, p.y, e.pointerType, false);
      });
      cv.addEventListener('pointerdown', (e) => {
        PK.Audio.resume();
        if (!this.match || this.paused) return;
        e.preventDefault();
        const p = this.toCanvas(e);
        this.match.onCanvasPoint(p.x, p.y, e.pointerType, false);
        this.match.onCanvasPoint(p.x, p.y, e.pointerType, true);
      });
      root.addEventListener('keydown', (e) => {
        PK.Audio.resume();
        if (e.code === 'Escape') { if (this.match) this.pause(); return; }
        if (e.code === 'KeyM') { this.settings.muted = PK.Audio.toggleMute(); this.syncMuteButton(); this.persist(); return; }
        if (!this.match || this.paused) return;
        if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
        if (!e.repeat) this.match.key(e.code, true);
        else this.match.keys[e.code] = true;
      });
      root.addEventListener('keyup', (e) => { if (this.match) this.match.key(e.code, false); });
      root.addEventListener('blur', () => { if (this.match && !this.paused) this.pause(); });
    },

    // -------------------------------------------------------------------- ciclo
    frame(dt) {
      const ctx = this.ctx;
      if (this.match && !this.paused) {
        this.match.update(dt);
        this.match.draw(ctx, this.w, this.h);
      } else if (this.match && this.paused) {
        // fermo: ridisegna l'ultimo stato
        this.match.draw(ctx, this.w, this.h);
      } else {
        this.attract.draw(ctx, this.w, this.h, dt, this.screen);
      }
    },

    // ----------------------------------------------------------------- navigazione
    pause() {
      if (!this.match || this.paused || this.match.phase === 'end') return;
      this.paused = true;
      PK.Screens.pause(this);
    },
    resume() {
      this.paused = false;
      PK.Screens.clear();
    },
    quitMatch() {
      this.paused = false;
      this.match = null;
      PK.HUD.show(false);
      PK.Screens.clear();
      this.persist();
      if (this.tour) PK.Screens.hub(this); else PK.Screens.title(this);
    },

    newTournament(code) {
      this.tour = new PK.Tournament({ player: code, difficulty: this.settings.difficulty });
      this.persist();
      PK.Screens.draw(this);
    },
    continueTournament() {
      const s = store.get();
      if (!s || !s.tour) return;
      this.tour = PK.Tournament.fromJSON(s.tour);
      if (s.settings) Object.assign(this.settings, s.settings);
      PK.Screens.hub(this);
    },

    /** avvia la partita del giocatore nel turno corrente */
    playNext(auto) {
      const t = this.tour;
      const m = t.playerMatch();
      if (!m) return;
      PK.Audio.resume();
      const ko = t.round.stage === 'ko';
      PK.Screens.clear();
      PK.HUD.show(true);
      this.lastMatch = m;
      this.paused = false;
      this.match = new PK.Match({
        teamA: PK.TEAM[m.a], teamB: PK.TEAM[m.b], playerSide: m.a === t.player ? 'A' : 'B',
        mode: ko ? 'knockout' : 'group', stage: m.stage, label: t.round.label, difficulty: this.settings.difficulty,
        auto: !!auto || this.auto, first: this.forceFirst || null,
        onFinish: (res) => this.afterMatch(m, res),
      });
      this.match.resize(this.w, this.h);
    },

    simulatePlayerMatch() {
      const t = this.tour;
      const m = t.playerMatch();
      if (!m) return;
      this.afterMatch(m, t.simulate(m), true);
    },

    afterMatch(m, result, simulated) {
      const t = this.tour;
      this.match = null;
      PK.HUD.show(false);
      t.recordResult(m.id, result);
      t.simulateRound(false);
      this.lastRound = t.round;
      this.lastResult = { match: m, result, simulated: !!simulated, roundLabel: t.round.label, roundStage: t.round.stage, group: m.group || null };
      t.advance();
      this.persist();
      PK.Screens.result(this);
    },

    /** dopo la schermata dei risultati: prossimo turno, eliminazione o fine torneo */
    afterResult() {
      const t = this.tour;
      if (t.over) return PK.Screens.end(this);
      if (!t.playerMatch()) return PK.Screens.end(this);
      PK.Screens.hub(this);
    },

    simulateRest() {
      const t = this.tour;
      let guard = 0;
      while (!t.over && guard++ < 12) {
        t.simulateRound(false);
        t.advance();
      }
      this.persist();
      PK.Screens.end(this);
    },

    /** partita dimostrativa IA contro IA (fuori dal torneo) */
    startDemo() {
      const top = PK.TEAMS.slice().sort((a, b) => PK.teamOverall(b) - PK.teamOverall(a)).slice(0, 12);
      const a = top[Math.floor(Math.random() * top.length)];
      let b = a;
      while (b === a) b = top[Math.floor(Math.random() * top.length)];
      PK.Audio.resume();
      PK.Screens.clear();
      PK.HUD.show(true);
      this.tour = null;
      this.paused = false;
      this.match = new PK.Match({
        teamA: a, teamB: b, playerSide: null, mode: 'knockout', stage: 'F', label: 'Demo — Finale', difficulty: this.settings.difficulty, auto: true,
        onFinish: () => this.toTitle(),
      });
      this.match.resize(this.w, this.h);
    },

    toTitle() {
      this.match = null;
      PK.HUD.show(false);
      PK.Screens.title(this);
    },
  });

  // ------------------------------------------------- sfondo animato per i menu
  class Attract {
    constructor() {
      this.cam = new PK.Camera();
      const a = PK.TEAM.ITA, b = PK.TEAM.BRA;
      this.kits = PK.pickKits(a, b, 2);
      this.pano = {
        far: PK.Stadium.makePanorama({ seed: 5, colA: this.kits.a.shirt, colB: this.kits.b.shirt }),
        near: PK.Stadium.makePanorama({ seed: 6, colA: this.kits.b.shirt, colB: this.kits.a.shirt }),
      };
      this.keeper = new PK.Keeper({});
      this.sim = new PK.Phys.Sim(this.keeper, { t0: 0 });
      this.sq = PK.buildSquad(a); this.sq2 = PK.buildSquad(b);
      this.kicker = new PK.Kicker({ foot: 'R', aimX: 2 });
      this.t = 0;
      this.fx = new PK.FX.Particles();
      this.champion = null;
      this.skip = 0;
    }
    setChampion(team) { this.champion = team; this.fx.list.length = 0; this.cT = 0; }
    draw(ctx, w, h, dt, screen) {
      this.skip = (this.skip + 1) % 2;
      this.t += dt;
      if (screen !== 'champion' && this.skip) return; // 30 fps sui menu
      const cam = this.cam;
      cam.setSize(w, h);
      const k = this.t * 0.12;
      cam.pos = { x: Math.sin(k) * 3.2, y: 2.4 + Math.sin(k * 1.7) * 0.4, z: -8.5 + Math.cos(k * 0.8) * 1.2 };
      cam.target = { x: Math.sin(k) * 0.5, y: 1.2, z: 11 };
      cam.f = cam.baseF() * 1.35;
      this.keeper.dive = null;
      const gsk = this.keeper.skeleton(this.t);
      const ksk = this.kicker.skeleton(-1.4);
      const kit = this.kits.a;
      const look = (p, kt, gk) => ({ skin: p.skin, hair: p.hair, hairStyle: p.hairStyle, shirt: kt.shirt, trim: kt.trim, shorts: kt.shorts, socks: kt.socks, gloves: gk ? kt.gloves : null, number: p.number, name: p.name, expr: 'focus' });
      PK.Scene.draw(ctx, cam, {
        t: this.t, energy: screen === 'champion' ? 0.9 : 0.25, pano: this.pano, net: this.sim.net,
        keeper: { sk: gsk, look: look(this.sq2.gk, this.kits.gkB, true) },
        kicker: { sk: ksk, look: look(this.sq.kickers[4], kit, false) },
        ball: this.sim.ball, ballOpts: {},
      });
      PK.FX.crowdFlashes(ctx, w, h, this.t, screen === 'champion' ? 34 : 10, h * 0.02, h * 0.36);
      if (screen === 'champion') {
        this.cT = (this.cT || 0) + dt;
        if (Math.random() < 0.5) this.fx.burst('conf', { x: (Math.random() - 0.5) * 8, y: 6, z: 8 }, 4, { speed: 2, up: 1, life: 4, size: 0.1, col: [this.champion ? this.champion.kit.shirt : '#fff', '#ffd23a', '#ffffff', '#ff3d6b'], g: 2.2 });
        this.fx.update(dt);
        this.fx.draw(ctx, cam);
      }
      PK.FX.vignette(ctx, w, h, 0.5);
    }
  }

  if (doc.readyState === 'loading') root.addEventListener('DOMContentLoaded', () => G.init());
  else G.init();
})(typeof window !== 'undefined' ? window : globalThis);
