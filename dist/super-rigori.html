<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060918">
<title>Super Rigori World Cup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&display=swap">
<style>
/* Super Rigori World Cup — stile broadcast anime anni '80 */
:root {
  --bg: #060918;
  --panel: rgba(9, 14, 40, 0.86);
  --panel2: rgba(20, 30, 74, 0.9);
  --line: rgba(255, 255, 255, 0.16);
  --gold: #ffd23a;
  --gold2: #ff9a1f;
  --pink: #ff3d6b;
  --cyan: #35d0ff;
  --green: #2ee66b;
  --red: #ff4d4d;
  --text: #f4f7ff;
  --dim: #9fb0dd;
  --disp: "Bangers", "Russo One", Impact, "Arial Black", "Haettenschweiler", sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--body); overflow: hidden; overscroll-behavior: none; }
body { user-select: none; -webkit-user-select: none; }
#app { position: fixed; inset: 0; }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: #04050c; }
.hidden { display: none !important; }
button { font-family: inherit; color: inherit; cursor: pointer; }

/* ------------------------------------------------------------------ HUD */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud > * { pointer-events: none; }
#hud button, #hud .ctl, #hud #topbtns { pointer-events: auto; }
#scoreboard {
  position: absolute; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
  display: flex; align-items: stretch; gap: 0; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.55));
  max-width: 98vw;
}
#scoreboard .team {
  display: grid; grid-template-columns: auto auto auto; grid-template-rows: auto auto; align-items: center; column-gap: 8px; row-gap: 2px;
  padding: 6px 14px 5px; background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 2px solid var(--line);
  min-width: 0;
}
#team-a { clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%); border-radius: 10px 0 0 10px; padding-right: 26px; }
#team-b { clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%); border-radius: 0 10px 10px 0; padding-left: 26px; direction: ltr; }
#team-b .flag { order: 3; } #team-b .code { order: 2; } #team-b .score { order: 1; }
#scoreboard .team.me { border-color: var(--gold); box-shadow: inset 0 0 18px rgba(255, 210, 58, 0.25); }
.flag { width: 34px; height: 22px; border-radius: 3px; border: 1px solid rgba(255, 255, 255, 0.6); object-fit: cover; box-shadow: 0 2px 4px rgba(0,0,0,.5); }
.code { font-family: var(--disp); font-size: 22px; letter-spacing: 1.5px; }
.score { font-family: var(--disp); font-size: 38px; line-height: 1; color: var(--gold); text-shadow: 0 0 14px rgba(255, 210, 58, 0.5), 2px 2px 0 #000; min-width: 26px; text-align: center; }
.score.bump { animation: bump 0.55s ease-out; }
@keyframes bump { 0% { transform: scale(2.2) rotate(-6deg); color: #fff; } 100% { transform: scale(1); } }
.team .name { display: none; }
.dots { grid-column: 1 / -1; display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; max-width: 210px; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.55); background: rgba(255, 255, 255, 0.08); display: inline-block; }
.dot.goal { background: radial-gradient(circle at 35% 30%, #aaffc8, var(--green)); border-color: #fff; box-shadow: 0 0 8px var(--green); }
.dot.miss { background: radial-gradient(circle at 35% 30%, #ffb0b0, var(--red)); border-color: #fff; position: relative; }
.dot.miss::after { content: "✕"; position: absolute; inset: 0; font-size: 10px; line-height: 10px; text-align: center; color: #fff; font-weight: 900; }
.dot.cur { animation: pulse 0.8s infinite; border-color: var(--gold); }
.dot.sd { border-style: dashed; }
@keyframes pulse { 50% { transform: scale(1.35); box-shadow: 0 0 10px var(--gold); } }
.supers { position: absolute; display: none; }
#team-a .supers, #team-b .supers { display: flex; position: static; grid-column: 1 / -1; justify-content: center; gap: 10px; font-size: 12px; font-weight: 800; color: var(--gold); }
.supers b.gk { color: var(--cyan); }
#scoreboard .mid {
  display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 4px 14px; gap: 2px; min-width: 150px; max-width: 34vw;
  background: linear-gradient(180deg, #0a1238, #04071a); border-top: 2px solid var(--line); border-bottom: 2px solid var(--line);
}
#stage-label { font-family: var(--disp); font-size: 15px; letter-spacing: 1.2px; color: var(--cyan); text-align: center; line-height: 1.1; text-transform: uppercase; }
#stage-label[data-mode="knockout"] { color: var(--pink); }
#kick-info { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
#kick-info img { width: 22px; height: 14px; border-radius: 2px; }
#kick-info b { color: var(--gold); }
#commentary {
  position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); max-width: min(92vw, 780px); text-align: center;
  font-family: var(--disp); font-size: clamp(18px, 3.2vw, 30px); letter-spacing: 0.8px; padding: 6px 22px;
  background: linear-gradient(90deg, transparent, rgba(5, 8, 28, 0.82) 12%, rgba(5, 8, 28, 0.82) 88%, transparent);
  text-shadow: 2px 2px 0 #000, 0 0 12px rgba(53, 208, 255, 0.5); opacity: 0;
}
#commentary.pop { animation: comm 3.6s ease-out forwards; }
@keyframes comm { 0% { opacity: 0; transform: translateX(-50%) translateY(14px) scale(0.9); } 8% { opacity: 1; transform: translateX(-50%) scale(1.06); } 14% { transform: translateX(-50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; } }
#prompt {
  position: absolute; left: 50%; top: 22%; transform: translateX(-50%); max-width: min(90vw, 700px); text-align: center;
  font-family: var(--disp); font-size: clamp(16px, 2.6vw, 24px); color: #fff; letter-spacing: 0.8px;
  background: rgba(5, 8, 28, 0.72); border: 2px solid var(--gold); border-radius: 8px; padding: 6px 16px; text-shadow: 1px 1px 0 #000;
  animation: floaty 2.4s ease-in-out infinite;
}
@keyframes floaty { 50% { transform: translateX(-50%) translateY(-5px); } }

.ctl { position: absolute; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom)); display: flex; align-items: flex-end; justify-content: center; gap: 14px; padding: 0 12px; }
#spin { display: flex; gap: 6px; }
#spin button, .super, #topbtns button {
  background: linear-gradient(180deg, #243a8a, #101b50); border: 2px solid var(--line); border-radius: 10px; font-weight: 800; font-size: 20px;
  min-width: 52px; height: 52px; box-shadow: 0 4px 0 #050a26; transition: transform 0.08s;
}
#spin button.on { border-color: var(--cyan); background: linear-gradient(180deg, #1f7fb0, #0b3a6a); color: #fff; box-shadow: 0 0 14px var(--cyan); }
#spin button:active, .super:active { transform: translateY(3px); }
.super { padding: 0 14px; font-family: var(--disp); letter-spacing: 1px; font-size: 18px; color: var(--gold); white-space: nowrap; }
.super.armed { background: linear-gradient(180deg, #ffd23a, #ff8f00); color: #2a1200; border-color: #fff; box-shadow: 0 0 20px var(--gold), 0 4px 0 #8a4a00; animation: pulse 0.7s infinite; }
.super:disabled { opacity: 0.35; filter: grayscale(0.8); }
#power { position: relative; flex: 1 1 320px; max-width: 520px; height: 34px; background: rgba(5, 8, 28, 0.85); border: 3px solid #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 4px 12px rgba(0,0,0,.6); align-self: center; }
#power-zone { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(45deg, rgba(46, 230, 107, 0.55), rgba(46, 230, 107, 0.55) 6px, rgba(46, 230, 107, 0.3) 6px, rgba(46, 230, 107, 0.3) 12px); border-left: 2px solid #fff; border-right: 2px solid #fff; }
#power.armed #power-zone { background: repeating-linear-gradient(45deg, rgba(255, 210, 58, 0.85), rgba(255, 210, 58, 0.85) 6px, rgba(255, 140, 0, 0.7) 6px, rgba(255, 140, 0, 0.7) 12px); box-shadow: 0 0 16px var(--gold); }
#power-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #2a7fff, #35d0ff 60%, #fff); opacity: 0.75; }
#power.inzone #power-fill { background: linear-gradient(90deg, #17b050, #2ee66b, #fff); }
#power-cursor { position: absolute; top: -2px; bottom: -2px; width: 6px; margin-left: -3px; background: #fff; box-shadow: 0 0 10px #fff; left: 0; }
#power .label { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--disp); letter-spacing: 3px; font-size: 14px; color: rgba(255,255,255,.75); text-shadow: 1px 1px 0 #000; }
.big {
  font-family: var(--disp); font-size: 30px; letter-spacing: 2px; padding: 0 30px; height: 62px; color: #fff; text-shadow: 2px 2px 0 #000;
  background: linear-gradient(180deg, #ff5a7e, #c3123a); border: 3px solid #fff; border-radius: 12px; box-shadow: 0 6px 0 #5a0a20, 0 0 22px rgba(255, 61, 107, 0.6);
  transform: skewX(-8deg); transition: transform 0.08s;
}
.big:active { transform: skewX(-8deg) translateY(4px); box-shadow: 0 2px 0 #5a0a20; }
.btns { display: flex; gap: 10px; align-items: flex-end; }
#ctl-save { justify-content: space-between; }
#ctl-save .hint { font-size: 13px; color: var(--dim); text-align: center; flex: 1; padding-bottom: 14px; }
#topbtns { position: absolute; top: max(8px, env(safe-area-inset-top)); right: 10px; display: flex; gap: 8px; }
#topbtns button { min-width: 44px; height: 44px; font-size: 18px; padding: 0 10px; }

/* -------------------------------------------------------------- schermate */
#screen { position: absolute; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; display: flex; justify-content: center; padding: 18px 16px 28px; background: radial-gradient(ellipse at 50% 30%, rgba(8, 14, 46, 0.62), rgba(3, 5, 18, 0.9)); animation: fade 0.35s ease-out; }
@keyframes fade { from { opacity: 0; } }
.wrap { width: 100%; max-width: 1080px; margin: auto; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { font-family: var(--disp); margin: 0; letter-spacing: 1.5px; font-weight: 400; }
.logo { text-align: center; line-height: 0.9; }
.logo .l1 { font-family: var(--disp); font-size: clamp(54px, 13vw, 124px); color: var(--gold); text-shadow: 4px 4px 0 #b3123a, 8px 8px 0 #000, 0 0 40px rgba(255, 150, 20, 0.6); transform: skewX(-8deg) rotate(-3deg); display: inline-block; -webkit-text-stroke: 2px #fff; paint-order: stroke fill; }
.logo .l2 { font-family: var(--disp); font-size: clamp(22px, 5vw, 44px); color: #fff; letter-spacing: 8px; text-shadow: 3px 3px 0 #000, 0 0 18px var(--cyan); display: block; margin-top: 6px; }
.logo .l3 { font-size: 14px; color: var(--dim); letter-spacing: 2px; margin-top: 10px; text-transform: uppercase; }
.menu { display: flex; flex-direction: column; gap: 12px; align-items: center; margin-top: 10px; }
.btn {
  font-family: var(--disp); font-size: 26px; letter-spacing: 2px; color: #fff; text-shadow: 2px 2px 0 #000; min-width: min(86vw, 340px); padding: 12px 28px;
  background: linear-gradient(180deg, #2a47b8, #101f66); border: 3px solid #fff; border-radius: 12px; transform: skewX(-8deg);
  box-shadow: 0 6px 0 #050a30, 0 0 18px rgba(53, 208, 255, 0.25); transition: transform 0.1s, filter 0.1s;
}
.btn:hover { filter: brightness(1.18); transform: skewX(-8deg) translateY(-2px); }
.btn:active { transform: skewX(-8deg) translateY(4px); box-shadow: 0 2px 0 #050a30; }
.btn.primary { background: linear-gradient(180deg, #ff5a7e, #c3123a); box-shadow: 0 6px 0 #5a0a20, 0 0 24px rgba(255, 61, 107, 0.5); }
.btn.gold { background: linear-gradient(180deg, #ffd23a, #e08400); color: #2a1200; text-shadow: none; box-shadow: 0 6px 0 #7a4a00, 0 0 24px rgba(255, 210, 58, 0.5); }
.btn.small { font-size: 18px; min-width: 0; padding: 8px 18px; }
.btn.ghost { background: rgba(255,255,255,.06); }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }
.panel { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; backdrop-filter: blur(4px); }
.sub { color: var(--dim); font-size: 14px; }
.title-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.title-bar h2 { font-size: clamp(26px, 5vw, 40px); color: var(--gold); text-shadow: 2px 2px 0 #000; }

/* selezione squadra */
.teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tcard { position: relative; text-align: left; background: linear-gradient(180deg, rgba(30, 46, 110, 0.85), rgba(10, 16, 48, 0.92)); border: 2px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; transition: transform 0.12s, border-color 0.12s; }
.tcard:hover { transform: translateY(-3px); border-color: var(--cyan); }
.tcard.sel { border-color: var(--gold); box-shadow: 0 0 20px rgba(255, 210, 58, 0.55); background: linear-gradient(180deg, rgba(90, 70, 10, 0.9), rgba(30, 20, 4, 0.95)); }
.tcard .fl { width: 100%; aspect-ratio: 3 / 2; border-radius: 6px; border: 1px solid rgba(255,255,255,.55); object-fit: cover; }
.tcard .nm { font-family: var(--disp); font-size: 20px; letter-spacing: 1px; line-height: 1; }
.bars { display: grid; grid-template-columns: 30px 1fr; gap: 3px 6px; font-size: 10px; align-items: center; color: var(--dim); font-weight: 700; }
.bar { height: 7px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), #fff); }
.bar.gk > i { background: linear-gradient(90deg, var(--gold2), var(--gold)); }
.stars { color: var(--gold); font-size: 12px; letter-spacing: 1px; }

/* gironi / tabellone */
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.gcard { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; overflow: hidden; animation: pop 0.5s ease-out backwards; }
.gcard.mine { border-color: var(--gold); box-shadow: 0 0 22px rgba(255, 210, 58, 0.35); }
.gcard h3 { background: linear-gradient(90deg, #2a47b8, #101f66); padding: 6px 12px; font-size: 20px; display: flex; justify-content: space-between; }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(0.94); } }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { font-size: 10px; color: var(--dim); font-weight: 700; padding: 5px 4px; text-align: center; }
.tbl td { padding: 5px 4px; text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.07); }
.tbl td.t, .tbl th.t { text-align: left; }
.tbl td.t { display: flex; align-items: center; gap: 7px; font-weight: 700; white-space: nowrap; }
.tbl td.t img { width: 24px; height: 16px; border-radius: 2px; border: 1px solid rgba(255,255,255,.5); }
.tbl tr.q td { background: rgba(46, 230, 107, 0.1); }
.tbl tr.q td:first-child { box-shadow: inset 3px 0 var(--green); }
.tbl tr.me td { background: rgba(255, 210, 58, 0.14); }
.tbl td.pts { font-weight: 900; color: var(--gold); }
.fixt { display: flex; flex-direction: column; gap: 6px; }
.fx { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; background: rgba(255, 255, 255, 0.05); font-size: 14px; font-weight: 700; }
.fx .tm { display: flex; align-items: center; gap: 6px; }
.fx .tm.r { justify-content: flex-end; }
.fx img { width: 24px; height: 16px; border-radius: 2px; }
.fx .sc { font-family: var(--disp); font-size: 20px; color: var(--gold); min-width: 64px; text-align: center; }
.fx.me { background: rgba(255, 210, 58, 0.14); border: 1px solid var(--gold); }
.fx .w { color: var(--green); }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { padding: 8px 18px; border-radius: 10px; border: 2px solid var(--line); background: rgba(255,255,255,.05); font-family: var(--disp); font-size: 18px; letter-spacing: 1px; }
.tab.on { background: linear-gradient(180deg, #ffd23a, #e08400); color: #2a1200; border-color: #fff; }
.next { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; text-align: center; }
.next .tm { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.next .tm img { width: min(26vw, 140px); aspect-ratio: 3/2; border-radius: 8px; border: 2px solid #fff; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
.next .tm b { font-family: var(--disp); font-size: clamp(22px, 4vw, 34px); letter-spacing: 1px; }
.next .vs { font-family: var(--disp); font-size: clamp(34px, 8vw, 70px); color: var(--gold); text-shadow: 3px 3px 0 #b3123a, 6px 6px 0 #000; transform: rotate(-6deg); }
.chip { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: rgba(255,255,255,.12); letter-spacing: .5px; text-transform: uppercase; }
.chip.g { background: rgba(46,230,107,.22); color: #aaffc8; } .chip.r { background: rgba(255,77,77,.22); color: #ffb0b0; } .chip.y { background: rgba(255,210,58,.22); color: var(--gold); }

.bracket { display: grid; grid-template-columns: repeat(4, minmax(180px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; align-items: center; }
.bcol { display: flex; flex-direction: column; justify-content: space-around; gap: 10px; min-height: 100%; }
.bcol h4 { margin: 0 0 4px; font-family: var(--disp); font-size: 16px; color: var(--cyan); letter-spacing: 1px; text-align: center; }
.bm { background: var(--panel); border: 2px solid var(--line); border-radius: 8px; font-size: 12px; overflow: hidden; }
.bm.mine { border-color: var(--gold); }
.bm div { display: flex; align-items: center; gap: 6px; padding: 4px 8px; font-weight: 700; }
.bm div + div { border-top: 1px solid var(--line); }
.bm img { width: 20px; height: 13px; border-radius: 2px; }
.bm .s { margin-left: auto; font-family: var(--disp); font-size: 16px; color: var(--gold); }
.bm .win { background: rgba(46, 230, 107, 0.14); }

.kicks { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.kicks .kk { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--dim); }
.kicks .kk i { width: 18px; height: 18px; border-radius: 50%; display: block; border: 2px solid #fff; background: var(--green); }
.kicks .kk i.m { background: var(--red); }
.res-card { text-align: center; }
.res-card .big-score { font-family: var(--disp); font-size: clamp(50px, 12vw, 110px); color: var(--gold); text-shadow: 4px 4px 0 #000, 0 0 30px rgba(255,210,58,.5); line-height: 1; }
.res-card .verdict { font-family: var(--disp); font-size: clamp(28px, 6vw, 54px); letter-spacing: 3px; }
.verdict.win { color: var(--green); text-shadow: 3px 3px 0 #000, 0 0 24px rgba(46,230,107,.7); }
.verdict.lose { color: var(--red); text-shadow: 3px 3px 0 #000; }
.verdict.draw { color: var(--cyan); text-shadow: 3px 3px 0 #000; }
.help { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.help .panel h3 { color: var(--gold); margin-bottom: 6px; font-size: 22px; }
.help li { margin: 4px 0; font-size: 14px; line-height: 1.35; }
kbd { background: #fff; color: #111; border-radius: 4px; padding: 1px 6px; font-weight: 800; font-size: 12px; box-shadow: 0 2px 0 #888; font-family: var(--body); }
.seg { display: flex; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { flex: 1; padding: 8px 14px; background: rgba(255,255,255,.05); border: 0; font-weight: 800; font-size: 14px; }
.seg button.on { background: linear-gradient(180deg, var(--gold), var(--gold2)); color: #2a1200; }
.champ { text-align: center; }
.champ .trophy { font-size: clamp(80px, 22vw, 180px); filter: drop-shadow(0 0 30px var(--gold)); animation: floaty2 2.4s ease-in-out infinite; }
@keyframes floaty2 { 50% { transform: translateY(-10px) rotate(2deg); } }
.champ h1 { font-size: clamp(34px, 8vw, 80px); color: var(--gold); text-shadow: 4px 4px 0 #b3123a, 8px 8px 0 #000; }
.scorers li { display: flex; align-items: center; gap: 8px; font-weight: 700; margin: 4px 0; }
.scorers img { width: 24px; height: 16px; border-radius: 2px; }
.scorers .g { margin-left: auto; font-family: var(--disp); color: var(--gold); font-size: 20px; }
ol, ul { margin: 0; padding-left: 18px; }
.scorers { list-style: none; padding: 0; }
.dim { opacity: 0.55; }
.center { text-align: center; }
#rotate-hint { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); font-size: 12px; background: rgba(0,0,0,.7); padding: 6px 12px; border-radius: 99px; display: none; pointer-events: none; z-index: 50; }
@media (orientation: portrait) and (max-width: 700px) { #rotate-hint.on { display: block; } }
@media (max-width: 700px) {
  .code { font-size: 17px; } .score { font-size: 28px; } .flag { width: 26px; height: 17px; }
  #scoreboard .team { padding: 4px 8px 3px; column-gap: 5px; } #team-a { padding-right: 18px; } #team-b { padding-left: 18px; }

/* Super Rigori World Cup — regolamento della serie di rigori (puro, senza DOM)
 *
 *  - kick alternati A/B, serie da 5 per squadra
 *  - modalità 'knockout': terminazione anticipata quando una squadra non può più essere raggiunta,
 *    poi oltranza (a coppie di tiri) fino a quando, a parità di rigori battuti, c'è una differenza reti
 *  - modalità 'group': si battono sempre tutti e 5 i rigori; il pareggio è ammesso (1 punto)
 */
(function (root) {
  'use strict';
  const PK = (root.PK = root.PK || {});
  const other = (t) => (t === 'A' ? 'B' : 'A');

  class Shootout {
    constructor(mode = 'knockout', first = 'A', perSide = 5) {
      this.mode = mode;
      this.first = first;
      this.K = perSide;
      this.kicks = []; // {team, scored, idx}
      this.goals = { A: 0, B: 0 };
      this.taken = { A: 0, B: 0 };
      this.over = false;
      this.winner = null; // 'A' | 'B' | null (pareggio solo nei gironi)
    }

    get next() {
      return this.kicks.length % 2 === 0 ? this.first : other(this.first);
    }
    get sudden() {
      return this.taken.A >= this.K && this.taken.B >= this.K;
    }
    /** indice (0-based) del prossimo rigore della squadra che deve battere */
    get nextIndex() {
      return this.taken[this.next];
    }

    record(team, scored) {
      if (this.over) throw new Error('serie già conclusa');
      if (team !== this.next) throw new Error('turno sbagliato: tocca a ' + this.next);
      this.kicks.push({ team, scored: !!scored, idx: this.taken[team] });
      this.taken[team]++;
      if (scored) this.goals[team]++;
      this._check();
      return this.over;
    }

    _check() {
      const { A: gA, B: gB } = this.goals;
      const tA = this.taken.A, tB = this.taken.B, K = this.K;
      if (this.mode === 'group') {
        if (tA >= K && tB >= K) this._end(gA > gB ? 'A' : gB > gA ? 'B' : null);
        return;
      }
      if (tA < K || tB < K) {
        // fase regolare: terminazione anticipata
        const remA = Math.max(0, K - tA), remB = Math.max(0, K - tB);
        if (gA > gB + remB) return this._end('A');
        if (gB > gA + remA) return this._end('B');
        return;
      }
      // oltranza: decide solo a parità di tiri battuti
      if (tA === tB && gA !== gB) this._end(gA > gB ? 'A' : 'B');
    }

    _end(w) {
      this.over = true;
      this.winner = w;
    }

    /** Situazione del prossimo tiro, per pressione psicologica / commento */
    situation() {
      const team = this.next, opp = other(team);
      const K = this.K;
      const tT = this.taken[team], tO = this.taken[opp];
      const gT = this.goals[team], gO = this.goals[opp];
      const sudden = this.sudden;
      let mustScore = false, matchPoint = false;
      if (this.mode === 'group') {
        const remT = K - tT - 1, remO = K - tO;
        mustScore = false;
        matchPoint = false;
        return { team, sudden: false, mustScore, matchPoint, round: tT + 1, pressure: 0.15 + 0.1 * (tT / K), decisive: false, remT, remO };
      }
      if (tT >= K) {
        // oltranza: siamo nel turno (tT === tO) o chi calcia per secondo (tT === tO - 1... )
        if (team === this.first) {
          // calcio per primo il turno: non decide ancora
          mustScore = false;
          matchPoint = false;
        } else {
          // secondo: se l'altro ha segnato nel turno, dobbiamo segnare; se ha sbagliato, segnando vinciamo
          const last = this.kicks[this.kicks.length - 1];
          mustScore = !!(last && last.scored);

        const remT = K - tT - 1; // dopo questo tiro
        const remO = Math.max(0, K - tO);

  /** Probabilità di segnare di un rigorista contro un portiere (usata solo per le simulazioni) */
  function pScore(kickerAtk, gk) {
    return M.clamp(0.745 + (kickerAtk - gk) * 0.0042, 0.55, 0.9);
  }

  class Tournament {
    constructor(opts) {
      opts = opts || {};
      this.player = opts.player || null;
      this.seed = opts.seed != null ? opts.seed : (Math.random() * 1e9) | 0;
      this.difficulty = opts.difficulty || 'normal';
      this.rng = M.rng(this.seed);
      this.results = {}; // id -> result
      this.rounds = [];
      this.roundIndex = 0;
      this.scorers = {}; // "CODE|nome" -> gol
      this.groups = this._draw();
      this.over = false;
      this.champion = null;
      this._buildGroupRounds();
    }

    // ------------------------------------------------------------ sorteggio
    _draw() {
      const teams = PK.TEAMS.slice().sort((a, b) => PK.teamOverall(b) - PK.teamOverall(a));
      const pots = [0, 1, 2, 3].map((i) => teams.slice(i * 8, i * 8 + 8));
      const rng = this.rng;
      for (let attempt = 0; attempt < 500; attempt++) {
        const groups = GROUP_IDS.map((id) => ({ id, teams: [] }));
        let ok = true;
        for (let p = 0; p < 4 && ok; p++) {
          const order = M.shuffle(rng, pots[p]);
          const slots = M.shuffle(rng, groups);
          // assegna ogni squadra al primo gruppo valido (max 2 UEFA, max 1 per le altre confederazioni)
          const free = slots.slice();
          for (const t of order) {
            const idx = free.findIndex((g) => {
              const n = g.teams.filter((x) => PK.TEAM[x].conf === t.conf).length;
              return t.conf === 'UEFA' ? n < 2 : n < 1;
            });
            if (idx < 0) { ok = false; break; }
            free[idx].teams.push(t.code);
            free.splice(idx, 1);
          }
        }
        if (ok) return groups;
      }
      // fallback senza vincoli
      const groups = GROUP_IDS.map((id) => ({ id, teams: [] }));
      pots.forEach((pot) => M.shuffle(rng, pot).forEach((t, i) => groups[i].teams.push(t.code)));
      return groups;
    }

    _buildGroupRounds() {
      // calendario del Mondiale 2022: 1v2 3v4 | 4v2 1v3 | 4v1 2v3
      const sched = [
        [[0, 1], [2, 3]],
        [[3, 1], [0, 2]],
        [[3, 0], [1, 2]],
      ];
      sched.forEach((pairs, d) => {
        const matches = [];
        this.groups.forEach((g) => {
          pairs.forEach((p, k) => {
            matches.push({ id: `G${d + 1}-${g.id}-${k + 1}`, stage: 'G' + (d + 1), group: g.id, a: g.teams[p[0]], b: g.teams[p[1]], result: null });
          });
        });
        this.rounds.push({ id: 'G' + (d + 1), stage: 'group', label: STAGE_LABEL['G' + (d + 1)], matches });
      });
    }

    // -------------------------------------------------------------- accessi
    get round() { return this.rounds[this.roundIndex] || null; }
    stageLabel(id) { return STAGE_LABEL[id] || id; }
    team(code) { return PK.TEAM[code]; }
    group(id) { return this.groups.find((g) => g.id === id); }
    findMatch(id) {
      for (const r of this.rounds) for (const m of r.matches) if (m.id === id) return m;
      return null;
    }
    isKnockout(round) { return round && round.stage === 'ko'; }

    /** La partita del giocatore nel turno corrente (null se eliminato / nessuna) */
    playerMatch() {
      const r = this.round;
      if (!r || !this.player) return null;
      return r.matches.find((m) => !m.result && (m.a === this.player || m.b === this.player)) || null;
    }
    /** Il giocatore è ancora in gioco? */
    playerAlive() {
      if (!this.player || this.over) return false;
      return !this.eliminated(this.player);
    }
    eliminated(code) {
      // fuori nei gironi?
      if (this.rounds.length > 3) {
        // i gironi sono conclusi: eliminato se non è nel tabellone o ha perso un turno KO
        let inBracket = false;
        for (const r of this.rounds.slice(3)) {
          for (const m of r.matches) {
            if (m.a === code || m.b === code) {
              inBracket = true;
              if (m.result && m.result.winner && m.stage !== '3P') {
                const w = m.result.winner === 'A' ? m.a : m.b;
                if (w !== code) return true;
              }
            }
          }
        }
        return !inBracket;
      }
      return false;
    }

    // ------------------------------------------------------------ risultati
    /** Risultato di una serie di rigori: { goals:{A,B}, winner, kicks:[{team,scored,kicker}], first, sudden } */
    recordResult(matchId, result) {
      const m = this.findMatch(matchId);
      if (!m) throw new Error('partita sconosciuta ' + matchId);
      m.result = result;
      this.results[matchId] = result;
      (result.kicks || []).forEach((k) => {
        if (k.scored && k.kicker) {
          const code = k.team === 'A' ? m.a : m.b;
          const key = code + '|' + k.kicker;
          this.scorers[key] = (this.scorers[key] || 0) + 1;
        }
      });
    }

    /** Simula una partita tra due squadre non giocata dall'utente */
    simulate(m) {
      const A = PK.TEAM[m.a], B = PK.TEAM[m.b];
      const ko = m.stage !== 'G1' && m.stage !== 'G2' && m.stage !== 'G3';
      const first = this.rng() < 0.5 ? 'A' : 'B';
      const so = new PK.Shootout(ko ? 'knockout' : 'group', first);
      const sqA = PK.buildSquad(A), sqB = PK.buildSquad(B);
      const kicks = [];
      let guard = 0;
      while (!so.over && guard++ < 60) {
        const team = so.next;
        const T = team === 'A' ? A : B, O = team === 'A' ? B : A;
        const sq = team === 'A' ? sqA : sqB;
        const kicker = sq.kickers[so.nextIndex % sq.kickers.length];
        const atk = (T.atk + (kicker.acc + kicker.comp) * 50 - 80) * 0.5 + T.atk * 0.5;
        const sc = this.rng() < pScore(atk, O.gk);
        so.record(team, sc);
        kicks.push({ team, scored: sc, kicker: kicker.name, idx: so.taken[team] - 1 });
      }
      return { goals: { A: so.goals.A, B: so.goals.B }, winner: so.winner, kicks, first, sudden: so.taken.A > so.K || so.taken.B > so.K, sim: true };
    }

    /** Simula tutte le partite rimaste senza risultato nel turno corrente (tranne quelle del giocatore se `keepPlayer`) */
    simulateRound(keepPlayer) {
      const r = this.round;
      if (!r) return;
      r.matches.forEach((m) => {
        if (m.result) return;
        if (keepPlayer && this.player && (m.a === this.player || m.b === this.player)) return;
        this.recordResult(m.id, this.simulate(m));
      });
    }

    roundComplete() {
      const r = this.round;
      return !!r && r.matches.every((m) => m.result);
    }

    /** Se il turno corrente è completo passa al successivo creando gli incontri a eliminazione diretta */
    advance() {
      if (!this.roundComplete()) return false;
      const r = this.round;
      if (r.id === 'G3') this._buildR16();
      else if (r.id === 'R16') this._buildKO('QF', 'Quarti di finale', [[4, 5], [0, 1], [6, 7], [2, 3]], 'R16');
      else if (r.id === 'QF') this._buildKO('SF', 'Semifinali', [[0, 1], [2, 3]], 'QF');
      else if (r.id === 'SF') {
        this._buildFinals();
      } else if (r.id === '3P') {
        // dopo la finalina si gioca la finale
        this.roundIndex++;
        return true;
      } else if (r.id === 'F') {
        const m = r.matches[0];
        this.champion = m.result.winner === 'A' ? m.a : m.b;
        this.over = true;
        return true;
      }
      this.roundIndex++;
      return true;
    }

    winnerOf(m) { return m.result.winner === 'A' ? m.a : m.b; }
    loserOf(m) { return m.result.winner === 'A' ? m.b : m.a; }

    _buildR16() {
      const st = {};
      this.groups.forEach((g) => (st[g.id] = this.standings(g.id).map((s) => s.code)));
      const P = (g, pos) => st[g][pos - 1];
      const pairs = [
        [P('A', 1), P('B', 2)], [P('C', 1), P('D', 2)], [P('B', 1), P('A', 2)], [P('D', 1), P('C', 2)],
        [P('E', 1), P('F', 2)], [P('G', 1), P('H', 2)], [P('F', 1), P('E', 2)], [P('H', 1), P('G', 2)],
      ];
      this.rounds.push({
        id: 'R16', stage: 'ko', label: STAGE_LABEL.R16,
        matches: pairs.map((p, i) => ({ id: 'R16-' + (i + 1), stage: 'R16', a: p[0], b: p[1], result: null })),
      });
    }

    _buildKO(id, label, links, prevId) {
      const prev = this.rounds.find((r) => r.id === prevId);
      this.rounds.push({
        id, stage: 'ko', label,
        matches: links.map((l, i) => ({
          id: id + '-' + (i + 1), stage: id,
          a: this.winnerOf(prev.matches[l[0]]), b: this.winnerOf(prev.matches[l[1]]), result: null,
        })),
      });
    }

    _buildFinals() {
      const sf = this.rounds.find((r) => r.id === 'SF');
      this.rounds.push({
        id: '3P', stage: 'ko', label: STAGE_LABEL['3P'],
        matches: [{ id: '3P-1', stage: '3P', a: this.loserOf(sf.matches[0]), b: this.loserOf(sf.matches[1]), result: null }],
      });
      this.rounds.push({
        id: 'F', stage: 'ko', label: STAGE_LABEL.F,
        matches: [{ id: 'F-1', stage: 'F', a: this.winnerOf(sf.matches[0]), b: this.winnerOf(sf.matches[1]), result: null }],
      });
    }

    // ------------------------------------------------------------ classifiche
    _rows(groupId, onlyAmong) {
      const g = this.group(groupId);
      const rows = {};
      g.teams.forEach((c) => (rows[c] = { code: c, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 }));
      this.rounds.slice(0, 3).forEach((r) =>
        r.matches.forEach((m) => {
          if (m.group !== groupId || !m.result) return;
          if (onlyAmong && !(onlyAmong.includes(m.a) && onlyAmong.includes(m.b))) return;
          const a = rows[m.a], b = rows[m.b], res = m.result;
          a.p++; b.p++;
          a.gf += res.goals.A; a.ga += res.goals.B;
          b.gf += res.goals.B; b.ga += res.goals.A;
          if (res.winner === 'A') { a.w++; b.l++; a.pts += 3; }
          else if (res.winner === 'B') { b.w++; a.l++; b.pts += 3; }
          else { a.d++; b.d++; a.pts++; b.pts++; }
        })
      );
      Object.values(rows).forEach((r) => (r.gd = r.gf - r.ga));
      return rows;
    }

    /** Classifica di un girone: punti, differenza reti, gol fatti, scontri diretti, sorteggio */
    standings(groupId) {
      const rows = this._rows(groupId);
      const list = Object.values(rows);
      const lots = M.rng(this.seed ^ M.hash('lots' + groupId));
      list.forEach((r) => (r.lot = lots()));
      const cmp = (a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf;
      list.sort(cmp);
      // spareggi: scontri diretti tra le squadre ancora pari
      let i = 0;
      while (i < list.length) {
        let j = i + 1;
        while (j < list.length && cmp(list[i], list[j]) === 0) j++;
        if (j - i > 1) {
          const codes = list.slice(i, j).map((r) => r.code);
          const h2h = this._rows(groupId, codes);
          const sub = list.slice(i, j).sort((a, b) => cmp(h2h[a.code], h2h[b.code]) || a.lot - b.lot);
          for (let k = i; k < j; k++) list[k] = sub[k - i];
        }
        i = j;
      }
      return list;
    }

    groupDone(groupId) {
      return this.rounds.slice(0, 3).every((r) => r.matches.filter((m) => m.group === groupId).every((m) => m.result));
    }

    topScorers(n = 5) {
      return Object.entries(this.scorers)
        .map(([k, v]) => ({ code: k.split('|')[0], name: k.split('|')[1], goals: v }))
        .sort((a, b) => b.goals - a.goals || a.name.localeCompare(b.name))
        .slice(0, n);
    }

    /** Fase raggiunta dal giocatore (testo) */
    playerStageText() {
      const p = this.player;
      if (!p) return '';
      if (this.champion === p) return 'Campione del Mondo';
      const ko = this.rounds.slice(3);
      if (!ko.length) return 'Fase a gironi';
      let last = null;
      ko.forEach((r) => r.matches.forEach((m) => { if (m.a === p || m.b === p) last = { r, m }; }));
      if (!last) return 'Fase a gironi';
      const { r, m } = last;
      if (r.id === 'F') return m.result ? 'Finalista' : 'In finale';
      if (r.id === '3P') return m.result ? (this.winnerOf(m) === p ? 'Terzo posto' : 'Quarto posto') : 'Finale 3º posto';
      return { R16: 'Ottavi di finale', QF: 'Quarti di finale', SF: 'Semifinali' }[r.id];
    }

    // ---------------------------------------------------------- persistenza
    toJSON() {
      return {
        v: 1, player: this.player, seed: this.seed, difficulty: this.difficulty, roundIndex: this.roundIndex,
        rounds: this.rounds, scorers: this.scorers, groups: this.groups, over: this.over, champion: this.champion,
      };
    }
    static fromJSON(o) {
      const t = new Tournament({ player: o.player, seed: o.seed, difficulty: o.difficulty });
      t.rounds = o.rounds;
      t.roundIndex = o.roundIndex;
      t.scorers = o.scorers;
      t.groups = o.groups;
      t.over = o.over;
      t.champion = o.champion;
      return t;
    }
  }

  Tournament.STAGE_LABEL = STAGE_LABEL;
  Tournament.pScore = pScore;
  PK.Tournament = Tournament;
  if (typeof module !== 'undefined' && module.exports) module.exports = PK;
})(typeof window !== 'undefined' ? window : globalThis);

/* Super Rigori World Cup — scheletro umano: IK a due ossa, usato sia per il disegno sia per le collisioni
 *
 * Sistema di riferimento del mondo (mancino): x = destra, y = su, z = verso la porta.
 * Locale del personaggio: +x = sua destra, +y = alto, +z = davanti.
 */
(function (root) {
  'use strict';
  const PK = (root.PK = root.PK || {});
  const M = PK.M;
  const mat = M.mat;

  const D = {
    thigh: 0.45, shin: 0.44, upper: 0.29, fore: 0.26, hand: 0.1,
    torso: 0.5, neck: 0.09, head: 0.13, shW: 0.21, hipW: 0.1, foot: 0.21, ankleH: 0.07,
  };

  /** IK a due ossa: restituisce {mid, end} ; il segmento viene accorciato/clampato se il bersaglio è fuori portata */
  function ik2(A, T, l1, l2, pole) {
    let dx = T.x - A.x, dy = T.y - A.y, dz = T.z - A.z;
    let d = Math.hypot(dx, dy, dz);
    if (d < 1e-6) { dx = 0; dy = -1; dz = 0; d = 1; }
    const ux = dx / d, uy = dy / d, uz = dz / d;
    const maxd = l1 + l2 - 1e-4, mind = Math.abs(l1 - l2) + 1e-3;
    const dc = d > maxd ? maxd : d < mind ? mind : d;
    const a = (l1 * l1 - l2 * l2 + dc * dc) / (2 * dc);
    const h = Math.sqrt(Math.max(l1 * l1 - a * a, 0));
    const pu = pole.x * ux + pole.y * uy + pole.z * uz;
    let px = pole.x - ux * pu, py = pole.y - uy * pu, pz = pole.z - uz * pu;
    let pl = Math.hypot(px, py, pz);
    if (pl < 1e-5) { px = 0; py = 0; pz = 1; pl = 1; }
    px /= pl; py /= pl; pz /= pl;
    return {
      mid: { x: A.x + ux * a + px * h, y: A.y + uy * a + py * h, z: A.z + uz * a + pz * h },
      end: { x: A.x + ux * dc, y: A.y + uy * dc, z: A.z + uz * dc },
    };
  }

  /**
   * pose: { pelvis, R (3x3 radice), lean, twist, headYaw, headPitch, footL, footR (caviglie), handL, handR (polsi),
   *         toeL, toeR (beccheggio piede), legPole, armPoleL, armPoleR (in locale), scale }
   */
  function solve(pose) {
    const R = pose.R || mat.ident();
    const L = (v) => mat.apply(R, v); // locale -> mondo (radice)
    const sc = pose.scale || 1;
    const pel = pose.pelvis;
    const lean = pose.lean || 0, twist = pose.twist || 0;
    const Rc = mat.mul(R, mat.mul(mat.rotZ(pose.roll || 0), mat.mul(mat.rotX(lean), mat.rotY(twist))));
    const C = (v) => mat.apply(Rc, v);
    const chest = M.add(pel, C({ x: 0, y: D.torso * sc, z: 0 }));
    const Rh = mat.mul(Rc, mat.mul(mat.rotY(pose.headYaw || 0), mat.rotX(pose.headPitch || 0)));
    const neck = M.add(chest, C({ x: 0, y: D.neck * sc, z: 0 }));
    const head = M.add(neck, mat.apply(Rh, { x: 0, y: D.head * 1.0 * sc, z: 0.0 }));
    const sh = D.shW * sc;
    const shoulderR = M.add(chest, C({ x: sh, y: -0.03, z: 0 }));
    const shoulderL = M.add(chest, C({ x: -sh, y: -0.03, z: 0 }));
    const hipR = M.add(pel, L({ x: D.hipW * sc, y: -0.04, z: 0 }));
    const hipL = M.add(pel, L({ x: -D.hipW * sc, y: -0.04, z: 0 }));

    const lp = pose.legPole || { x: 0, y: 0, z: 1 };
    const apR = pose.armPoleR || { x: 0.5, y: -0.4, z: -0.6 };
    const apL = pose.armPoleL || { x: -0.5, y: -0.4, z: -0.6 };
    const legR = ik2(hipR, pose.footR, D.thigh * sc, D.shin * sc, L({ x: lp.x + 0.12, y: lp.y, z: lp.z }));
    const legL = ik2(hipL, pose.footL, D.thigh * sc, D.shin * sc, L({ x: lp.x - 0.12, y: lp.y, z: lp.z }));
    const armR = ik2(shoulderR, pose.handR, D.upper * sc, D.fore * sc, pose.armPoleWorld ? apR : C(apR));
    const armL = ik2(shoulderL, pose.handL, D.upper * sc, D.fore * sc, pose.armPoleWorld ? apL : C(apL));

    const toe = (ankle, pitch, yaw) => {
      const Rf = mat.mul(R, mat.mul(mat.rotY(yaw || 0), mat.rotX(pitch == null ? 0.34 : pitch)));
      return M.add(ankle, mat.apply(Rf, { x: 0, y: 0, z: D.foot * sc }));
    };
    const handTip = (el, wr) => {
      const d = M.norm(M.sub(wr, el));
      return M.addS(wr, d, D.hand * sc);
    };
    return {
      sc, R, Rc, Rh,
      pelvis: pel, chest, neck, head,
      headFwd: mat.apply(Rh, { x: 0, y: 0, z: 1 }),
      headUp: mat.apply(Rh, { x: 0, y: 1, z: 0 }),
      headRight: mat.apply(Rh, { x: 1, y: 0, z: 0 }),
      shoulderR, shoulderL, hipR, hipL,
      elbowR: armR.mid, wristR: armR.end, handTipR: handTip(armR.mid, armR.end),
      elbowL: armL.mid, wristL: armL.end, handTipL: handTip(armL.mid, armL.end),
      kneeR: legR.mid, ankleR: legR.end, toeR: toe(legR.end, pose.toeR, pose.footYawR),
      kneeL: legL.mid, ankleL: legL.end, toeL: toe(legL.end, pose.toeL, pose.footYawL),
    };
  }

  /** Capsule di collisione {a,b,r,tag} dello scheletro risolto */
  function capsules(sk, glove) {
    const s = sk.sc;
    const gr = glove || 0.12;
    return [
      { a: sk.pelvis, b: sk.chest, r: 0.19 * s, tag: 'torso' },
      { a: sk.head, b: sk.head, r: 0.125 * s, tag: 'head' },
      { a: sk.shoulderR, b: sk.elbowR, r: 0.06 * s, tag: 'arm' },
      { a: sk.elbowR, b: sk.wristR, r: 0.055 * s, tag: 'arm' },
      { a: sk.wristR, b: sk.handTipR, r: gr, tag: 'hand' },
      { a: sk.shoulderL, b: sk.elbowL, r: 0.06 * s, tag: 'arm' },
      { a: sk.elbowL, b: sk.wristL, r: 0.055 * s, tag: 'arm' },
      { a: sk.wristL, b: sk.handTipL, r: gr, tag: 'hand' },
      { a: sk.hipR, b: sk.kneeR, r: 0.095 * s, tag: 'leg' },
      { a: sk.kneeR, b: sk.ankleR, r: 0.07 * s, tag: 'leg' },
      { a: sk.ankleR, b: sk.toeR, r: 0.06 * s, tag: 'leg' },
      { a: sk.hipL, b: sk.kneeL, r: 0.095 * s, tag: 'leg' },
      { a: sk.kneeL, b: sk.ankleL, r: 0.07 * s, tag: 'leg' },
      { a: sk.ankleL, b: sk.toeL, r: 0.06 * s, tag: 'leg' },
    ];
  }

  PK.Rig = { D, solve, capsules, ik2 };
  if (typeof module !== 'undefined' && module.exports) module.exports = PK;
})(typeof window !== 'undefined' ? window : globalThis);

/* Super Rigori World Cup — portiere: posa di attesa, tuffo cinematico a portata limitata, capsule di collisione */
(function (root) {

  const PK = (root.PK = root.PK || {});
  const M = PK.M;
  const mat = M.mat;
  const { clamp, lerp } = M;

  class Keeper {
    constructor(opts) {

      this.z0 = 10.88;
      this.sc = opts.scale || 1.04;
      this.dive = null;
      this.special = false;
      this.mood = null; // {type:'cheer'|'sad', t0}

    }

      const special = !!opts.special;
      const x0 = this.swayX(t);

        } else {
