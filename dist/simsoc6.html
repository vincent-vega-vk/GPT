      totalRounds: cup.totalRounds,
      rounds: cup.rounds.map((rd, ri) => ({ name: rd.name, ties: rd.ties.map(t => {
        const rt = tieResultText(cup, ri, t);
        return { home: s.clubs[t.home].name, away: t.away === -1 ? '(bye)' : s.clubs[t.away].name, homeIdx: t.home, awayIdx: t.away,
          score: rt.score, agg: rt.agg, winner: t.winner != null ? s.clubs[t.winner].name : null, pens: !!t.pens, shootout: t.shootout || null };
      }) }))
    };
  }

  /* ===================================================================== *
   * SEASON ROLLOVER
   * ===================================================================== */
  function endSeason(s) {
    const rng = Data.makeRng((s.seed ^ (s.season * 99991)) >>> 0);
    const snaps = s.divisions.map((_, d) => standings(s, d));
    const oldUserDiv = s.userDivision, uc = user(s);
    const userPos = snaps[oldUserDiv].findIndex(r => r.isUser) + 1;
    const idxByName = clubIndexMap(s);

    // awards per league: golden boot + player of the season
    const awards = s.divisions.map((dv, d) => {
      const lead = leagueLeaders(s, d, 1);
      return { division: dv.name, nation: dv.nation, boot: lead.scorers[0] ? { name: lead.scorers[0].name, club: lead.scorers[0].club, goals: lead.scorers[0].value } : null,
        player: lead.ratings[0] ? { name: lead.ratings[0].name, club: lead.ratings[0].club, rating: lead.ratings[0].value } : null };
    });
    // the roll of honour
    s.honours.push({
      season: s.season, label: seasonLabel(s),
      divisions: snaps.map((st, d) => ({ name: s.divisions[d].name, nation: s.divisions[d].nation, first: st[0] && st[0].name, second: st[1] && st[1].name, third: st[2] && st[2].name })),
      cups: Object.keys(s.cups).map(id => ({ id: id, name: s.cups[id].name, nation: s.cups[id].nation, winner: s.cups[id].winner != null ? s.clubs[s.cups[id].winner].name : '—' })),
      awards: awards
    });
    // the manager's own career log (unless he was sacked mid-season and never took a new job)
    const myTrophies = [];
    if (snaps[oldUserDiv][0] && snaps[oldUserDiv][0].isUser) myTrophies.push(s.divisions[oldUserDiv].name + ' title');
    Object.keys(s.cups).forEach(id => { if (s.cups[id].winner === s.userClub) myTrophies.push(s.cups[id].name); });
    const obj = s.board.objective;
    const met = obj ? userPos <= obj.target : false;
    if (!s.sacked) s.career.push({ season: s.season, label: seasonLabel(s), club: uc.name, division: s.divisions[oldUserDiv].name, position: userPos, trophies: myTrophies,
      record: Object.assign({}, s.seasonRecord), objective: obj ? obj.label : '', met: met });

    // league prize money
    const n = snaps[oldUserDiv].length, lv = s.divisions[oldUserDiv].level;
    const prize = Math.round((Data.ECON[lv] || Data.ECON[2]).prize * 10 * (n - userPos + 1) / n / 1000) * 1000;
    uc.balance += prize; book(s, 'prize', prize);

    s.euroQual = computeEuroQual(s, snaps);
    s.prev = {
      premChamp: snaps[0][0] ? idxByName[snaps[0][0].name] : null,
      premRunnerUp: snaps[0][1] ? idxByName[snaps[0][1].name] : null,
      faCup: s.cups.fa ? s.cups.fa.winner : null,
      ucl: s.cups.champions ? s.cups.champions.winner : null,
      uefa: s.cups.uefa ? s.cups.uefa.winner : null
    };

    // promotion / relegation, nation by nation
    const moves = [];
    Data.NATION_ORDER.forEach(nat => {
      const swap = Data.NATION_RULES[nat].swap;
      const tiers = s.divisions.map((dv, d) => d).filter(d => s.divisions[d].nation === nat).sort((a, b) => s.divisions[a].tier - s.divisions[b].tier);
      if (!swap) return;
      for (let k = 0; k < tiers.length - 1; k++) {
        const up = tiers[k], down = tiers[k + 1];
        snaps[up].slice(snaps[up].length - swap).forEach(r => moves.push({ name: r.name, to: down }));
        snaps[down].slice(0, swap).forEach(r => moves.push({ name: r.name, to: up }));
      }
    });
    moves.forEach(m => { const ci = idxByName[m.name]; if (ci != null) s.clubs[ci].division = m.to; });
    s.divisions.forEach((dv, d) => { dv.members = s.clubs.map((c, i) => (c.division === d ? i : -1)).filter(i => i >= 0); });
    s.userDivision = s.clubs[s.userClub].division;
    const promoted = s.divisions[s.userDivision].nation === s.divisions[oldUserDiv].nation && s.divisions[s.userDivision].tier < s.divisions[oldUserDiv].tier;
    const relegated = s.divisions[s.userDivision].tier > s.divisions[oldUserDiv].tier;

    // board verdict + reputation
    let verdict;
    if (!s.sacked) {
      let dRep = (obj ? (obj.target - userPos) * 0.9 : 0) + myTrophies.length * 4 + (promoted ? 6 : 0) - (relegated ? 6 : 0);
      dRep += (clubPrestige(s, s.userClub) - s.reputation) * 0.08;
      s.reputation = clamp(s.reputation + clamp(dRep, -10, 14), 5, 100);
      if (met || promoted || myTrophies.length) { s.board.confidence = clamp(Math.max(s.board.confidence, 62) + 12, 0, 100); verdict = 'The board is delighted: objective "' + (obj ? obj.label : '') + '" achieved.'; }
      else if (obj && userPos <= obj.target + 3) { s.board.confidence = clamp(Math.max(s.board.confidence, 45), 0, 100); verdict = 'The board is satisfied with a respectable season.'; }
      else { s.board.confidence = clamp(s.board.confidence - 15, 0, 100); verdict = 'The board is disappointed with the season.'; }
    }

    if (!s.sacked) {
      if (snaps[oldUserDiv][0] && snaps[oldUserDiv][0].isUser) unlock(s, 'champions');
      if (promoted) unlock(s, 'promotion');
      const boot = awards[oldUserDiv] && awards[oldUserDiv].boot;
      if (boot && boot.club === uc.name) unlock(s, 'golden-boot');
      if (s.divisions[s.userDivision].tier === 1) unlock(s, 'top-flight');
    }
    let msg = 'Season ' + seasonLabel(s) + ' over. ' + s.divisions[0].name + ' champions: ' + snaps[0][0].name + '. ';
    if (promoted) msg += 'PROMOTED! ' + uc.name + ' go up to ' + s.divisions[s.userDivision].name + '.';
    else if (relegated) msg += uc.name + ' relegated to ' + s.divisions[s.userDivision].name + '.';
    else msg += uc.name + ' finished ' + ordinal(userPos) + ' in ' + s.divisions[oldUserDiv].name + '.';
    s.notices.push(msg);
    s.pendingReview = {
      season: s.season, label: seasonLabel(s), club: uc.name, division: s.divisions[oldUserDiv].name, position: userPos,
      objective: obj ? obj.label : '', target: obj ? obj.target : null, met: met, promoted: promoted, relegated: relegated,
      trophies: myTrophies, verdict: verdict || '', record: Object.assign({}, s.seasonRecord), prize: prize, sacked: s.sacked,
      champions: snaps.map((st, d) => ({ division: s.divisions[d].name, nation: s.divisions[d].nation, club: st[0] && st[0].name })),
      cups: Object.keys(s.cups).map(id => ({ name: s.cups[id].name, nation: s.cups[id].nation, winner: s.cups[id].winner != null ? s.clubs[s.cups[id].winner].name : '—' })),
      awards: awards.filter(a => a.nation === s.divisions[oldUserDiv].nation || s.divisions.find(x => x.name === a.division).level === 1),
      reputation: Math.round(s.reputation)
    };
    news(s, snaps[0][0].name + ' are crowned ' + s.divisions[0].name + ' champions.', 'trophy');
    snaps.forEach((st, d) => { if (d !== 0 && s.divisions[d].tier === 1 && st[0]) news(s, st[0].name + ' win the ' + s.divisions[d].name + '.', 'trophy'); });

    // reset for the new season
    s.season++; s.year++; s.day = 0; s.trainedRound = -1;
    s.divisions.forEach(dv => { dv.table = blankTable(dv.members, s.clubs); dv.results = []; dv.fixtures = makeFixtures(dv.members, rng, dv.legs); });
    s.L = Math.max.apply(null, s.divisions.map(dv => (dv.members.length - 1) * dv.legs));
    s.divisions.forEach(dv => { dv.schedule = buildSchedule((dv.members.length - 1) * dv.legs, s.L); });
    s.clubs.forEach(c => { c.form = []; });
    // a year passes: age everyone, retire the veterans, develop (very aleatory), contracts run down
    const expired = [], youth = [];
    s.clubs.forEach((c, ci) => {
      const retained = [];
      const lvl = c.division >= 0 ? s.divisions[c.division].level : 2;
      c.players.forEach(p => {
        p.age = (p.age || 24) + 1;
        if (p.age >= (p.retireAge || 38)) {
          if (c.isUser) s.exPlayers.push(exRecord(s, p, 'Retired aged ' + p.age));
          return;
        }
        p.appsSeason = 0; p.goalsSeason = 0; p.lgGoals = 0; p.assistsSeason = 0; p.lgAssists = 0; p.rSum = 0; p.rN = 0; p.potm = 0; p.form = [];
        p.yellows = 0; p.suspendedFor = 0;
        let dlt;
        if (p.age <= 23) dlt = Data.ri(rng, 0, 4) + Math.round(((p.pot || p.skill) - p.skill) * 0.3 * rng());
        else if (p.age <= 29) dlt = Data.ri(rng, -2, 3);
        else if (p.age <= 32) dlt = Data.ri(rng, -4, 1);
        else dlt = Data.ri(rng, -6, 0);
        dlt += Data.ri(rng, -4, 4);                          // form can rise or fall sharply year to year
        p.skill = clamp((p.skill || 40) + dlt, 20, 99);
        p.pot = Math.max(p.skill, p.age >= 28 ? p.skill : (p.pot || p.skill));
        Data.recomputeValue(p, rng);
        p.fit = clamp(85 + Data.ri(rng, 0, 15), 10, 100);
        p.injuredFor = rng() < 0.04 ? Data.ri(rng, 1, 4) : 0; p.injured = p.injuredFor > 0;
        p.contract = (p.contract || 1) - 1;
        if (p.contract <= 0) {
          if (c.isUser) { expired.push(p); s.exPlayers.push(exRecord(s, p, 'Contract expired')); p.club = FREE_AGENT; p.contract = 0; s.transferPool.push(p); return; }
          if (p.age <= 32 && rng() < 0.8) { p.contract = Data.ri(rng, 1, 3); p.wage = Data.wageFor(p, lvl); }
          else { p.club = FREE_AGENT; p.contract = 0; s.transferPool.push(p); return; }
        }
        p.transferListed = false;
        retained.push(p);
      });
      c.players = retained;
      const centre = c.division >= 0 ? Data.clubCentre(s.divisions[c.division].level === 1 ? 66 : s.divisions[c.division].level === 2 ? 56 : s.divisions[c.division].level === 3 ? 48 : 40, c.tier || 3) : 52;
      const nat = c.division >= 0 ? s.divisions[c.division].nation : c.nation;
      if (c.isUser) {
        const intake = Math.min(Data.ri(rng, 2, 3), Math.max(0, MAX_SQUAD - c.players.length));
        for (let k = 0; k < intake; k++) {
          const np = Data.generatePlayer(rng, { centre: centre - 8, age: Data.ri(rng, 16, 18), nation: nat, level: lvl });
          np.pot = Math.min(99, np.skill + Data.ri(rng, 12, 34)); np.contract = 3; Data.recomputeValue(np, rng); np.wage = Data.wageFor(np, lvl);
          np.club = c.name; c.players.push(np); youth.push(np);
        }
      }
      while (c.players.length < (c.isUser ? 16 : 20)) {               // promote youth to refill the squad
        const np = Data.generatePlayer(rng, { centre: centre - 3, age: Data.ri(rng, 17, 21), nation: nat, level: lvl });
        np.club = c.name; np.contract = 2; c.players.push(np);
        if (c.isUser) youth.push(np);
      }
    });
    refreshMarket(s);
    startSeasonCups(s);
    s.offers.forEach(o => { o.done = true; });
    s.seasonRecord = { P: 0, W: 0, D: 0, L: 0 }; s.posHistory = [];
    s.finance.last = s.finance.season; s.finance.season = blankFinance().season;
    setObjective(s);
    if (!s.sacked) {
      mail(s, { cat: 'board', from: 'The Chairman', important: true, subject: 'Season review & new objective',
        body: (verdict || '') + '\n\nFinal position: ' + ordinal(userPos) + ' in the ' + s.divisions[oldUserDiv].name + '. League prize money: ' + fmtMoney(prize) +
          '.\n\nFor ' + seasonLabel(s) + ' the board expects: ' + s.board.objective.label + '.',
        actions: [{ label: 'Season review', cmd: 'go', args: { route: 'review' } }] });
    }
    if (expired.length) mail(s, { cat: 'transfer', from: 'Chief Executive', subject: expired.length + ' player(s) left on free transfers',
      body: expired.map(p => '• ' + fullName(p)).join('\n') });
    if (youth.length) mail(s, { cat: 'scout', from: 'Youth Coach', subject: 'Youth intake: ' + youth.length + ' new prospects',
      body: youth.map(p => '• ' + fullName(p) + ' (' + p.pos + ', ' + p.age + ') — skill ' + p.skill + ', potential ' + p.pot).join('\n'),
      actions: [{ label: 'View squad', cmd: 'go', args: { route: 'squad' } }] });
    if (!s.sacked) maybeJobOffer(s, rng);
    news(s, 'The ' + seasonLabel(s) + ' season begins.', 'world');
    s.selection = defaultSelection(s);
  }
  function ordinal(n) {
    const sfx = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (sfx[(v - 20) % 10] || sfx[v] || sfx[0]);
  }

  /* ===================================================================== *
   * LOOKUPS & PLAYER VIEWS
   * ===================================================================== */
  function clubIndexMap(s) {
    if (s._idx && s._idx.n === s.clubs.length) return s._idx.map;
    const map = {}; s.clubs.forEach((c, i) => { map[c.name] = i; });
    Object.defineProperty(s, '_idx', { value: { n: s.clubs.length, map: map }, enumerable: false, writable: true, configurable: true });
    return map;
  }
  function clubIndexByName(s, name) { const m = clubIndexMap(s); return m[name] != null ? m[name] : -1; }
  function findPlayer(s, id) {
    for (let ci = 0; ci < s.clubs.length; ci++) { const p = s.clubs[ci].players.find(x => x.id === id); if (p) return { p: p, clubIndex: ci, club: s.clubs[ci] }; }
    const fp = s.transferPool.find(x => x.id === id); if (fp) return { p: fp, clubIndex: -1, club: null };
    return null;
  }
  // FM-style 1..20 attributes derived from skill, position and a per-player fingerprint (not stored)
  const ATTRS = {
    G: ['Handling', 'Reflexes', 'Aerial Reach', 'One on Ones', 'Kicking', 'Command of Area', 'Positioning', 'Agility', 'Composure', 'Concentration'],
    F: ['Finishing', 'Passing', 'Dribbling', 'Tackling', 'Heading', 'Pace', 'Stamina', 'Vision', 'Positioning', 'Composure', 'Work Rate', 'Strength']
  };
  const BIAS = {
    D: { Finishing: -4, Dribbling: -2, Tackling: 3, Heading: 2.5, Positioning: 2.5, Strength: 1.5, Vision: -1.5 },
    M: { Passing: 3, Vision: 3, 'Work Rate': 2, Stamina: 1.5, Heading: -1.5, Tackling: 0.5 },
    A: { Finishing: 4, Dribbling: 2, Pace: 2, Composure: 1.5, Tackling: -4, Positioning: -1, 'Work Rate': -1 },
    G: {}
  };
  function attributes(p) {
    const list = p.pos === 'G' ? ATTRS.G : ATTRS.F, base = 1 + (p.skill - 20) / 79 * 19, out = [];
    list.forEach(a => {
      const h = Data.hashStr(p.id + ':' + a), noise = ((h % 1000) / 1000 - 0.5) * 5;
      let v = base + ((BIAS[p.pos] || {})[a] || 0) + noise;
      if ((a === 'Pace' || a === 'Agility') && p.age >= 30) v -= (p.age - 29) * 0.7;
      if (a === 'Composure' || a === 'Concentration') v += (p.age - 25) * 0.15;
      out.push({ name: a, value: clamp(Math.round(v), 1, 20) });
    });
    return out;
  }
  function playerView(s, id) {
    const f = findPlayer(s, id);
    if (!f) {
      const ex = s.exPlayers.slice().reverse().find(x => x.id === id);
      return ex ? { ex: ex } : null;
    }
    const p = f.p;
    return {
      p: p, clubIndex: f.clubIndex, club: f.club ? f.club.name : (p.club || FREE_AGENT), mine: f.clubIndex === s.userClub,
      attrs: attributes(p), avgRating: p.rN ? Math.round(p.rSum / p.rN * 100) / 100 : null,
      askingPrice: f.clubIndex === s.userClub ? null : (f.clubIndex < 0 || p.transferListed ? p.value : roundFee(p.value * UNLISTED_PREMIUM)),
      shortlisted: s.shortlist.indexOf(id) >= 0, renewal: f.clubIndex === s.userClub ? renewalTerms(s, p) : null,
      offers: s.offers.filter(o => o.playerId === id && !o.done)
    };
  }
  function nationsView(s) {
    return Data.NATION_ORDER.map(nat => ({
      code: nat, name: Data.NATION_RULES[nat].name,
      divisions: s.divisions.map((dv, d) => d).filter(d => s.divisions[d].nation === nat),
      cups: Object.keys(s.cups).filter(id => s.cups[id].nation === nat)
    })).concat([{ code: 'EUR', name: 'Europe', divisions: [], cups: Object.keys(s.cups).filter(id => s.cups[id].nation === 'EUR') }]);
  }

  /* ---- save / load (compact player encoding) ------------------------- */
  const PF = ['id', 'forename', 'surname', 'nat', 'pos', 'skill', 'pot', 'age', 'fit', 'retireAge', 'injuredFor', 'yellows', 'suspendedFor',
    'appsSeason', 'goalsSeason', 'lgGoals', 'assistsSeason', 'lgAssists', 'rSum', 'rN', 'form', 'potm', 'appsTotal', 'goalsTotal', 'assistsTotal',
    'transferListed', 'contract', 'value', 'wage', 'club'];
  function packPlayer(p) { return PF.map(f => (p[f] === undefined ? null : p[f])); }
  function unpackPlayer(a) {
    if (!Array.isArray(a)) return a;
    const p = {}; PF.forEach((f, i) => { p[f] = a[i]; });
    p.injured = p.injuredFor > 0; if (!p.form) p.form = [];
    ['lgGoals', 'assistsSeason', 'lgAssists', 'rSum', 'rN', 'potm', 'assistsTotal', 'yellows', 'suspendedFor'].forEach(k => { if (p[k] == null) p[k] = 0; });

  /* ===================== line chart (single series) ================== */
  // points: [{x, y, label}] ; opts: {invert, yMin, yMax, fmt, height, color, xLabel}
  let chartSeq = 0;
  UI.lineChart = function (points, opts) {
    opts = opts || {};
    const id = 'ch' + (++chartSeq);
    if (!points.length) return '<div class="empty small">No data yet — play some matches.</div>';
    const Wd = opts.width || 600, Ht = opts.height || 180, pl = opts.width && opts.width < 420 ? 30 : 46, pr = 12, pt = 12, pb = 24;
    const xs = points.map(p => p.x), ys = points.map(p => p.y);
    const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    let y0 = opts.yMin != null ? opts.yMin : Math.min.apply(null, ys), y1 = opts.yMax != null ? opts.yMax : Math.max.apply(null, ys);

    const sy = y => { const t = (y - y0) / (y1 - y0); return opts.invert ? pt + t * (Ht - pt - pb) : Ht - pb - t * (Ht - pt - pb); };
    const col = opts.color || 'var(--accent)';
    let g = '';

    const d = points.map((p, i) => (i ? 'L' : 'M') + sx(p.x).toFixed(1) + ' ' + sy(p.y).toFixed(1)).join(' ');

    const svg = '<svg viewBox="0 0 ' + Wd + ' ' + Ht + '" role="img" aria-label="' + esc(opts.title || 'chart') + '">' + g +
      '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + sx(lastP.x) + '" cy="' + sy(lastP.y) + '" r="4" fill="' + col + '" stroke="#162033" stroke-width="2"/>' +
      '<text x="' + pl + '" y="' + (Ht - 6) + '" fill="#5d6b88" font-size="11">' + esc(opts.xLabel || '') + '</text>' +
      '<line class="xh" x1="0" x2="0" y1="' + pt + '" y2="' + (Ht - pb) + '" stroke="#8391ad" stroke-dasharray="3 3" opacity="0"/>' +
      '<circle class="xd" r="5" fill="' + col + '" stroke="#fff" stroke-width="2" opacity="0"/>' +

    return '<div class="chart" data-chart="' + id + '">' + svg + '<div class="tip"></div></div>';
  };
  function chartHover(e) {

    const x = (e.clientX - r.left) / r.width * meta.Wd;
    let best = meta.pts[0];
    meta.pts.forEach(p => { if (Math.abs(p.x - x) < Math.abs(best.x - x)) best = p; });
    const xh = svg.querySelector('.xh'), xd = svg.querySelector('.xd'), tip = el.querySelector('.tip');

  UI.applyClubTheme = function () {
    const S = UI.S; if (!S) return;

    const hex = k[0].replace('#', ''), v = parseInt(hex.length === 3 ? hex.split('').map(c => c + c).join('') : hex, 16);
    const lum = ((v >> 16) * 0.299 + ((v >> 8) & 255) * 0.587 + (v & 255) * 0.114);
    // very dark / very light club colours make poor accents on a dark UI: fall back to the secondary colour or the default blue
    let c1 = k[0], c2 = k[1];
    if (lum < 80) { c1 = k[1]; c2 = k[0]; }
    if (lum > 235 && c1 === k[0]) { c1 = k[1]; c2 = k[0]; }
    document.documentElement.style.setProperty('--club', c1);
    document.documentElement.style.setProperty('--club2', c2);
  };

  /* ===================== router ===================================== */
  UI.page = (name, def) => { UI.pages[name] = def; };
  UI.go = function (route, replace) {
    const h = '#/' + route;
    if (location.hash === h) UI.render();
    else if (replace) { history.replaceState(null, '', h); UI.render(); }
    else location.hash = h;
  };
  UI.parse = function () {
    const raw = (location.hash || '').replace(/^#\/?/, '');
    const parts = raw.split('/').filter(Boolean).map(decodeURIComponent);
    return { name: parts[0] || (UI.S ? 'home' : 'title'), args: parts.slice(1) };
  };
  UI.render = function () {
    const r = UI.parse();
    if (!UI.S && ['title', 'new', 'load', 'help'].indexOf(r.name) < 0) { r.name = 'title'; r.args = []; }
    if (UI.route === 'match' && r.name !== 'match' && UI.onLeaveMatch) UI.onLeaveMatch();
    UI.route = r.name; UI.args = r.args;
    const pg = UI.pages[r.name] || UI.pages.home;
    document.body.classList.toggle('title-mode', !!pg.bare || !UI.S);
    document.body.classList.remove('nav-open');
    const view = $('#view');
    try {
      view.innerHTML = pg.render(r.args) || '';
    } catch (e) {
      console.error(e);
      view.innerHTML = '<div class="empty">Something went wrong rendering this page: ' + esc(e.message) + '</div>';
    }
    if (pg.after) { try { pg.after(view, r.args); } catch (e) { console.error(e); } }
    if (!UI.keepScroll) view.scrollTop = 0;
    UI.keepScroll = false;
    UI.renderShell();
  };
  UI.refresh = function () { UI.keepScroll = true; const st = $('#view').scrollTop; UI.render(); $('#view').scrollTop = st; };

  /* ===================== shell ====================================== */
  const NAV = [
    ['Overview', [['home', 'Home', 'home'], ['inbox', 'Inbox', 'inbox']]],
    ['Your team', [['squad', 'Squad', 'squad'], ['tactics', 'Tactics', 'tactics'], ['fixtures', 'Fixtures & Results', 'fixtures']]],
    ['Football world', [['competitions', 'Competitions', 'comps'], ['transfers', 'Transfers', 'transfers'], ['stats', 'Statistics', 'stats']]],
    ['Club', [['finances', 'Finances', 'finance'], ['board', 'Board & Objectives', 'board']]],
    ['Manager', [['career', 'My Career', 'career'], ['honours', 'Hall of Fame', 'honours'], ['jobs', 'Job Centre', 'jobs']]],
    ['Game', [['saves', 'Save / Load', 'save'], ['help', 'How to play', 'help']]]
  ];
  const NAV_GROUP = { player: 'squad', club: 'competitions', league: 'competitions', cup: 'competitions', match: 'home', roundup: 'home', review: 'career', inbox: 'inbox' };
  UI.renderShell = function () {
    const S = UI.S;
    if (!S) return;
    const active = NAV_GROUP[UI.route] || UI.route;
    const unread = E.unreadCount(S);
    $('#sidebar').innerHTML = NAV.map(g => '<div class="nav-sec">' + g[0] + '</div>' + g[1].map(it =>
      '<a class="nav-item' + (active === it[0] ? ' active' : '') + '" data-go="' + it[0] + '">' + UI.icon(it[2]) + '<span>' + it[1] + '</span>' +
      (it[0] === 'inbox' && unread ? '<span class="badge red">' + unread + '</span>' : '') +
      (it[0] === 'jobs' && S.sacked ? '<span class="badge amber">!</span>' : '') + '</a>').join('')).join('');
    const c = E.user(S), dv = E.userDiv(S);
    const pos = E.leaguePosition(S, c.name);
    $('#tb-club').innerHTML = crest(c) + '<div style="min-width:0"><div class="tb-name me">' + esc(c.name) + '</div><div class="tb-sub">' +
      UI.flag(dv.nation) + ' ' + esc(dv.name) + ' · ' + ordinal(pos) + '</div></div>';
    $('#tb-club').setAttribute('data-go', 'club/' + S.userClub);
    $('#tb-date').innerHTML = '<b>' + esc(E.formatDate(E.currentDate(S))) + '</b><span>Season ' + E.seasonLabel(S) + '</span>';
    const bal = c.balance;
    $('#tb-money').textContent = moneyShort(bal);
    $('#tb-money').classList.toggle('neg', bal < 0);
    $('#tb-money').title = 'Bank balance: ' + money(bal) + (S.debt ? ' · loan ' + money(S.debt) : '');
    $('#tb-inbox').innerHTML = UI.icon('inbox') + (unread ? '<span class="count">' + unread + '</span>' : '');
    const btn = $('#btn-continue');
    const lbl = UI.continueLabel();
    btn.innerHTML = esc(lbl.text) + '<kbd>Space</kbd>';
    btn.classList.toggle('match', !!lbl.match);
    btn.disabled = !!lbl.disabled;
  };
  // what "Continue" does from here
  UI.continueLabel = function () {
    const S = UI.S;
    if (UI.route === 'match' && UI.matchCtl) return UI.matchCtl.label();
    if (S.sacked) return { text: 'Find a job', match: false };
    if (S.pendingReview && UI.route !== 'review') return { text: 'Season review', match: false };
    if (UI.route === 'roundup') return { text: 'Continue', match: false };
    return { text: 'Continue', match: E.nextOpponent(S) != null && isUserDayNow() };
  };
  function isUserDayNow() {
    const S = UI.S, opp = E.nextOpponent(S);
    return !!opp;
  }
  UI.advance = function () {
    const S = UI.S;
    if (!S) return;
    if (UI.route === 'match' && UI.matchCtl) return UI.matchCtl.primary();
    if (S.sacked) { UI.go('jobs'); return; }
    if (S.pendingReview && UI.route !== 'review') { UI.go('review'); return; }
    if (UI.route === 'review') { S.pendingReview = null; UI.save(); }
    if (UI.route === 'roundup') { UI.go('home'); return; }
    const season = S.season;
    E.prepareNextUserMatch(S);
    UI.flushNotices();
    UI.save();
    if (S.pendingReview && S.season !== season) { UI.go('review'); return; }
    if (E.nextOpponent(S)) UI.go('match');
    else UI.go('home');
  };

  /* ===================== events ===================================== */
  function onClick(e) {
    const t = e.target;
    const sort = t.closest('[data-sort]');
    if (sort) {
      const [id, key] = sort.dataset.sort.split('|');
      const st = UI.tables[id] || (UI.tables[id] = { key: null, dir: -1 });
      if (st.key === key) st.dir = -st.dir; else { st.key = key; st.dir = -1; }
      UI.refresh(); return;
    }
    const act = t.closest('[data-act]');
    if (act && UI.acts[act.dataset.act]) { e.preventDefault(); UI.acts[act.dataset.act](act, e); return; }
    const go = t.closest('[data-go]');
    if (go) { e.preventDefault(); UI.go(go.dataset.go); return; }
  }
  function onKey(e) {
    const tag = (e.target && e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
    if (e.code === 'Space' || e.key === ' ') {
      if (tag === 'button') return;                         // a focused button handles space itself
      e.preventDefault();
      if (UI._modalPrimary) { UI._modalPrimary.click(); return; }
      if (!UI.S) { const b = $('[data-primary]'); if (b) b.click(); return; }
      UI.advance();
    } else if (e.key === 'Escape') {
      const bd = $('#modal-root .backdrop'); if (bd) bd.remove();
      UI._modalPrimary = null;
    }
  }

  /* ===================== boot ======================================= */
  UI.startCareer = function (seed, clubIndex, opts) {
    const S = E.newGame(seed, clubIndex, opts);
    UI.setState(S);
    UI.save(true);
    return S;
  };
  function boot() {
    $('#nav-toggle').innerHTML = UI.icon('menu');
    $('#nav-toggle').onclick = () => document.body.classList.toggle('nav-open');
    $('#scrim').onclick = () => document.body.classList.remove('nav-open');
    $('#btn-continue').onclick = () => UI.advance();
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);
    document.addEventListener('mousemove', e => { if (e.target.closest && e.target.closest('.chart')) chartHover(e); });
    document.addEventListener('mouseout', e => { if (e.target.closest && e.target.closest('.chart') && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.chart'))) chartLeave(e); });
    window.addEventListener('hashchange', UI.render);
    const q = new URLSearchParams(location.search);
    const seed = q.has('seed') ? (parseInt(q.get('seed'), 10) >>> 0) : ((Math.random() * 1e9) >>> 0);
    if (q.has('club')) {                                   // automation / power-user shortcut: straight into a career
      UI.startCareer(seed, parseInt(q.get('club'), 10) || 0, { difficulty: q.get('diff') || 'normal', managerName: q.get('name') || 'The Gaffer' });
      UI.go(q.get('route') || 'home', true);
      return;
    }
    if (q.has('fresh')) { UI.newSeed = seed; UI.go('new', true); return; }
    UI.newSeed = seed;
    const title = () => Store.meta('auto').then(m => { UI.autoMeta = m; UI.render(); }).catch(() => UI.render());
    // A hosting page may swap this page for a newer build while it is open. It
    // asks for a snapshot first and hands it back to the new build, so the
    // career resumes on the same screen (from the autosave) instead of the title.
    const hot = window.claude && window.claude.hot;
    let started = false;
    const start = data => {
      if (started) return;
      started = true;
      const route = data && typeof data.route === 'string' ? data.route : '';
      if (!route) return title();
      UI.loadFrom('auto').then(() => UI.go(route, true)).catch(title);
    };
    try {
      if (hot && typeof hot.snapshot === 'function') {
        hot.snapshot(() => {
          const r = (location.hash || '').replace(/^#\/?/, '');
          return { route: !UI.S || !r || /^(match|new|title|load)(\/|$)/.test(r) ? (UI.S ? 'home' : '') : r };
        });
      }
      if (hot && typeof hot.ready === 'function') {
        hot.ready(start);
        setTimeout(() => start(hot.data || {}), 1500);               // in case the host never calls back
        return;
      }
    } catch (e) { /* the hook is optional */ }
    start((hot && hot.data) || {});
  }

  /* ---- automation hook (screenshots & play-tests) ------------------- */
  window.SIMSOC_TEST = {
    advance(n) {
      const S = UI.S;
      for (let i = 0; i < n; i++) {
        if (S.sacked) { E.chooseClub(S, E.eligibleClubs(S, S.reputation)[0]); continue; }
        E.prepareNextUserMatch(S);
        const m = E.playUserMatch(S);
        if (!m) break;
        E.commitUserResult(S, m);
      }
      S.notices.length = 0;
      UI.save(); UI.render();
    },
    state() { return UI.S; },
    go(r) { UI.go(r); },
    save() { return UI.save(true); }
  };

  document.addEventListener('DOMContentLoaded', () => setTimeout(boot, 0));
})();

</script>
<script>
/*
 * SIMSOC 6 (remake) - pages

 */
;(function () {

      (opts.more ? '<a class="more" data-go="' + opts.more[1] + '">' + opts.more[0] + ' →</a>' : '') + (opts.right || '') + '</div>' : '') + body + '</section>';
  };
  const tabs = (items, active, base) => '<div class="tabs">' + items.map(t => '<a class="tab' + (t[0] === active ? ' active' : '') + '" data-go="' + base + t[0] + '">' + t[1] + '</a>').join('') + '</div>';
  const seg = (act, opts, cur, extra) => '<div class="seg">' + opts.map(o => '<button class="' + (String(o[0]) === String(cur) ? 'on' : '') + '" data-act="' + act + '" data-v="' + o[0] + '"' + (extra || '') + (o[2] ? ' title="' + esc(o[2]) + '"' : '') + '>' + o[1] + '</button>').join('') + '</div>';
  const kpi = (k, v, s) => '<div class="kpi"><div class="k">' + k + '</div><div class="v">' + v + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div>';

  const confColor = v => (v < 25 ? 'var(--bad)' : v < 50 ? 'var(--warn)' : 'var(--good)');

    const f = E.clubFixtures(s, s.userClub).find(x => !x.played && x.day >= s.day);

          '<div class="bold me" style="font-size:18px">' + esc(m.club) + '</div><div class="muted small">' + esc(m.manager || '') + ' · ' + esc(m.division) + ' · ' + esc(m.season) +

        '<div class="actions"><button class="btn primary lg" data-go="new"' + (m ? '' : ' data-primary="1"') + '>' + UI.icon('plus') + ' New career</button>' +
        '<button class="btn lg" data-go="load">' + UI.icon('save') + ' Load game</button><button class="btn ghost lg" data-go="help">How to play</button></div>' +
        '<div class="kpis" style="max-width:860px;margin:34px auto 0">' + kpi('Nations', '8', 'England to Scotland') + kpi('Leagues', '12', 'with promotion & relegation') +
        kpi('Clubs', '300+', 'plus 75 European guests') + kpi('Cups', '13', 'FA Cup to Champions League') + '</div></div>';

  UI.page('new', {

        card('Difficulty', seg('newDiff', [['easy', 'Easy', 'More money, a patient board, a stronger team'], ['normal', 'Normal'], ['hard', 'Hard', 'Tight budgets and an impatient board']], n.diff) +
          '<div class="small muted" style="margin-top:8px">' + ({ easy: 'Bigger budget, the board never sacks you and your team plays above itself.', normal: 'The intended balance — your team gets a slight edge from good management.', hard: 'Less money, a demanding board and no favours.' })[n.diff] + '</div>') +
        '</div>' +
        card('Nation', '<div class="nation-grid">' + nats.map(c => '<div class="nation-card' + (c === n.nation ? ' on' : '') + '" data-act="newNation" data-v="' + c + '">' + UI.flag(c) +
          '<div><div class="bold">' + esc(D.NATION_RULES[c].name) + '</div><div class="small muted">' + P.divisions.filter(d => d.nation === c).map(d => d.name).join(', ') + '</div></div></div>').join('') + '</div>') +
        '<div style="height:16px"></div>' +
        card('Club', (divs.length > 1 ? '<div style="margin-bottom:12px">' + seg('newDiv', divs.map(i => [i, P.divisions[i].name]), n.division) + '</div>' : '') +
          '<div class="small muted" style="margin-bottom:10px">' + (n.nation === 'ENG' && n.division === 3 ? 'The classic SIMSOC challenge: start in the Conference and climb the pyramid.' : 'Stars show the job\'s prestige — bigger clubs expect more.') + '</div>' +
          '<div class="club-cards">' + clubs + '</div>') +
        '<div class="row" style="margin:18px 0 40px"><button class="btn ghost" data-go="title">← Back</button><div class="spacer"></div>' +
        (chosen ? '<span class="muted">You will manage <b class="me">' + esc(chosen.name) + '</b></span>' : '<span class="muted">Choose a club to continue</span>') +

  UI.acts.newDiff = el => { UI.newCfg.diff = el.dataset.v; UI.refresh(); };

  UI.page('home', {

      const last = lr ? '<div class="res" style="font-size:15px"><div class="h">' + UI.clubByName(lr.homeName) + '</div><div class="sc">' + lr.hg + ' - ' + lr.ag + '</div><div class="a">' + UI.clubByName(lr.awayName) + '</div>' +
        (lr.agg || lr.winnerName ? '<div class="note">' + (lr.agg ? 'agg ' + esc(lr.agg) + ' · ' : '') + (lr.winnerName ? UI.meName(lr.winnerName) + ' through' + (lr.pens ? ' on penalties' : '') : '') + '</div>' : '') + '</div>' +
        '<div class="small muted" style="margin-top:8px">' + esc(lr.comp) + (lr.scorers.length ? ' · ' + lr.scorers.map(x => esc(x.name.split(' ').slice(-1)[0]) + ' ' + x.minute + "'").join(', ') : '') + '</div>' : '<div class="muted">No matches played yet this season.</div>';
      // mini table around the user

    const p = cur.id != null ? E.user(s).players.find(x => x.id === cur.id) : null;
    if (k !== 'slot' && p && !E.isFit(p)) { UI.toast(p.surname + ' is unavailable.', 'bad'); return; }
    const prev = UI.tacSel;

    if (prev.kind === cur.kind && (prev.kind === 'slot' ? prev.slot === cur.slot : prev.id === cur.id)) { UI.tacSel = null; UI.refresh(); return; }

  function swap(sel, a, b) {
    while (sel.xi.length < 11) sel.xi.push(null);
    const get = x => (x.kind === 'slot' ? sel.xi[x.slot] : x.id);
    const put = (x, id) => {
      if (x.kind === 'slot') sel.xi[x.slot] = id;
      else if (x.kind === 'bench') { const i = sel.subs.indexOf(x.id); if (id == null) sel.subs.splice(i, 1); else sel.subs[i] = id; }
      // reserves have no position: whoever is displaced simply drops to the reserves
    };
    const ia = get(a), ib = get(b);
    if (a.kind === 'res' && b.kind === 'res') return;
    if (a.kind === 'res' || b.kind === 'res') {
      const res = a.kind === 'res' ? a : b, other = a.kind === 'res' ? b : a;
      if (other.kind === 'bench' && other.id == null) return;
      put(other, res.id);
      return;

  function miniTables(groups) {
    const s = S(), ds = [];
    groups.forEach(g => { if (g.division != null && ds.indexOf(g.division) < 0) ds.push(g.division); });
    if (ds.indexOf(s.userDivision) < 0) ds.unshift(s.userDivision);
    return ds.slice(0, 3).map(d => {
      const st = E.standings(s, d), z = E.tableZones(s, d);
      return '<h4 style="margin:4px 0 8px;font-size:13px">' + UI.flag(s.divisions[d].nation) + ' ' + esc(s.divisions[d].name) + '</h4><table class="tbl compact"><tbody>' +
        st.map((r, i) => '<tr class="' + (r.idx === s.userClub ? 'mine' : '') + '"><td class="zone ' + (z[i + 1] || '') + '"></td><td class="num">' + (i + 1) + '</td><td>' + UI.clubLink(r.idx, { short: true }) + '</td><td class="num">' + r.P + '</td><td class="num bold">' + r.Pts + '</td></tr>').join('') +
        '</tbody></table><div style="height:14px"></div>';
    }).join('');
  }

      '<div class="stack">' + rows + '</div>' + (UI.S ? '<div class="row" style="margin-top:18px"><button class="btn" data-act="newCareer">' + UI.icon('plus') + ' Start a new career</button></div>' : '') + '</div>';

  function loadMetas() {
    Store.list(SLOTS.map(x => x[0])).then(list => {
      const m = {}; list.forEach(x => { m[x.slot] = x.meta; });
      const changed = JSON.stringify(m) !== JSON.stringify(UI._slotMeta || null);
      UI._slotMeta = m;
      if (changed && (UI.route === 'saves' || UI.route === 'load')) UI.refresh();

  }
  UI.page('saves', { render: savesPage, after: loadMetas });
  UI.page('load', { bare: true, render: savesPage, after: loadMetas });
  UI.acts.slotLoad = el => UI.loadFrom(el.dataset.v).then(() => { UI.toast('Game loaded.', 'good'); UI.go('home'); }).catch(e => UI.toast(e.message, 'bad'));
  UI.acts.slotSave = el => UI.saveTo(el.dataset.v).then(() => { UI.toast('Saved to ' + el.dataset.v + '.', 'good'); loadMetas(); });
  UI.acts.slotDel = el => UI.confirm('Delete this save?', 'This cannot be undone.', 'Delete', true).then(ok => { if (ok) Store.remove(el.dataset.v).then(loadMetas); });
  UI.acts.newCareer = () => UI.confirm('Start a new career?', 'Your current game stays in the autosave until the new one overwrites it. Save it to a slot first if you want to keep it.', 'New career').then(ok => {
    if (ok) { UI.S = null; UI.preview = null; UI.newCfg = null; UI.newSeed = (Math.random() * 1e9) >>> 0; UI.go('new'); }
  });

  UI.page('help', {
    bare: false,
    render() {
      const li = (a, b) => '<div class="row" style="align-items:flex-start;padding:7px 0;border-bottom:1px solid rgba(38,53,83,.5)"><b style="width:190px;flex:none">' + a + '</b><span class="muted">' + b + '</span></div>';
      return '<div class="wizard">' + head('How to play', 'A quick guide to managing in SIMSOC 6', UI.S ? '' : '<button class="btn ghost" data-go="title">← Back</button>') +
        '<div class="grid cols-2">' + card('The basics',
          li('Continue / Space', 'Moves the game on to your next match. Every other result in Europe is played in the background.') +
          li('Match day', 'Read the opposition report and the assistant\'s advice, then kick off live or take a quick result.') +
          li('During the match', 'Change mentality, make substitutions and give the half-time team talk. Space skips to full time.') +
          li('Round-up', 'After each game you see every result from every competition, then the tables.')) +
        card('Winning matches',
          li('Mentality', 'Underdogs should sit deep (fewer chances for both sides); favourites should attack. The assistant tests every option for you before each game.') +
          li('Fitness & rotation', 'Starting drains fitness. "Pick Fresh XI" rests tired legs; tired players are weaker and get injured.') +
          li('Positions', 'Players out of position (amber ring on the tactics board) perform worse.') +
          li('Team talk', 'Praise when winning, demand more when a stronger team is behind, encourage when level.')) +
        card('Running the club',
          li('Transfers', 'Buy from the open market or prise unlisted players away for a premium. Selling is instant. Max 23 players.') +
          li('Wages & contracts', 'Wages are paid weekly. Renew contracts before the summer or players leave for free.') +
          li('Loans', 'Borrow when you need to, but interest grows weekly and a long overdraft forces a sale.') +
          li('The board', 'Meet the season objective. Fall too far short and you will be sacked (not on Easy).')) +
        card('Your career',
          li('Reputation', 'Results raise your reputation. Bigger clubs then offer you their job — or resign and pick one at the Job Centre.') +
          li('The world', 'Eight nations, twelve leagues with promotion and relegation, domestic cups and the two-legged European cups.') +
          li('Rules', 'Fewer than 8 fit players means a 0-3 walkover. Five bookings or a red card bring a ban. No byes in any draw.') +
          li('Saving', 'The game autosaves after every match; use the Save / Load slots for extra careers.')) + '</div></div>';
    }
  });
})();

</script>
<script>
/*
 * SIMSOC 6 (remake) - match day
 * Preview (opposition report + the assistant's Monte Carlo advice), the live
 * match (2D pitch, commentary, stats, live ratings, other scores, mentality,
 * substitutions, half-time team talk) and the full-time summary.
 */
;(function () {
  'use strict';
  const UI = window.SimUI, E = window.SimSocEngine, D = window.SimSocData, Live = window.SimSocLive, Pitch = window.SimSocPitch;
  const esc = UI.esc, ms = UI.moneyShort, $ = UI.$;
  const S = () => UI.S;
  const SPEEDS = [[1, '1×', 720], [2, '2×', 360], [4, '4×', 150], [8, '8×', 55]];
  let mt = null;                                         // the match in progress
  let speed = 2;
  try { speed = +localStorage.getItem('simsoc6.speed') || 2; } catch (e) { /* ignore */ }

  function dayKey() { const s = S(); return s.season + '|' + s.day + '|' + s.userClub; }
  function resetIfStale() {
    if (mt && mt.key !== dayKey() && mt.phase !== 'fulltime') stopLoop(), mt = null;
    if (mt && mt.phase === 'fulltime' && mt.key !== mt.doneKey) { /* a finished match: keep until Continue */ }
  }
  const card = (title, body, cls) => '<section class="card ' + (cls || '') + '">' + (title ? '<div class="card-head"><h3>' + title + '</h3></div>' : '') + body + '</section>';

  /* ---- controller used by the top bar / spacebar --------------------- */
  UI.matchCtl = {
    label() {
      if (!mt || mt.phase === 'preview') return E.nextOpponent(S()) ? { text: 'Kick off', match: true } : { text: 'Continue', match: false };
      if (mt.phase === 'live') return mt.live.halfTime ? { text: 'Team talk', match: true } : { text: 'Skip to full time', match: true };
      return { text: 'Continue', match: false };
    },
    primary() {
      if (!mt || mt.phase === 'preview') { if (E.nextOpponent(S())) kickOff(false); else UI.go('home'); return; }
      if (mt.phase === 'live') { if (mt.live.halfTime) openTalk(); else skipToEnd(); return; }
      finishAndLeave();
    }
  };
  UI.onLeaveMatch = function () {
    if (!mt) return;
    if (mt.phase === 'live') {                            // leaving mid-match: the assistant sees it out
      stopLoop();
      if (mt.live.halfTime) mt.live.teamTalk('encourage');
      mt.live.runToEnd();
      commit();
      const r = mt.live.score;
      UI.toast('Full time: ' + mt.cfg.home.name + ' ' + r.hg + '-' + r.ag + ' ' + mt.cfg.away.name + ' (finished by your assistant).');
    }
    if (mt.renderer) { mt.renderer.destroy(); mt.renderer = null; }
    if (mt.phase === 'fulltime') mt = null;
    else if (mt.phase === 'preview') mt = null;
  };

  /* ================================================================ *
   * PAGE
   * ================================================================ */
  UI.page('match', {
    render() {
      const s = S();
      resetIfStale();
      if (mt && (mt.phase === 'live' || mt.phase === 'fulltime')) return mt.phase === 'live' ? liveSkeleton() : fullTimeView();
      const opp = E.nextOpponent(s);
      if (!opp) return '<div class="page-head"><div class="grow"><h1>Match day</h1><div class="sub">No match today.</div></div></div><div class="empty">Press Continue to move on to your next fixture.</div>';
      mt = { phase: 'preview', key: dayKey() };
      return previewView(opp);
    },
    after() {
      if (mt && mt.phase === 'live') mountLive();
    }
  });

  /* ---- preview ------------------------------------------------------- */
  let pvCache = null;
  function previewData() {
    const s = S(), t = s.tactics;
    const k = dayKey() + '|' + s.selection.xi.join(',') + '|' + s.selection.formation + '|' + t.pressing + '|' + t.tempo;
    if (!pvCache || pvCache.k !== k) pvCache = { k: k, v: E.matchPreview(s, 70) };
    return pvCache.v;
  }
  function previewView(opp) {
    const s = S(), uc = E.user(s), ui = s.userClub, oi = opp.clubIndex;
    const homeIdx = opp.home ? ui : oi, awayIdx = opp.home ? oi : ui;
    const fit = E.availablePlayers(uc).length;
    const head = '<div class="scorebar"><div class="team">' + UI.crest(s.clubs[homeIdx], 'lg') + UI.clubLink(homeIdx, { crest: false }) + '</div>' +
      '<div><span class="comp">' + esc(opp.compName) + '</span><div class="score" style="font-size:22px">v</div><span class="comp">' + esc(E.formatDate(opp.date)) + (opp.neutral ? ' · neutral venue' : '') + '</span></div>' +
      '<div class="team away">' + UI.clubLink(awayIdx, { crest: false }) + UI.crest(s.clubs[awayIdx], 'lg') + '</div></div>';
    if (fit < 8) {
      return head + card('Walkover', '<p>You only have <b class="bad">' + fit + '</b> fit players — fewer than the 8 needed to start a match. The game will be awarded 3-0 to ' + UI.clubLink(oi) + '.</p>' +
        '<p class="muted small">Sign players in the transfer market or wait for injuries and bans to clear.</p><div class="row"><button class="btn danger" data-act="mtForfeit">Concede the match (0-3)</button>' +
        '<button class="btn" data-go="transfers">Transfer market</button></div>');
    }
    const pv = previewData();
    const xi = E.playersByIds(uc, s.selection.xi.filter(x => x != null));
    const valid = xi.filter(E.isFit).length;
    const ratingRow = (lab, a, b) => '<span class="muted">' + lab + '</span><div class="prob"><span style="width:' + (a / (a + b) * 100) + '%;background:var(--club)"></span><span style="width:' + (b / (a + b) * 100) + '%;background:#55607a"></span></div><span class="small">' + a + ':' + b + '</span>';
    const report = '<div class="row small" style="margin-bottom:10px"><span>' + (pv.oppPos ? UI.ordinal(pv.oppPos) + ' in ' + esc(pv.oppDivision) : esc(pv.oppDivision)) + '</span><span class="spacer"></span>' + UI.form(pv.oppForm) + '</div>' +
      '<div class="small muted">Manager ' + esc(pv.oppManager) + ' · usually ' + esc(Live.FORMATION_NAMES[pv.oppFormation] || pv.oppFormation) + '</div>' +
      '<div class="ratings-mini" style="margin:12px 0">' + ratingRow('Defence', pv.userRatings.defence, pv.oppRatings.defence) + ratingRow('Midfield', pv.userRatings.midfield, pv.oppRatings.midfield) +
      ratingRow('Attack', pv.userRatings.attack, pv.oppRatings.attack) + ratingRow('Morale', pv.userRatings.morale, pv.oppRatings.morale) + '</div>' +
      '<div class="small muted">Key players</div>' + pv.oppKey.map(p => '<div class="row small" style="padding:3px 0">' + UI.pos(p.pos) + '<a class="player-link" data-go="player/' + p.id + '">' + esc(p.name) + '</a><span class="spacer"></span><b>' + p.skill + '</b></div>').join('') +
      (pv.oppScorers.length ? '<div class="small muted" style="margin-top:8px">Top scorers</div>' + pv.oppScorers.map(p => '<div class="row small" style="padding:2px 0"><a class="player-link" data-go="player/' + p.id + '">' + esc(p.name) + '</a><span class="spacer"></span><b>' + p.goals + '</b></div>').join('') : '');
    const mrows = pv.byMentality.map(m => '<div class="row-m' + (m.mentality === pv.recommended.mentality ? ' best' : '') + (m.mentality === s.tactics.mentality ? ' cur' : '') + '" >' +
      '<button class="btn sm ' + (m.mentality === s.tactics.mentality ? 'primary' : '') + '" data-act="mtMent" data-v="' + m.mentality + '">' + esc(m.label) + '</button>' +
      '<div class="prob" title="Win ' + UI.pct(m.win) + ' · draw ' + UI.pct(m.draw) + ' · loss ' + UI.pct(m.loss) + '"><span style="width:' + m.win * 100 + '%;background:var(--good)"></span><span style="width:' + m.draw * 100 + '%;background:#6b7590"></span><span style="width:' + m.loss * 100 + '%;background:var(--bad)"></span></div>' +
      '<span class="small num">' + UI.pct(m.win) + '</span></div>').join('');
    const advice = '<div class="stack" style="gap:6px;margin-bottom:12px">' + pv.tips.map(t => '<div class="small">• ' + esc(t) + '</div>').join('') + '</div>' +
      '<div class="small" style="margin-bottom:8px">Your assistant simulated the game with every mentality: <b class="good">' + esc(pv.recommended.label) + '</b> gives the best chance (' +
      UI.pct(pv.recommended.win) + ' win, ' + UI.pct(pv.recommended.draw) + ' draw).</div><div class="mentality-table">' + mrows + '</div>' +
      '<div class="legend"><span><i style="background:var(--good)"></i>Win</span><span><i style="background:#6b7590"></i>Draw</span><span><i style="background:var(--bad)"></i>Loss</span><span>Bars: win / draw / loss chance</span></div>';
    const roles = Live.FORMATIONS[s.selection.formation] || Live.FORMATIONS['442'];
    const lineup = '<div class="lineup-list">' + s.selection.xi.map((id, i) => {
      const p = id != null ? uc.players.find(x => x.id === id) : null;
      if (!p) return '<div class="lp"><span class="pos ' + roles[i] + '">' + roles[i] + '</span><span class="bad">Empty</span><span></span><span></span></div>';
      return '<div class="lp"><span class="pos ' + roles[i] + '">' + roles[i] + '</span><span class="ellip">' + UI.playerLink(p, { flag: false }) + (Live.suit(p.pos, roles[i]) < 1 ? ' <span class="tag exp" title="Out of position">' + p.pos + '</span>' : '') + ' ' + UI.tagsFor(p) + '</span>' +
        UI.fitBar(p.fit) + '<b class="num">' + p.skill + '</b></div>';
    }).join('') + '</div><div class="small muted" style="margin-top:8px">Bench: ' + (E.playersByIds(uc, s.selection.subs).map(p => esc(p.surname)).join(', ') || 'none') + '</div>';
    const h2h = pv.h2h.length ? (() => { let w = 0, d = 0, l = 0; pv.h2h.forEach(h => { const a = h.home ? h.hg : h.ag, b = h.home ? h.ag : h.hg; if (a > b) w++; else if (a === b) d++; else l++; }); return 'Head to head: P' + pv.h2h.length + ' W' + w + ' D' + d + ' L' + l; })() : 'You have never played them.';
    const t = opp.tie, firstLeg = t && opp.leg === 1 && t.l1h != null ? '<span class="tag cup">First leg: ' + esc(s.clubs[t.home].name) + ' ' + t.l1h + '-' + t.l1a + ' ' + esc(s.clubs[t.away].name) + '</span>' : '';
    return head +
      '<div class="row" style="margin-bottom:14px">' + UI.compTag(opp.comp, opp.comp === 'league' ? 'League' : null) + firstLeg + '<span class="muted small">' + (opp.home ? 'Home' : 'Away') + ' · expected crowd ' +
      (pv.attendance || 0).toLocaleString('en-GB') + ' · ' + esc(h2h) + '</span><span class="spacer"></span>' +
      (valid < 11 ? '<span class="badge red">' + valid + '/11 fit starters</span>' : '') +
      '<button class="btn" data-act="mtQuick">' + UI.icon('bolt') + ' Quick result</button><button class="btn go lg" data-act="mtKick">' + UI.icon('play') + ' Kick off</button></div>' +
      '<div class="grid cols-3">' + card('Opposition report: ' + esc(pv.opponent), report) + card('Assistant\'s advice', advice) +
      card('Your team · ' + esc(Live.FORMATION_NAMES[s.selection.formation] || ''), lineup + '<div class="row" style="margin-top:12px"><button class="btn sm" data-go="tactics">Edit tactics</button>' +
        '<button class="btn sm" data-act="mtPick" data-v="fresh">Pick Fresh XI</button><button class="btn sm" data-act="mtPick" data-v="best">Pick Best XI</button></div>' +
        '<label class="check small" style="margin-top:10px"><input type="checkbox" data-act="mtAutoSubs"' + (s.tactics.autoSubs !== false ? ' checked' : '') + '> Assistant makes substitutions</label>') + '</div>';
  }
  UI.acts.mtMent = el => { S().tactics.mentality = +el.dataset.v; UI.save(); UI.refresh(); };
  UI.acts.mtPick = el => { const s = S(), b = E.bestXI(E.user(s), { formation: s.selection.formation, mode: el.dataset.v }); s.selection.xi = b.xi; s.selection.subs = b.subs; s.tactics.pickMode = el.dataset.v; UI.save(); UI.refresh(); };
  UI.acts.mtAutoSubs = el => { S().tactics.autoSubs = el.checked; UI.save(); };
  UI.acts.mtKick = () => kickOff(false);
  UI.acts.mtQuick = () => kickOff(true);
  UI.acts.mtForfeit = () => {
    const s = S(), m = E.playUserMatch(s);
    if (!m) return;
    E.commitUserResult(s, m);
    mt = { phase: 'fulltime', key: 'done', forfeit: m, cfg: { home: { name: m.homeName }, away: { name: m.awayName } } };
    UI.flushNotices(); UI.save(); UI.refresh();
  };

  /* ---- kick off ------------------------------------------------------- */
  function teamReady() {
    const s = S(), uc = E.user(s);
    const ids = s.selection.xi.filter(x => x != null);
    return ids.length === 11 && E.playersByIds(uc, ids).every(E.isFit) && new Set(ids).size === 11;
  }
  function kickOff(quick) {
    const s = S();
    if (!E.nextOpponent(s)) return;
    if (E.availablePlayers(E.user(s)).length < 8) { UI.acts.mtForfeit(); return; }
    if (!teamReady()) {
      UI.confirm('Your team is not complete', 'You need 11 fit starters. Let the assistant fill the gaps in your line-up?', 'Fill the gaps').then(ok => {
        if (!ok) return;
        s.selection = E.repairSelection(s, { xi: s.selection.xi.slice(), subs: s.selection.subs.slice(), formation: s.selection.formation }, E.nextOpponent(s));
        UI.save(); kickOff(quick);
      });
      return;
    }
    const lm = E.createLiveMatch(s, { autoTalk: !!quick });
    if (!lm || lm.forfeit) return;
    mt = { phase: 'live', key: dayKey(), live: lm.live, meta: lm.meta, cfg: lm.cfg, userKey: lm.meta.home ? 'home' : 'away', fed: 0, tab: 'feed', paused: false,
      ticker: E.previewOtherResults(s), tickerShown: {}, lastGoalShown: 0 };
    if (quick) { mt.live.runToEnd(); endMatch(); return; }
    UI.render();
  }

  /* ---- live view ------------------------------------------------------ */
  function liveSkeleton() {
    const s = S(), c = mt.cfg;
    const hi = E.clubIndexByName(s, c.home.name), ai = E.clubIndexByName(s, c.away.name);
    return '<div class="scorebar" style="--home:' + c.home.kit[0] + ';--away:' + c.away.kit[0] + '"><div class="team">' + UI.crest(s.clubs[hi], 'lg') + UI.clubLink(hi, { crest: false }) + '</div>' +
      '<div><span class="comp">' + esc(mt.meta.compName) + '</span><div class="score" id="mt-score">0 - 0</div><span class="clock" id="mt-clock">KICK OFF</span><span class="comp" id="mt-agg"></span></div>' +
      '<div class="team away">' + UI.clubLink(ai, { crest: false }) + UI.crest(s.clubs[ai], 'lg') + '</div></div>' +
      '<div class="match-layout"><div class="stack"><div class="card" style="padding:10px"><div class="pitch-wrap"><canvas id="pitch-canvas"></canvas><div id="mt-goal"></div></div>' +
      '<div class="momentum" id="mt-momentum" title="Momentum: who has been attacking"></div>' +
      '<div class="match-ctl"><button class="btn" data-act="mtPause" id="mt-pause">' + UI.icon('pause') + ' Pause</button>' +
      '<div class="seg">' + SPEEDS.map(x => '<button class="' + (x[0] === speed ? 'on' : '') + '" data-act="mtSpeed" data-v="' + x[0] + '">' + x[1] + '</button>').join('') + '</div>' +
      '<span class="spacer"></span><button class="btn" data-act="mtSubs" id="mt-subs">' + UI.icon('sub') + ' Substitutions</button><button class="btn" data-act="mtSkip">Skip to full time</button></div>' +
      '<div class="match-ctl"><span class="small muted">Mentality</span><div class="seg" id="mt-ment"></div><label class="check small"><input type="checkbox" data-act="mtLiveAutoSubs"' + (S().tactics.autoSubs !== false ? ' checked' : '') + '> Assistant makes subs</label></div></div></div>' +
      '<div class="card flush"><div class="tabs" style="padding:0 10px;margin-bottom:0" id="mt-tabs">' + [['feed', 'Commentary'], ['stats', 'Stats'], ['ratings', 'Ratings'], ['scores', 'Other scores']].map(t =>
        '<a class="tab' + (t[0] === mt.tab ? ' active' : '') + '" data-act="mtTab" data-v="' + t[0] + '">' + t[1] + '</a>').join('') + '</div><div id="mt-panel" style="padding:12px 14px"></div></div></div>';
  }
  function mountLive() {
    const s = S(), c = mt.cfg;
    if (mt.renderer) mt.renderer.destroy();
    mt.renderer = Pitch.create($('#pitch-canvas'), { home: { kit: c.home.kit, formation: c.home.formation }, away: { kit: c.away.kit, formation: c.away.formation } });
    syncPlayers();
    mt.feedEl = null;
    updateAll(true);
    startLoop();
  }
  function syncPlayers() {
    const st = mt.live.state();
    ['home', 'away'].forEach(k => {
      const list = [];
      const bySlot = {};
      st[k].lineup.forEach(p => { if (!p.off) bySlot[p.slot] = p; });
      Object.keys(bySlot).forEach(sl => { const p = bySlot[sl]; list.push({ slot: +sl, role: p.role, num: +sl + 1, name: p.short, off: false }); });
      mt.renderer.setPlayers(k, list);
    });
  }
  function startLoop() {
    stopLoop();
    const ms_ = (SPEEDS.find(x => x[0] === speed) || SPEEDS[1])[2];
    mt.timer = setInterval(tick, ms_);
  }
  function stopLoop() { if (mt && mt.timer) { clearInterval(mt.timer); mt.timer = null; } }
  function tick() {
    if (!mt || mt.phase !== 'live' || mt.paused) return;
    const lv = mt.live;
    if (lv.halfTime) { stopLoop(); mt.renderer.freeze('HALF TIME'); updateAll(); openTalk(); return; }
    if (lv.finished) { endMatch(); return; }
    const prev = { hg: lv.score.hg, ag: lv.score.ag };
    const evs = lv.step();
    const ms_ = (SPEEDS.find(x => x[0] === speed) || SPEEDS[1])[2];
    if (evs.some(e => e.type === 'sub' || e.type === 'red')) syncPlayers();
    mt.renderer.minute({ poss: lv.poss, events: evs, duration: ms_ * 0.95, attack: lv.momentum[lv.momentum.length - 1] !== 0 });
    const goal = evs.find(e => e.type === 'goal');
    const inj = evs.find(e => e.type === 'injury' && e.side === mt.userKey);
    if (goal) {
      // keep the scoreboard (and commentary) quiet until the ball is in the net, then let the moment breathe
      mt.shown = prev;
      setTimeout(() => { if (!mt || mt.phase !== 'live') return; mt.shown = null; showGoal(goal); updateAll(); }, ms_ * 0.8);
      if (speed <= 4) { stopLoop(); setTimeout(() => { if (mt && mt.phase === 'live' && !mt.paused) startLoop(); }, ms_ + 1400); }
    } else mt.shown = null;
    updateAll();
    if (inj) {
      const me = lv.state()[mt.userKey].lineup.find(p => p.id === inj.playerId);
      if (me && me.needsSub) { mt.paused = true; UI.toast(me.name + ' is injured — make a substitution.', 'bad'); openSubs(); }
    }
    if (lv.finished) endMatch();
  }
  function showGoal(g) {
    const box = $('#mt-goal'); if (!box) return;
    const side = mt.cfg[g.side];
    const mine = side.isUser;
    box.innerHTML = '<div class="goal-flash" style="color:' + (mine ? '#fff' : '#ffd0d0') + '">GOAL!<div style="font-size:18px;font-weight:700;margin-top:-10px">' + esc(g.scorer || '') + '</div></div>';
  }
  function clockText() {
    const lv = mt.live;
    if (lv.finished) return 'FULL TIME';
    if (lv.halfTime) return 'HALF TIME';
    return lv.minute + "'" + (lv.extraTime ? ' ET' : '');
  }
  function updateAll() {
    if (!mt || !$('#mt-score')) return;
    const lv = mt.live, sc = mt.shown || lv.score, st = lv.state();
    $('#mt-score').textContent = sc.hg + ' - ' + sc.ag;
    $('#mt-clock').textContent = clockText();
    const t = mt.meta.tie;
    if (t && mt.meta.leg === 1 && t.l1h != null) $('#mt-agg').textContent = 'Aggregate ' + (sc.hg + t.l1a) + '-' + (sc.ag + t.l1h);
    // mentality control
    const um = st[mt.userKey].mentality;
    $('#mt-ment').innerHTML = [[-2, 'V.Def'], [-1, 'Def'], [0, 'Bal'], [1, 'Att'], [2, 'V.Att']].map(x => '<button class="' + (x[0] === um ? 'on' : '') + '" data-act="mtLiveMent" data-v="' + x[0] + '">' + x[1] + '</button>').join('');
    $('#mt-subs').innerHTML = UI.icon('sub') + ' Subs (' + st[mt.userKey].subsLeft + ' left)';
    $('#mt-pause').innerHTML = mt.paused ? UI.icon('play') + ' Resume' : UI.icon('pause') + ' Pause';
    // momentum (last 30 minutes)
    const mom = lv.momentum.slice(-30), hk = mt.cfg.home.kit[0], ak = mt.cfg.away.kit[0];
    $('#mt-momentum').innerHTML = mom.map(v => '<i style="height:' + (v ? 100 : 18) + '%;background:' + (v > 0 ? hk : v < 0 ? ak : '#2a3550') + ';align-self:' + (v < 0 ? 'flex-end' : v > 0 ? 'flex-start' : 'center') + '"></i>').join('');
    renderPanel(st);
    UI.renderShell();
  }
  function renderPanel(st) {
    const p = $('#mt-panel'); if (!p) return;
    const lv = mt.live;
    if (mt.tab === 'feed') {
      const f = lv.feed.filter(x => x.text && !(mt.shown && x.minute >= lv.minute));
      p.innerHTML = '<div class="feed">' + f.slice().reverse().map(x => '<div class="ln ' + x.type + '"><span class="m">' + (x.minute ? x.minute + "'" : '') + '</span><span class="t">' + esc(x.text) + '</span></div>').join('') + '</div>';
    } else if (mt.tab === 'stats') {
      const s = st.stats, hk = mt.cfg.home.kit[0], ak = mt.cfg.away.kit[0];
      const line = (lab, a, b, fmt) => { const t = (a + b) || 1; return '<div class="statline" style="--home:' + hk + ';--away:' + ak + '"><b class="num">' + (fmt ? fmt(a) : a) + '</b><div><div class="lab">' + lab + '</div><div class="bars"><span><i style="width:' + (a / t * 100) + '%"></i></span><span><i style="width:' + (b / t * 100) + '%"></i></span></div></div><b>' + (fmt ? fmt(b) : b) + '</b></div>'; };
      p.innerHTML = line('Possession %', s.possHome, s.possAway) + line('Shots', s.shotsHome, s.shotsAway) + line('On target', s.sotHome, s.sotAway) +
        line('Expected goals', s.xgHome, s.xgAway, v => v.toFixed(2)) + line('Corners', s.cornersHome, s.cornersAway) + line('Fouls', s.foulsHome, s.foulsAway) +
        line('Yellow cards', s.yellowsHome, s.yellowsAway) + line('Red cards', s.redsHome, s.redsAway);
    } else if (mt.tab === 'ratings') {
      const col = k => '<div><div class="bold small" style="margin-bottom:6px">' + UI.meName(st[k].name) + '</div><div class="lineup-list">' + st[k].lineup.map(x => '<div class="lp' + (x.off ? ' off' : '') + '"><span class="pos ' + x.role + '">' + x.role + '</span><span class="ellip">' +
        esc(x.short) + (x.goals ? ' ⚽' + (x.goals > 1 ? '×' + x.goals : '') : '') + (x.yc ? ' <span class="tag ban">Y</span>' : '') + (x.rc ? ' <span class="tag inj">R</span>' : '') + (x.injured ? ' <span class="tag inj">Inj</span>' : '') +
        (x.cameOn ? ' <span class="tiny good">' + x.cameOn + "'</span>" : '') + '</span>' + UI.fitBar(x.cond) + UI.rating(x.rating) + '</div>').join('') + '</div></div>';
      p.innerHTML = '<div class="grid cols-2">' + col('home') + col('away') + '</div>';
    } else {
      const m = mt.live.minute;
      if (!mt.ticker.length) { p.innerHTML = '<div class="muted small">No other matches in your competition today.</div>'; return; }
      p.innerHTML = '<div class="ticker">' + mt.ticker.map((g, i) => {
        const h = g.goals.filter(x => x.side === 'home' && x.minute <= m).length, a = g.goals.filter(x => x.side === 'away' && x.minute <= m).length;
        const key = h + '-' + a, flash = mt.tickerShown[i] != null && mt.tickerShown[i] !== key;
        mt.tickerShown[i] = key;
        return '<div class="tk' + (flash ? ' flash' : '') + '"><span class="h ellip">' + UI.meName(g.home) + '</span><span class="sc">' + key + '</span><span class="ellip">' + UI.meName(g.away) + '</span></div>';
      }).join('') + '</div>';
    }
  }
  UI.acts.mtTab = el => { mt.tab = el.dataset.v; document.querySelectorAll('#mt-tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.v === mt.tab)); renderPanel(mt.live.state()); };
  UI.acts.mtPause = () => { mt.paused = !mt.paused; if (!mt.paused && !mt.timer && !mt.live.halfTime) startLoop(); updateAll(); };
  UI.acts.mtSpeed = el => {
    speed = +el.dataset.v; try { localStorage.setItem('simsoc6.speed', String(speed)); } catch (e) { /* ignore */ }
    document.querySelectorAll('.match-ctl .seg button[data-act="mtSpeed"]').forEach(b => b.classList.toggle('on', +b.dataset.v === speed));
    if (mt && mt.timer) startLoop();
  };
  UI.acts.mtSkip = () => skipToEnd();
  UI.acts.mtLiveMent = el => { mt.live.setMentality(mt.userKey, +el.dataset.v); S().tactics.mentality = +el.dataset.v; updateAll(); };
  UI.acts.mtLiveAutoSubs = el => { mt.live.setAutoSubs(mt.userKey, el.checked); S().tactics.autoSubs = el.checked; };
  UI.acts.mtSubs = () => openSubs();

  function openSubs() {
    const st = mt.live.state()[mt.userKey];
    if (st.subsLeft <= 0) { UI.toast('You have used all your substitutions.'); if (mt.paused && !mt.live.halfTime) { mt.paused = false; updateAll(); } return; }
    const wasPaused = mt.paused; mt.paused = true;
    const on = st.lineup.filter(p => !p.off), bench = st.bench;
    const need = on.find(p => p.needsSub);
    UI.modal({ title: 'Substitution (' + st.subsLeft + ' left)', body:
      '<div class="grid cols-2"><label class="field"><span>Take off</span><select class="input" id="sub-off">' + on.map(p => '<option value="' + p.id + '"' + (need && need.id === p.id ? ' selected' : '') + '>' + esc(p.role + ' · ' + p.name + ' (' + p.rating.toFixed(1) + ', fit ' + p.cond + '%)' + (p.injured ? ' — INJURED' : '')) + '</option>').join('') + '</select></label>' +
      '<label class="field"><span>Bring on</span><select class="input" id="sub-on">' + bench.map(p => '<option value="' + p.id + '">' + esc(p.pos + ' · ' + p.name + ' (skill ' + p.skill + ')') + '</option>').join('') + '</select></label></div>' +
      '<p class="small muted">The substitute takes over the same position on the pitch.</p>',
      buttons: [{ label: 'Cancel', cls: 'ghost', onClick: () => { mt.paused = wasPaused && !need; updateAll(); } },
        { label: 'Make substitution', primary: true, onClick: () => {
          const r = mt.live.substitute(mt.userKey, +$('#sub-off').value, +$('#sub-on').value);
          if (!r.ok) UI.toast(r.msg, 'bad'); else syncPlayers();
          mt.paused = wasPaused && false; updateAll();
        } }] });
  }

  /* ---- half-time team talk ------------------------------------------- */
  function openTalk() {
    const lv = mt.live, sc = lv.score, us = mt.userKey === 'home' ? sc.hg - sc.ag : sc.ag - sc.hg;
    const sit = us > 0 ? 'You lead ' + Math.max(sc.hg, sc.ag) + '-' + Math.min(sc.hg, sc.ag) + ' at the break.' : us < 0 ? 'You trail ' + Math.min(sc.hg, sc.ag) + '-' + Math.max(sc.hg, sc.ag) + ' at the break.' : 'It is level at ' + sc.hg + '-' + sc.ag + ' at half-time.';
    let close = null;
    const talk = kind => {
      const r = lv.teamTalk(kind);
      if (close) close();
      if (r.ok) UI.toast(r.text, r.effect >= 0.015 ? 'good' : r.effect < -0.005 ? 'bad' : '');
      mt.renderer.freeze(false); mt.paused = false; updateAll(); startLoop();
    };
    UI._talk = talk;
    close = UI.modal({ title: 'Half-time team talk', dismiss: false, body: '<p style="margin-top:0">' + esc(sit) + ' What do you tell the players?</p><div class="talk-opts">' +
      [['praise', 'Praise', 'Well done — keep it up. Best when you are ahead.'], ['encourage', 'Encourage', 'Calm, positive words. Rarely goes wrong.'],
        ['demand', 'Demand more', 'Fire them up. Works when a better side is not winning.'], ['calm', 'Calm down', 'Keep heads cool to protect a lead.']]
        .map(o => '<button data-act="mtTalk" data-v="' + o[0] + '"><b>' + o[1] + '</b><span class="small muted">' + o[2] + '</span></button>').join('') + '</div>',
      buttons: [{ label: 'Encourage (default)', primary: true, onClick: () => { talk('encourage'); return false; } }] });
  }
  UI.acts.mtTalk = el => { if (UI._talk) UI._talk(el.dataset.v); };

  /* ---- end of the match ---------------------------------------------- */
  function skipToEnd() {
    if (!mt || mt.phase !== 'live') return;
    stopLoop();
    const bd = document.querySelector('#modal-root .backdrop'); if (bd) bd.remove(); UI._modalPrimary = null;
    if (mt.live.halfTime) mt.live.teamTalk('encourage');
    mt.live.runToEnd();
    endMatch();
  }
  function commit() {
    if (mt.committed) return;
    const s = S();
    const match = E.liveToMatch(s, mt.meta, mt.live);
    E.commitUserResult(s, match);
    mt.committed = true; mt.match = match;
    UI.save();
  }
  function endMatch() {
    stopLoop();
    if (mt.renderer) { mt.renderer.destroy(); mt.renderer = null; }
    commit();
    mt.phase = 'fulltime';
    UI.flushNotices();
    UI.render();
  }
  function finishAndLeave() {
    mt = null;
    UI.go('roundup');
  }
  function fullTimeView() {
    const s = S();
    if (mt.forfeit) {
      const m = mt.forfeit;
      return '<div class="scorebar"><div class="team">' + UI.clubByName(m.homeName) + '</div><div><div class="score">' + m.hg + ' - ' + m.ag + '</div><span class="clock">WALKOVER</span></div><div class="team away">' + UI.clubByName(m.awayName) + '</div></div>' +
        card('', '<p>You could not field eight fit players, so the match was awarded to your opponents.</p><button class="btn go" data-act="mtDone">Continue ▸</button>');
    }
    const r = mt.live.result(), st = mt.live.state(), c = mt.cfg;
    const hi = E.clubIndexByName(s, c.home.name), ai = E.clubIndexByName(s, c.away.name);
    const scorers = side => r.events.filter(e => e.side === side).map(e => esc(e.scorer.split(' ').slice(-1)[0]) + ' ' + e.minute + "'" + (e.pen ? ' (pen)' : '')).join(', ') || '&nbsp;';
    const us = mt.userKey, gf = us === 'home' ? r.hg : r.ag, ga = us === 'home' ? r.ag : r.hg;
    const verdict = gf > ga ? '<span class="good">Victory!</span>' : gf === ga ? 'A draw.' : '<span class="bad">Defeat.</span>';
    const lr = s.lastResult || {};
    const tieNote = lr.winnerName ? '<div class="small" style="margin-top:6px">' + (lr.agg ? 'Aggregate ' + esc(lr.agg) + ' · ' : '') + UI.meName(lr.winnerName) + ' go through' + (lr.pens ? ' on penalties' : '') + '</div>' : '';
    const shoot = r.shootout ? '<div class="small" style="margin-top:6px">Penalties: ' + r.shootout.home + '-' + r.shootout.away + '</div>' : '';
    const rat = k => st[k].lineup.slice().sort((a, b) => b.rating - a.rating).map(x => '<div class="lp' + (x.off && !x.cameOn ? '' : '') + '"><span class="pos ' + x.role + '">' + x.role + '</span><span class="ellip">' +
      '<a class="player-link" data-go="player/' + x.id + '">' + esc(x.name) + '</a>' + (x.goals ? ' ⚽' + (x.goals > 1 ? '×' + x.goals : '') : '') + (x.assists ? ' <span class="tiny muted">A' + x.assists + '</span>' : '') + '</span><span></span>' + UI.rating(x.rating) + '</div>').join('');
    const sts = r.stats;
    const statRow = (l, a, b) => '<tr><td class="num">' + a + '</td><td class="center muted small">' + l + '</td><td>' + b + '</td></tr>';
    return '<div class="scorebar"><div class="team">' + UI.crest(s.clubs[hi], 'lg') + UI.clubLink(hi, { crest: false }) + '</div><div><span class="comp">' + esc(mt.meta.compName) + '</span>' +
      '<div class="score">' + r.hg + ' - ' + r.ag + '</div><span class="clock">' + (r.extraTime ? 'AFTER EXTRA TIME' : 'FULL TIME') + '</span></div><div class="team away">' + UI.clubLink(ai, { crest: false }) + UI.crest(s.clubs[ai], 'lg') + '</div></div>' +
      '<div class="row small muted" style="margin:-4px 0 14px"><span style="flex:1;text-align:right">' + scorers('home') + '</span><span style="width:60px"></span><span style="flex:1">' + scorers('away') + '</span></div>' +
      '<div class="grid cols-3">' + card('Result', '<div style="font-size:22px;font-weight:800">' + verdict + '</div>' + tieNote + shoot +
        (r.potm ? '<div style="margin-top:12px" class="small muted">Player of the match</div><div class="bold">' + esc(r.potm.name) + ' ' + UI.rating(r.potm.rating) + '</div>' : '') +
        '<div style="margin-top:16px"><button class="btn go lg" data-act="mtDone">Continue ▸</button></div>') +
      card('Match stats', '<table class="tbl compact"><tbody>' + statRow('Possession %', sts.possHome, sts.possAway) + statRow('Shots', sts.shotsHome, sts.shotsAway) + statRow('On target', sts.sotHome, sts.sotAway) +
        statRow('xG', sts.xgHome.toFixed(2), sts.xgAway.toFixed(2)) + statRow('Corners', sts.cornersHome, sts.cornersAway) + statRow('Fouls', sts.foulsHome, sts.foulsAway) +
        statRow('Bookings', sts.yellowsHome, sts.yellowsAway) + statRow('Sent off', sts.redsHome, sts.redsAway) + '</tbody></table>') +
      card('Player ratings — ' + UI.meName(st[us].name), '<div class="lineup-list">' + rat(us) + '</div>') + '</div>' +
      '<div style="height:16px"></div>' + card('Match report', '<div class="feed" style="height:260px">' + r.feed.slice().reverse().map(x => '<div class="ln ' + x.type + '"><span class="m">' + (x.minute ? x.minute + "'" : '') + '</span><span class="t">' + esc(x.text) + '</span></div>').join('') + '</div>');
  }
  UI.acts.mtDone = () => finishAndLeave();
})();

</script>
</body>
</html>
