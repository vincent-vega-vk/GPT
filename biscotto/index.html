<style>
/* Layout: one fixed screen. Name on top, the cookie on its lacquer table in the middle, one line of instruction or two buttons at the bottom. */
:root{
  --lacquer:#6d1010; --lacquer-deep:#2e0606;
  --gold:#f2c45a; --gold-dim:#c99a3a; --paper:#fbf6e6; --ink:#1c3a8a; --cream:#fdebc8;
  --font-display:"Bowlby One","Arial Black",Impact,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-slip:"Courier Prime","Courier New",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
html{background:var(--lacquer-deep)}
body{margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  background:radial-gradient(120% 80% at 50% 38%,var(--lacquer) 0%,var(--lacquer-deep) 78%);
  color:var(--cream);font-family:var(--font-body);font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-block:14px 18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(24px,7.4vw,34px);line-height:1;
  letter-spacing:.01em;color:var(--gold);text-wrap:balance;text-shadow:0 2px 0 var(--lacquer-deep)}
.tally{margin:8px 0 0;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cream);opacity:.8}
.mute{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--gold-dim);background:transparent;
  color:var(--gold);font-size:19px;line-height:1;cursor:pointer;padding:0}

.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  touch-action:none;cursor:pointer;outline:none;border-radius:20px}
.stage:focus-visible,.mute:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.scene{width:100%;max-width:440px;max-height:100%;overflow:visible;display:block;pointer-events:none}

.slip{position:absolute;left:50%;top:10%;width:min(94%,390px);padding:22px 20px;
  background:
    linear-gradient(90deg,rgba(0,0,0,.06),rgba(0,0,0,0) 4%,rgba(0,0,0,0) 49.4%,rgba(0,0,0,.08) 50%,rgba(0,0,0,0) 50.6%,rgba(0,0,0,0) 96%,rgba(0,0,0,.06)),
    var(--paper);
  color:var(--ink);font-family:var(--font-slip);text-align:center;
  border-inline:7px solid var(--ink);box-shadow:0 14px 30px rgba(0,0,0,.45);
  transform:translate(-50%,0) rotate(var(--rot,-2deg));opacity:0;pointer-events:none}
.slip.show{opacity:1;pointer-events:auto;-webkit-user-select:text;user-select:text}
.fortune{margin:0;font-weight:700;font-size:clamp(18px,5.3vw,22px);line-height:1.3;text-wrap:balance}
.fortune.long{font-size:clamp(16px,4.7vw,19px)}

.bottom{min-height:64px;display:flex;align-items:center;justify-content:center}
.hint{margin:0;text-align:center;font-weight:700;font-size:17px;color:var(--cream);text-wrap:balance}
.hint span{display:block;font-weight:500;font-size:13px;opacity:.7}
.actions{display:flex;gap:10px;width:100%}
.btn{flex:1;min-height:54px;border-radius:14px;border:2px solid var(--gold);cursor:pointer;
  font-family:var(--font-display);font-size:16px;letter-spacing:.02em;padding:8px 10px}
.btn-main{background:var(--gold);color:var(--lacquer-deep)}
.btn-ghost{flex:0 1 38%;background:transparent;color:var(--gold)}
.btn:active{transform:translateY(2px)}
.haptic{position:fixed;left:-200px;top:0;opacity:0;pointer-events:none}

</div>

const str = pts => pts.map(p => n1(p[0]) + "," + n1(p[1])).join(" ");
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const NS = "http://www.w3.org/2000/svg";

  const e = document.createElementNS(NS, tag);

}

const last = {};
function pickNew(key, arr) {

function mk(deg, sc, cx, cy, dx, dy) {

const mstr = m => "matrix(" + m.map(v => +v.toFixed(5)).join(" ") + ")";

const stage = $("stage"), scene = $("scene"), slip = $("slip");
const backLayer = $("backLayer"), cookieLayer = $("cookieLayer"), frontLayer = $("frontLayer"), fxLayer = $("fxLayer"), dyn = $("dyn");
const hint = $("hint"), actions = $("actions");

function ctm() { const c = scene.getScreenCTM(); return [c.a, c.b, c.c, c.d, c.e, c.f]; }
const toScene = (cx, cy) => ap(inv(ctm()), cx, cy);

/* ---------- ragged cuts ----------

   It never doubles back, so each side of it is a simple polygon. */
function cutPoint(c, s, d) { return [c.o[0] + c.u[0] * s + c.n[0] * d, c.o[1] + c.u[1] * s + c.n[1] * d]; }

  const p = c.pts, L = p.length - 1;
  if (s <= p[0][0]) return p[0][1];
  if (s >= p[L][0]) return p[L][1];
  let i = 1;
  while (p[i][0] < s) i++;
  const a = p[i - 1], b = p[i];
  return a[1] + (b[1] - a[1]) * (s - a[0]) / ((b[0] - a[0]) || 1);
}

  const rx = x - c.o[0], ry = y - c.o[1];

}
function sidePoly(c, side, widths) {
  const p = c.pts, L = p.length - 1, B = 900, out = [];
  const w = i => (widths ? side * widths[i] : 0);
  out.push(cutPoint(c, p[0][0] - B, p[0][1] + w(0)));
  for (let i = 0; i <= L; i++) out.push(cutPoint(c, p[i][0], p[i][1] + w(i)));
  out.push(cutPoint(c, p[L][0] + B, p[L][1] + w(L)));

function randomCut(o, ang, half, step, drift, jag) {
  const u = [Math.cos(ang), Math.sin(ang)], n = [-u[1], u[0]];

    const a = [];
    let s = 0, d = 0, slope = R(-drift, drift);

      const ds = R(step * 0.6, step * 1.4);
      s += ds;
      slope = slope * 0.65 + R(-drift, drift) * 0.55;
      d += slope * ds + R(-jag, jag);

}

/* ---------- sound + haptics ---------- */

  const a = audio(); if (!a) return;

/* one continuous hiss whose volume follows how fast the foil is tearing */

     { transform: "translate(" + R(-3, 3).toFixed(1) + "px,-2px) rotate(" + R(-2, 2).toFixed(1) + "deg)" }, { transform: "none" }],
    { duration: 230, easing: "ease-out" });

  const c = ck.cut, len = 24 + 64 * ck.hits / ck.need, a = -len * ck.ext[0], b = len * ck.ext[1];
  if (ck.main) { ck.main.previousSibling.remove(); ck.main.remove(); }
  ck.main = crackLine(cutLine(c, a, b), 2.3);
  const axis = Math.atan2(c.u[1], c.u[0]);
  for (let k = 0, n = 1 + Math.floor(R(0, 3)); k < n; k++) {
    const s = R(a, b), o = cutPoint(c, s, cutD(c, s));
    twig(o[0], o[1], axis + flip() * R(0.5, 1.3) + (Math.random() < 0.5 ? Math.PI : 0), R(8, 26));
  }
  if (Math.hypot(p[0] - ck.hit[0], p[1] - ck.hit[1]) > 12)
    for (let k = 0, n = 2 + Math.floor(R(0, 3)), a0 = R(0, 6.28); k < n; k++) twig(p[0], p[1], a0 + k * 6.28 / n + R(-0.4, 0.4), R(7, 18));
  const H = ap(ck.M, p[0], p[1]);
  spawnCrumbs(H, 3 + Math.floor(R(0, 4)), 0.55);
}
function spawnCrumbs(H, n, power) {
  if (calm) return;
  for (let i = 0; i < n && fxLayer.childElementCount < 70; i++) {
    const r = R(1.2, 4.2), k = 3 + Math.floor(R(0, 3)), pts = [];
    for (let j = 0; j < k; j++) { const a = j / k * 6.283 + R(-0.4, 0.4), q = r * R(0.6, 1); pts.push([H[0] + Math.cos(a) * q, H[1] + Math.sin(a) * q]); }
    const e = el("polygon", { points: str(pts), fill: pick(ck.tones) }, fxLayer);
    const ang = R(-2.9, -0.25), sp = R(60, 330) * power;
    addBody({ els: [e], cx: H[0], cy: H[1], r: r * 0.6, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, va: R(-900, 900),
      floor: 272 + R(-10, 12), rest: 0.2, wl: 4, wr: 356 });
  }
}
function dust(H) {
  if (calm) return;
  for (let i = 0; i < 7; i++) {
    const e = el("circle", { cx: n1(H[0]), cy: n1(H[1]), r: n1(R(5, 11)), fill: ck.pale, opacity: 0, style: "transform-box:fill-box;transform-origin:center" }, fxLayer);
    if (!e.animate) { e.remove(); continue; }
    e.animate([{ transform: "translate(0,0) scale(.3)", opacity: 0.5 },
               { transform: "translate(" + R(-60, 60).toFixed(0) + "px," + R(-50, 10).toFixed(0) + "px) scale(" + R(1.6, 2.6).toFixed(1) + ")", opacity: 0 }],
              { duration: R(420, 820), easing: "ease-out" }).onfinish = () => e.remove();
  }
}
function breakCookie() {
  state = "open";
  const c = ck.cut;
  const sides = { 1: [[[c, 1]]], "-1": [[[c, -1]]] };
  const extra = pick([0, 1, 1, 1, 2, 2]), order = Math.random() < 0.5 ? [1, -1] : [-1, 1];
  for (let k = 0; k < extra; k++) {
    const side = order[k], s0 = R(-42, 42), o2 = cutPoint(c, s0, cutD(c, s0));
    const c2 = randomCut(o2, Math.atan2(c.u[1], c.u[0]) + flip() * R(0.75, 1.45), 260, 9, 0.28, 2.2);
    sides[side] = [[[c, side], [c2, 1]], [[c, side], [c2, -1]]];
  }
  const parts = sides[1].concat(sides[-1]);
  const stats = parts.map(() => ({ n: 0, sx: 0, sy: 0, pts: [] }));
  let total = 0;
  for (let y = 78; y <= 246; y += 6) for (let x = 48; x <= 312; x += 6) {
    if (!inCookie(x, y)) continue;
    total++;
    for (let i = 0; i < parts.length; i++) {
      if (parts[i].every(q => cutSide(q[0], x, y) === q[1])) { const st = stats[i]; st.n++; st.sx += x; st.sy += y; st.pts.push([x, y]); break; }
    }
  }
  ck.wob.remove();
  $("shadow").setAttribute("opacity", 0.14);
  const H = ap(ck.M, ck.hit[0], ck.hit[1]);
  sfx.snap(); sfx.paper(); buzz(60);
  clacks = 0;

  parts.forEach((cons, i) => {
    const st = stats[i];
    if (st.n < 5) { if (st.n) spawnCrumbs(ap(ck.M, st.sx / st.n, st.sy / st.n), 4, 0.6); return; }
    const cx = st.sx / st.n, cy = st.sy / st.n;
    let rmax = 0;
    for (const q of st.pts) rmax = Math.max(rmax, Math.hypot(q[0] - cx, q[1] - cy));
    const g = el("g", {}, cookieLayer);
    let host = el("g", { transform: mstr(ck.M), "clip-path": addClip(sidePoly(cons[0][0], cons[0][1])) }, g);
    if (cons[1]) host = el("g", { "clip-path": addClip(sidePoly(cons[1][0], cons[1][1])) }, host);
    use("cookieArt", host);
    const rimG = el("g", { "clip-path": "url(#cookieClip)", fill: "none", "stroke-linejoin": "round" }, host);
    for (const q of cons) {
      const line = str(cutLine(q[0], -230, 230));
      el("polyline", { points: line, stroke: ck.pale, "stroke-width": 7 }, rimG);
      el("polyline", { points: line, stroke: ck.rim, "stroke-width": 1.5, opacity: 0.75 }, rimG);
    }
    const C = ap(ck.M, cx, cy);
    let ox = C[0] - H[0], oy = C[1] - H[1];
    const d = Math.hypot(ox, oy) || 1; ox /= d; oy /= d;
    const small = 1 - st.n / total, sp = R(110, 190) * (0.7 + small);
    const floor = 268 + R(-5, 7), r = Math.max(8, rmax * 0.55 * ck.sc);
    const b = { els: [g], cx: C[0], cy: C[1], r, vx: ox * sp + R(-25, 25), vy: oy * sp * 0.5 - R(140, 260),
      va: (ox >= 0 ? 1 : -1) * R(90, 260) * (0.6 + small * 1.6) * (Math.random() < 0.2 ? -1 : 1),
      floor, rest: R(0.2, 0.34), wl: 22 + r, wr: 338 - r, clack: true };
    if (calm) { b.x = clamp(C[0] + ox * 80, b.wl, b.wr) - C[0]; b.y = floor - r - C[1]; b.a = R(-35, 35); place(b); }
    else addBody(b);
  });
  spawnCrumbs(H, 14 + Math.floor(R(0, 10)), 1);
  dust(H);
  showSlip(H);
  count++; store.set("bds.count", count); renderTally();
  hint.hidden = true; actions.hidden = false;
  stage.setAttribute("aria-label", "Bigliettino: " + current);
}

/* ---------- the slip ---------- */
let current = "", deck = null, deckOrder = null;
function mulberry(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
/* every slip comes out once before any repeats: a shuffled deck remembered as seed + position */
function nextFortune() {
  const N = FORTUNES.length;
  if (!deck) deck = store.get("bds.deck", null);
  if (!deck || deck.n !== N || !(deck.pos >= 0 && deck.pos < N)) { deck = { seed: Math.floor(Math.random() * 2147483647), pos: 0, n: N }; deckOrder = null; }
  if (!deckOrder) {
    const rnd = mulberry(deck.seed);
    deckOrder = FORTUNES.map((_, i) => i);
    for (let i = N - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = deckOrder[i]; deckOrder[i] = deckOrder[j]; deckOrder[j] = t; }
  }
  const text = FORTUNES[deckOrder[deck.pos]];
  deck.pos++;
  if (deck.pos >= N) { deck = { seed: Math.floor(Math.random() * 2147483647), pos: 0, n: N }; deckOrder = null; }
  store.set("bds.deck", deck);
  return text;
}
function showSlip(H) {
  current = nextFortune();
  const f = $("fortune");
  f.textContent = current;
  f.classList.toggle("long", current.length > 92);
  const rot = R(-4, 4);
  slip.style.setProperty("--rot", rot.toFixed(1) + "deg");
  slip.style.setProperty("--ink", pickNew("ink", INKS));
  slip.style.top = R(6, 13).toFixed(1) + "%";
  slip.classList.add("show");
  if (calm || !slip.animate) return;
  const sr = stage.getBoundingClientRect(), w = slip.offsetWidth, h = slip.offsetHeight, c = toClient(H[0], H[1]);
  const tx = c[0] - (sr.left + slip.offsetLeft + w / 2), ty = c[1] - (sr.top + slip.offsetTop + h / 2);
  slip.animate([
    { transform: "translate(" + tx.toFixed(1) + "px," + ty.toFixed(1) + "px) scale(.06) rotate(" + R(-50, 50).toFixed(0) + "deg)", opacity: 0 },
    { opacity: 1, offset: 0.2 },
    { transform: "translate(" + (-w / 2).toFixed(1) + "px,0px) scale(1) rotate(" + rot.toFixed(1) + "deg)", opacity: 1 }
  ], { duration: R(620, 820), delay: 150, easing: "cubic-bezier(.2,1.15,.4,1)", fill: "backwards" });
}

/* ---------- rounds ---------- */
let state = "wrapped", count = store.get("bds.count", 0);
function setHint(key) {
  const h = pickNew("hint-" + key, HINTS[key]);
  hint.textContent = h[0];
  const s = document.createElement("span"); s.textContent = h[1]; hint.append(s);
  stage.setAttribute("aria-label", h[0] + ". " + h[1]);
}
function renderTally() {
  $("tally").textContent = "Aperti: " + count + " · " + RANKS.find(r => count >= r[0])[1];
}
function newRound() {
  for (const g of [backLayer, cookieLayer, frontLayer, fxLayer, dyn]) g.textContent = "";
  bodies.length = 0; tear = null; clipN = 0; clacks = 0;
  $("shadow").setAttribute("opacity", 0.28);
  buildCookie();
  buildWrapper();
  setHint("wrapped");
}
function reset() {
  state = "busy";
  slip.classList.remove("show");
  actions.hidden = true; hint.hidden = false;
  scene.style.visibility = "hidden";
  setTimeout(() => {
    newRound();
    scene.style.visibility = "";
    if (!calm && scene.animate) scene.animate(pick(ENTRIES), { duration: R(420, 560), easing: "cubic-bezier(.2,1.3,.5,1)" });
    sfx.crinkle();
    setTimeout(() => { state = "wrapped"; }, calm ? 0 : 380);
  }, calm ? 20 : 160);
}

/* ---------- input ---------- */
let down = null, fling = [0, 0];
stage.addEventListener("pointerdown", e => {
  if (state !== "wrapped" && state !== "cookie") return;
  const s = toScene(e.clientX, e.clientY), l = ap(wr.Mi, s[0], s[1]);
  down = { x: e.clientX, y: e.clientY, sx0: s[0], sy0: s[1], sx: s[0], sy: s[1], ax: l[0], ay: l[1], moved: 0, t: performance.now() };
  fling = [0, 0];
  try { stage.setPointerCapture(e.pointerId); } catch {}
  audio();
});
stage.addEventListener("pointermove", e => {
  if (!down) return;
  const d = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  if (d <= 0) return;
  down.x = e.clientX; down.y = e.clientY; down.moved += d;
  const s = toScene(e.clientX, e.clientY), now = performance.now(), dt = Math.max(8, now - down.t) / 1000;
  fling = [clamp((s[0] - down.sx) / dt, -900, 900), clamp((s[1] - down.sy) / dt, -900, 900)];
  const dist = Math.hypot(s[0] - down.sx, s[1] - down.sy);
  down.sx = s[0]; down.sy = s[1]; down.t = now;
  if (state === "wrapped") { const l = ap(wr.Mi, s[0], s[1]); tearMove(l[0], l[1], dist); }
});
function release() {
  if (!down) return;
  const dn = down;
  down = null;
  if (tear) tear.near = false;
  if (state === "wrapped") {
    if (dn.moved < 10) { const l = ap(wr.Mi, dn.sx, dn.sy); tearTap(l[0], l[1]); }
  } else if (state === "cookie") {
    if (dn.moved < 10) hitCookie(dn.sx, dn.sy, null, 1);
    else {
      const dx = dn.sx - dn.sx0, dy = dn.sy - dn.sy0, d = Math.hypot(dx, dy);
      if (d > 14) hitCookie((dn.sx + dn.sx0) / 2, (dn.sy + dn.sy0) / 2, [dx / d, dy / d], 2);
      else hitCookie(dn.sx, dn.sy, null, 1);
    }
  }
}
stage.addEventListener("pointerup", release);
stage.addEventListener("pointercancel", () => { down = null; if (tear) tear.near = false; });
stage.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  e.preventDefault();
  audio();
  if (state === "wrapped") tearTap(R(60, 300), R(90, 230));
  else if (state === "cookie") hitCookie(R(120, 240), R(130, 200), null, 1);
});
document.addEventListener("gesturestart", e => e.preventDefault());

$("again").addEventListener("click", () => { audio(); reset(); });
$("share").addEventListener("click", async () => {
  const btn = $("share");
  const text = "🥠 Il Biscotto della Sfiga dice: «" + current + "»";
  const flash = msg => { btn.textContent = msg; setTimeout(() => { btn.textContent = "Condividi"; }, 1600); };
  try {
    if (navigator.share) { await navigator.share({ text }); return; }
    await navigator.clipboard.writeText(text);
    flash("Copiato");
  } catch (err) {
    if (err && err.name === "AbortError") return;
    try { await navigator.clipboard.writeText(text); flash("Copiato"); }
    catch { flash("Seleziona il testo"); }
  }
});
function renderMute() {
  const b = $("mute");
  b.textContent = muted ? "🔇" : "🔊";
  b.setAttribute("aria-pressed", String(muted));
  b.setAttribute("aria-label", muted ? "Audio spento" : "Audio acceso");
}
$("mute").addEventListener("click", () => {
  muted = !muted; store.set("bds.muted", muted); renderMute();
  if (muted) tearSound(0); else sfx.crinkle();
});

renderMute(); renderTally(); newRound();

try {
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && document.querySelector('link[rel="manifest"]'))
    navigator.serviceWorker.register("sw.js").catch(() => {});
} catch {}
})();
</script>
